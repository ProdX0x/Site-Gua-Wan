name: GuaWan
options:
  bundleIdPrefix: com.guawan
  createIntermediateGroups: true
  generateEmptyDirectories: false
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    tvOS: "18.0"
    visionOS: "2.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    # À renseigner dans Xcode (Signing & Capabilities) avant tout build sur device.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  GuaWanCore:
    path: Packages/GuaWanCore

targets:

  GuaWan-iOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App/Shared
      - path: App/iOS
    dependencies:
      - package: GuaWanCore
    info:
      path: App/iOS/Info.plist
    settings:
      base:
        PRODUCT_NAME: Guà Wàn
        PRODUCT_BUNDLE_IDENTIFIER: com.guawan.app
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  GuaWan-macOS:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: App/Shared
      - path: App/macOS
    dependencies:
      - package: GuaWanCore
    info:
      path: App/macOS/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.lifestyle
    settings:
      base:
        PRODUCT_NAME: Guà Wàn
        PRODUCT_BUNDLE_IDENTIFIER: com.guawan.app.mac
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  GuaWan-tvOS:
    type: application
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: App/Shared
      - path: App/tvOS
    dependencies:
      - package: GuaWanCore
    info:
      path: App/tvOS/Info.plist
    settings:
      base:
        PRODUCT_NAME: Guà Wàn
        PRODUCT_BUNDLE_IDENTIFIER: com.guawan.app.tv
        # tvOS veut un jeu d'icônes empilées très particulier (« App Icon &
        # Top Shelf Image », couches avant/arrière + image Top Shelf), que
        # seul l'éditeur d'assets d'Xcode construit correctement à partir de
        # vraies images — voir ios/App/Shared/Assets.xcassets/README.md.
        # Pas de réglage ASSETCATALOG_COMPILER_APPICON_NAME ici tant que ce
        # jeu d'icônes n'existe pas : Xcode utilisera une icône par défaut.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  GuaWan-visionOS:
    type: application
    platform: visionOS
    deploymentTarget: "2.0"
    sources:
      - path: App/Shared
      - path: App/visionOS
    dependencies:
      - package: GuaWanCore
    info:
      path: App/visionOS/Info.plist
    settings:
      base:
        PRODUCT_NAME: Guà Wàn
        PRODUCT_BUNDLE_IDENTIFIER: com.guawan.app.vision
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  GuaWan-iOS:
    build:
      targets: { GuaWan-iOS: all }
    run:
      config: Debug
    archive:
      config: Release
  GuaWan-macOS:
    build:
      targets: { GuaWan-macOS: all }
    run:
      config: Debug
    archive:
      config: Release
  GuaWan-tvOS:
    build:
      targets: { GuaWan-tvOS: all }
    run:
      config: Debug
    archive:
      config: Release
  GuaWan-visionOS:
    build:
      targets: { GuaWan-visionOS: all }
    run:
      config: Debug
    archive:
      config: Release
