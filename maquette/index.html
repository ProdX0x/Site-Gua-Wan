  "title": "Zhuangzi et Mozi : deux voix chinoises à côté de Confucius",
  "excerpt": "L'un rêve qu'il est papillon et se moque des certitudes, l'autre marche dix jours pour empêcher une guerre : deux penseurs de la Chine antique qui dérangent encore.",

  "repere": "Chine · Ve-IVe siècle av. J.-C.",
  "body": [
   "Dans la Chine des Royaumes combattants, une longue période de guerres entre États rivaux, de nombreux maîtres proposent leurs conseils aux princes. Confucius, mort selon la tradition en 479 av. J.-C., deviendra la figure dominante, surtout après que son école a obtenu la faveur impériale en 136 av. J.-C. Mais d'autres voix ont compté. Mozi, actif au Ve siècle av. J.-C., à peu près à l'époque de Socrate, et Zhuangzi, au IVe siècle, proposent deux réponses opposées à la crise de leur temps. L'un mise sur un souci de tous et des critères clairs pour juger. L'autre mise sur la souplesse et sur la relativité de nos points de vue.",
   "On sait peu de chose de Mozi, « maître Mo ». Il était peut-être charpentier ou artisan, et ses textes regorgent d'exemples tirés des métiers. Pour certains spécialistes, comme Chris Fraser, il mérite plus encore que Confucius le titre de premier philosophe chinois, car il argumente explicitement sur des critères moraux. Sa doctrine centrale, le jian ai, est souvent traduite par « amour universel » ; Fraser préfère « souci inclusif » : se soucier de chacun sans favoritisme, ce qui n'exige pas de se sacrifier. Une action se juge à ses effets sur le bien commun : richesse, population, ordre social. Les mohistes dénoncent aussi les funérailles somptueuses et la musique de cour, qui gaspillent les ressources du peuple.",
   "Mozi est surtout l'un des premiers grands critiques de la guerre. Son raisonnement est simple : tuer un homme est un crime, tuer cent hommes en est cent ; pourquoi alors appeler « juste » l'attaque d'un pays entier ? Les mohistes ne sont pas pour autant des pacifistes naïfs : ils condamnent l'agression mais deviennent experts dans la défense des villes. Un chapitre raconte que Mozi marche dix jours et dix nuits pour dissuader le roi de Chu d'attaquer le petit État de Song. Face à l'ingénieur Gongshu Ban, il simule le siège avec sa ceinture et des tablettes de bois, et repousse ses neuf attaques. Le roi renonce.",
   "Zhuangzi est presque aussi mystérieux. Le livre qui porte son nom a été réorganisé par le lettré Guo Xiang (mort en 312), qui l'a réduit à trente-trois chapitres. Les sept « chapitres intérieurs » sont souvent attribués à Zhuangzi lui-même, mais cela reste une hypothèse ; le reste vient de disciples et d'autres courants. Le livre avance par histoires, dialogues et paradoxes. Le cuisinier Ding découpe des milliers de bœufs sans émousser sa lame en dix-neuf ans, car il suit la structure naturelle de l'animal. Un arbre survit parce qu'il est inutile. Et Zhuangzi débat avec son ami Hui Shi pour savoir si l'on peut connaître la joie des poissons.",
   "Pour Zhuangzi, nos jugements de « juste » et de « faux » dépendent du point de vue d'où l'on parle, et la nature elle-même ne fournit pas d'arbitre définitif. Ce scepticisme reste doux : il invite à élargir le regard plutôt qu'à renoncer à agir. Chaque être suit sa propre voie, dans une spontanéité que les Chinois nomment ziran, « ainsi de soi-même ». Le célèbre rêve du papillon, qui clôt le deuxième chapitre, résume ce vertige. Zhuangzi discute d'ailleurs les thèses des mohistes tardifs : là où ceux-ci cherchent des normes objectives et une logique rigoureuse, il en montre les limites sans les rejeter tout à fait.",
   "Le destin des deux traditions est contrasté. Le mohisme décline après l'unification de la Chine par les Qin, en 221 av. J.-C., et disparaît au milieu de la dynastie des Han. Le livre de Mozi n'a survécu que parce qu'il avait été copié dans le canon taoïste, avant d'être redécouvert à la fin de la dynastie Qing, quand des lettrés cherchaient dans leur tradition des ressources pour la science et la logique. Le Zhuangzi, lui, n'a jamais cessé d'être lu. Son naturalisme a contribué, des siècles plus tard, à façonner le bouddhisme chan, que le Japon connaîtra sous le nom de zen."

  "excerpt": "Un traité éthiopien du XVIIe siècle qui fait de la raison un guide, et dont l'authenticité divise ; l'ubuntu ; les débats du XXe siècle : panorama des philosophies africaines.",

  "body": [
   "Le Hatata, mot guèze qui signifie « enquête », se présente comme l'autobiographie intellectuelle de Zera Yacob, fils de paysan né près d'Aksoum vers 1600. Sous le roi Susneyos, converti au catholicisme, une persécution frappe ceux qui refusent la foi des missionnaires européens. Zera Yacob s'enfuit et vit deux ans dans une grotte, jusqu'à la mort du roi. Il y médite seul : chrétiens, juifs et musulmans affirment chacun détenir la vérité, alors comment trancher ? Sa réponse : chercher avec l'intelligence que le Créateur a placée dans le cœur de chacun. Le texte dit avoir été écrit en 1667. Un second Hatata est attribué à son disciple Walda Heywat.",
   "La pensée du Hatata est audacieuse. La vérité, y lit-on, se révèle à qui la cherche. Tous les humains sont égaux devant Dieu et tous sont doués d'intelligence. Zera Yacob rejette donc ce qui, dans les lois religieuses, lui paraît contraire à la raison : la supériorité de la vie monastique sur le mariage, ou l'idée qu'il serait permis d'acheter un être humain comme un animal. Quand il épouse Hirut, une servante, il refuse qu'on la dise à son service : mari et femme, écrit-il, sont égaux dans le mariage. Sa foi demeure, mais elle doit désormais répondre à l'examen de la raison.",
   "Ce texte est-il authentique ? Le débat dure depuis un siècle. Les manuscrits ont été réunis au XIXe siècle par Giusto d'Urbino, un missionnaire capucin italien, pour le collectionneur Antoine d'Abbadie. Dès 1920, l'orientaliste Carlo Conti Rossini y voit un faux rédigé par d'Urbino lui-même. Le jésuite Claude Sumner défend l'authenticité dans les années 1970. L'historienne Anaïs Wion (CNRS) relance la thèse du faux en montrant que le manuscrit de référence est une copie commandée par d'Urbino. En 2023, une équipe de spécialistes du guèze réunie autour de Ralph Lee, Mehari Worku et Wendy Laura Belcher publie une nouvelle traduction et défend longuement l'attribution à Zera Yacob. La question reste ouverte.",
   "L'ubuntu vient des langues nguni d'Afrique australe, comme le zoulou ou le xhosa. Le chercheur Christian Gade a montré que le mot est attesté par écrit depuis au moins 1846 et qu'il a d'abord désigné une qualité humaine, une forme d'humanité. Ce n'est qu'entre 1993 et 1995 qu'on l'associe au proverbe umuntu ngumuntu ngabantu, « une personne est une personne par les autres ». Au même moment, la Constitution intérimaire de l'Afrique du Sud (1993) affirme le besoin « d'ubuntu, et non de victimisation ». Des philosophes, comme Thaddeus Metz, cherchent depuis à en tirer une théorie morale fondée sur la relation ; d'autres jugent le concept devenu trop vague.",
   "Au XXe siècle, la philosophie africaine universitaire s'est construite dans le débat. En 1945, le missionnaire Placide Tempels publie La Philosophie bantoue, qui prête aux Bantous une pensée collective et anonyme. Le Béninois Paulin Hountondji critique dès 1970 cette « ethnophilosophie ». Le Kényan Henry Odera Oruka (1944-1995) choisit une autre voie : interroger directement des sages, dont certains pensent de façon critique et personnelle. Le Ghanéen Kwasi Wiredu (1931-2022) appelle à une « décolonisation conceptuelle » : débarrasser la pensée africaine de ce qu'elle a emprunté sans examen à l'Occident, en repensant les concepts depuis des langues comme l'akan, sans pour autant idéaliser la tradition."

  "excerpt": "Un enfant élevé par une gazelle qui découvre seul la vérité ; un historien qui explique l'essor et la chute des dynasties : deux penseurs majeurs du Maghreb et d'al-Andalus.",
  "tag": "Informer",
  "repere": "Al-Andalus et Maghreb · XIIe-XIVe siècle",
  "body": [
   "Du IXe au XIVe siècle, le monde islamique connaît une intense activité philosophique, la falsafa, nourrie des traductions arabes des philosophes grecs, Aristote en tête. Al-Farabi, né vers 870 et mort à Damas en 950 ou 951, qui vécut longtemps à Bagdad, est surnommé le « second maître », après Aristote. Dans ses Opinions des habitants de la cité vertueuse, il pense la société idéale. Pour lui, les vérités de la religion peuvent être connues par la raison, mais la plupart des gens les reçoivent sous forme d'images et de symboles, plus persuasifs que les démonstrations. Cette idée traversera toute la tradition, jusqu'en al-Andalus, la péninsule Ibérique musulmane.",
   "Au XIIe siècle, Ibn Rushd (1126-1198), connu en Europe sous le nom d'Averroès, est à la fois juge, médecin et philosophe. Le calife almohade Abu Ya'qub Yusuf lui demande de commenter Aristote pour le rendre accessible. Dans son Traité décisif, il défend la valeur de la philosophie pour l'islam : bien comprises, les sources religieuses s'accordent avec ce que la raison peut démontrer, mais elles s'expriment par des images adaptées au plus grand nombre. L'Europe latine l'appellera simplement « le Commentateur ». En fin de vie, il tombe en disgrâce et est exilé à Lucena, près de Cordoue ; selon un récit, il meurt à Marrakech.",
   "Ibn Tufayl, son aîné, naît vers 1110 près de Guadix, dans l'actuelle Andalousie. D'abord médecin à Grenade, il devient le médecin et le conseiller du même calife à Marrakech, où il meurt en 1185. De ses écrits, une seule œuvre nous est parvenue : Hayy ibn Yaqzan, « Vivant, fils de l'Éveillé ». Ce roman philosophique raconte l'histoire d'un enfant élevé par une gazelle sur une île déserte. Seul, par l'observation et la réflexion, Hayy découvre les lois de la nature puis l'existence d'un Créateur. Quand il rencontre enfin d'autres humains, il constate que sa vérité rejoint celle de leur religion, mais que beaucoup ne veulent pas être bousculés dans leurs croyances.",
   "Le livre voyage loin. Il est traduit en hébreu et commenté dès le XIVe siècle, puis en latin en 1671, et suivi peu après de traductions néerlandaise et anglaises. On a souvent dit qu'il avait inspiré le Robinson Crusoé de Daniel Defoe : c'est plausible, mais cette influence reste discutée par les spécialistes. Sa question demeure actuelle. Que peut découvrir la raison humaine seule, sans école ni société ? Et que faire de cette découverte quand on revient parmi les autres ? Ibn Tufayl répond avec prudence : la vérité est accessible à la raison, mais tout le monde ne la cherche pas par la même voie.",
   "Ibn Khaldoun (1332-1406), né à Tunis, mène une vie mouvementée de conseiller politique auprès de plusieurs souverains ; il rencontre même le conquérant Timur, dit Tamerlan. Lors de périodes de retraite, il rédige une histoire universelle dont l'introduction, la Muqaddima, est devenue un classique. Il y fonde une science nouvelle, celle de la civilisation, la ‘umran. L'histoire, explique-t-il, ne doit pas être une simple suite de récits : elle exige de rechercher les causes, de distinguer le vrai du faux et de comprendre comment les sociétés naissent, prospèrent et déclinent. À ce titre, elle est selon lui enracinée dans la philosophie.",
   "Sa notion clé est la ‘asabiyya, que l'on traduit par « esprit de corps » ou « solidarité de groupe ». C'est elle qui permet à un groupe, souvent venu du désert, de se défendre et de conquérir le pouvoir. Mais une fois sédentarisée, la dynastie concentre l'autorité et perd peu à peu cette cohésion. En règle générale, écrit-il, une dynastie ne dépasse pas trois générations, soit environ cent vingt ans. Il observe aussi que des impôts modérés favorisent la prospérité. Les spécialistes discutent encore de la nature de ce modèle : Peter Adamson le rapproche de la philosophie naturelle d'Aristote, d'autres y lisent une pensée politique presque républicaine."

 {
  "salon": "Philosophies d'Orient et d'Occident",
  "title": "Philosophies amérindiennes : sages nahuas, Grande Loi de la Paix, parenté lakota",
  "excerpt": "Poètes-sages aztèques, constitution haudenosaunee, prière lakota : ce que l'on sait vraiment, et les belles citations « amérindiennes » inventées bien plus tard.",
  "tag": "Informer",
  "repere": "Amériques · XVe siècle à aujourd'hui",
  "body": [
   "Chez les Nahuas du Mexique central, dont font partie les Aztèques, on appelait tlamatinime, « ceux qui savent les choses », des sages, prêtres et lettrés chargés de réfléchir au monde et de l'enseigner. Pour le philosophe James Maffie, leur pensée voit la réalité comme un processus : le teotl, une énergie sacrée toujours en mouvement. La terre y est décrite comme glissante, et un proverbe dit qu'il fait « glissant » et « lisse » sur la terre. La grande question devient alors : comment garder l'équilibre dans une existence fragile ? La réponse passe souvent par in xochitl in cuicatl, « la fleur et le chant », c'est-à-dire la poésie. Ces idées sont surtout celles d'une élite de prêtres et de lettrés.",
   "Le plus célèbre de ces sages est Nezahualcóyotl (1402-1472), souverain de Texcoco. Des poèmes qui lui sont attribués chantent le caractère éphémère de la vie sur terre. Mais il faut distinguer l'histoire de la légende. Ces chants ont été mis par écrit après la conquête espagnole, dans des recueils comme les Cantares Mexicanos, et les spécialistes discutent de ce qui revient réellement au roi. Au XVIIe siècle, son descendant Fernando de Alva Ixtlilxóchitl en fait un roi presque chrétien, adorateur d'un dieu unique : l'historien Patrick Lesbre montre qu'il s'agit d'une reconstruction. L'historien Jongsoo Lee conteste aussi l'image d'un poète pacifique, détaché des guerres de son temps.",
   "Plus au nord, les Haudenosaunee, que l'on appelle aussi Iroquois, se réfèrent à la Grande Loi de la Paix. Selon leur tradition, le Pacificateur, Dekanawidah, et Hiawatha ont uni cinq nations en guerre : Mohawks, Oneidas, Onondagas, Cayugas et Senecas, rejoints plus tard par les Tuscaroras. La loi est symbolisée par l'Arbre de la Grande Paix, dont les racines blanches s'étendent vers les quatre directions : toute nation qui accepte la paix peut venir s'abriter sous ses branches. Les mères de clan jouent un rôle central dans le choix et la révocation des chefs. La fondation de cette confédération est antérieure à l'arrivée des Européens, mais sa date exacte est discutée.",
   "C'est de cette tradition que l'on tire aujourd'hui le « principe de la septième génération », très cité dans l'écologie. Que dit le texte ? Dans la version de la Grande Loi publiée en 1916 par l'anthropologue Arthur C. Parker, à partir de manuscrits de Seth Newhouse, les chefs doivent garder en vue « non seulement le présent, mais aussi les générations à venir », même celles qui ne sont pas encore nées. Le chiffre sept n'y figure pas : la formule « septième génération », devenue courante à l'époque contemporaine, condense une idée qui, elle, est bien présente. Quant à l'influence de la Grande Loi sur la Constitution des États-Unis, saluée par le Sénat américain en 1987, des historiens comme Jack Rakove la contestent.",
   "Chez les Lakotas, une formule résume une vision du monde : Mitákuye Oyás'iŋ, « tous mes parents » ou « pour tous mes proches ». Selon le théologien amérindien George Tinker, elle conclut chaque prière, un peu comme « amen », et peut constituer à elle seule une prière complète. Ses sens sont multiples : elle vise la famille proche, la tribu, tous les humains, mais aussi les quadrupèdes, les êtres ailés et tout ce qui vit et se meut sur la Terre mère. Elle exprime l'interdépendance de tout ce qui existe et la responsabilité qui en découle : respecter l'harmonie et l'équilibre du cercle dont chacun fait partie.",
   "Prudence avec les citations « amérindiennes » qui circulent. Le célèbre discours écologique attribué au chef Seattle, qui aurait été prononcé en 1854 ou 1855, n'est connu que par une reconstitution publiée en 1887 par un médecin, Henry A. Smith, plus de trente ans après ; les versions les plus répandues ont été retravaillées dans les années 1970. Pour un historien des Archives nationales américaines, son authenticité n'est « pas prouvée ». De même, « Nous n'héritons pas la terre de nos ancêtres, nous l'empruntons à nos enfants » n'est pas un proverbe amérindien : sa plus ancienne version proche connue remonte à l'écrivain américain Wendell Berry, en 1971. Ces textes en disent souvent plus sur nos attentes que sur les peuples concernés."

  "title": "Khalil Gibran et Le Prophète : pourquoi ce petit livre a conquis le monde",
  "excerpt": "Boudé par la critique, porté par le bouche-à-oreille : comment les vingt-six poèmes du Prophète, sur l'amour, la liberté ou les enfants, ont touché des millions de lecteurs.",
  "tag": "Informer",
  "repere": "Liban et États-Unis · 1883-1931",
  "body": [
   "Gibran Khalil Gibran naît en 1883 à Bcharré, village de la montagne libanaise, alors dans l'Empire ottoman, au sein d'une famille chrétienne maronite. En 1895, à douze ans, il émigre avec sa mère, son frère et ses sœurs à Boston, dans un quartier pauvre d'immigrés. Remarqué pour ses dessins, il fréquente les milieux artistiques de la ville, puis repart étudier trois ans dans un collège maronite de Beyrouth. Peintre autant qu'écrivain, il publie d'abord en arabe. À partir de 1908, l'enseignante Mary Haskell devient sa protectrice : elle finance un séjour d'études à Paris, puis l'aide à écrire en anglais en relisant ses manuscrits.",
   "Installé à New York en 1911, Gibran publie Le Prophète en 1923 chez l'éditeur Alfred A. Knopf. Le livre réunit vingt-six poèmes en prose. Almustafa, un sage qui a vécu douze ans en exil dans la ville d'Orphalese, s'apprête à rentrer sur son île natale. Avant son départ, les habitants lui demandent de parler de l'amour, du mariage, des enfants, du travail, de la liberté ou de la mort. Gibran lui-même vivait alors à New York depuis douze ans, loin du Liban. Sur l'amour, Almustafa enseigne qu'il ne possède pas ; sur le mariage, qu'il faut laisser « des espaces » dans l'union.",
   "Les pages sur les enfants sont parmi les plus lues : « Vos enfants ne sont pas vos enfants. » Ils viennent par nous mais ne nous appartiennent pas, et les parents sont comme l'arc d'où partent des flèches vivantes. Sur la liberté, Gibran retourne la question : ce que nous appelons liberté peut devenir la plus solide de nos chaînes, et le despote que l'on veut renverser doit d'abord être détrôné en nous-mêmes. Le fil conducteur est une sagesse des contraires : le désiré et le redouté, la joie et la peine avancent ensemble, et c'est en les traversant que l'on grandit.",
   "Le succès fut lent, puis immense. La première année, le livre se vend à 1 200 exemplaires et passe inaperçu dans la presse. Mais le bouche-à-oreille prend le relais : en 1957, le millionième exemplaire est vendu ; dans les années 1960, les ventes atteignent parfois 5 000 exemplaires par semaine. En 2008, The New Yorker estimait à plus de neuf millions les ventes de la seule édition américaine. Le livre a été traduit dans plus de cent langues, et on le lit aux mariages comme aux funérailles. Gibran passe pour le troisième poète le plus vendu de l'histoire, après Shakespeare et Laozi.",
   "La critique, elle, l'a presque ignoré. Le Prophète reçut à sa sortie peu de comptes rendus, et tièdes, rappelle la journaliste Joan Acocella. Idéalisme, flou, sentimentalité : tout ce que les écrivains modernes des années 1920 voulaient fuir. Même son éditeur disait en 1965 ne pas savoir qui le lisait : « ce doit être une secte ». Gibran a aussi soigné sa légende, en s'inventant par exemple une enfance aristocratique. Dans le monde arabe, en revanche, il est considéré comme un rénovateur majeur de la littérature moderne, un passeur entre la tradition classique et une sensibilité plus libre.",
   "Pourquoi un tel succès ? Plusieurs raisons se conjuguent. Le livre est court, découpé en textes brefs que l'on peut ouvrir au hasard. Ses conseils sont assez larges pour que chacun s'y reconnaisse, et son message rassure : Gibran le résumait ainsi devant Mary Haskell, « vous êtes bien plus grands que vous ne le savez, et tout est bien ». Il parle de spiritualité sans exiger d'appartenance religieuse. Enfin, il a été porté par les lecteurs eux-mêmes, qui se l'offrent dans la joie comme dans le deuil. Gibran meurt en 1931 ; il repose au monastère de Mar Sarkis, à Bcharré."
  ],

  "excerpt": "Pour Épicure, le plaisir n'est ni l'excès ni la fête sans fin, mais un corps sans douleur et un esprit sans trouble. Retour sur une sagesse souvent caricaturée.",
  "tag": "Informer",
  "repere": "Grèce · IVe-IIIe siècle av. J.-C.",
  "body": [
   "Épicure naît en 341 avant notre ère et grandit sur l'île de Samos, dans une famille d'origine athénienne. Après avoir enseigné à Mytilène et à Lampsaque, il s'installe à Athènes vers 306. Il y achète une propriété avec un jardin, qui donne son nom à son école : le Jardin. Ce n'est pas seulement un lieu de cours. C'est une communauté où l'on vit ensemble, où l'on partage des repas simples et où l'on met la doctrine en pratique. Épicure meurt vers 270, après une longue maladie. Dans une dernière lettre, il écrit qu'il oppose à ses souffrances la joie du souvenir de ses conversations avec ses amis.",
   "Le Jardin surprend par son ouverture. Diogène Laërce, biographe grec de l'Antiquité, rapporte que les serviteurs d'Épicure faisaient partie de l'école, à commencer par un esclave nommé Mys. Dans son testament, le philosophe affranchit Mys, Nicias, Lycon et une femme, Phaedrium. Des femmes prennent part à la vie du groupe et correspondent avec le maître, comme Léontion ou Thémista. Les adversaires de l'école en ont tiré des ragots, accusant Épicure de fréquenter des courtisanes. Ces accusations viennent souvent d'ennemis déclarés, dont certains stoïciens, et il faut les lire avec prudence. Elles rappellent surtout que la présence de femmes et d'esclaves dans une école de philosophie n'allait pas de soi.",
   "Le texte le plus accessible d'Épicure est une courte lettre adressée à un disciple, Ménécée. Elle s'ouvre sur une invitation : il n'est jamais trop tôt ni trop tard pour philosopher, car il s'agit de la santé de l'âme. Le but de la vie, y lit-on, est le plaisir. Mais Épicure précise aussitôt ce qu'il entend par là : ne pas souffrir dans son corps et ne pas être troublé dans son esprit. Les philosophes parlent d'ataraxie, un mot grec qui signifie « absence de trouble ». Ce plaisir est un état stable de bien-être, et non une suite d'excitations qu'il faudrait sans cesse renouveler. La prudence, ajoute la lettre, vaut plus encore que la philosophie.",
   "Pour y parvenir, Épicure propose de trier ses désirs. Certains sont naturels et nécessaires, comme boire quand on a soif. D'autres sont naturels sans être nécessaires, comme les mets raffinés. D'autres enfin ne sont ni naturels ni nécessaires, comme le désir de couronnes ou de statues à son effigie : ils naissent d'opinions creuses et n'ont pas de limite. La lettre s'attaque aussi à la peur de la mort. Tout bien et tout mal résident dans la sensation, or la mort est la fin de toute sensation. Tant que nous sommes là, la mort n'est pas là ; quand elle est là, nous ne sommes plus. Elle n'est donc rien pour nous.",
   "Le mot « épicurien » désigne aujourd'hui un amateur de bonne chère. C'est presque l'inverse de ce que disait Épicure. Dans sa lettre, il écarte les plaisirs des débauchés et des banquets sans fin, et regrette d'être mal compris par ignorance ou par malveillance. Lui-même se disait satisfait de pain et d'eau, et réclamait à un ami un petit pot de fromage pour faire bombance à l'occasion. Le Romain Sénèque, pourtant stoïcien, raconte qu'au Jardin on accueillait le visiteur avec de la bouillie et de l'eau à volonté. Le poète Horace s'amusait déjà à se dire « porc du troupeau d'Épicure » : la caricature est presque aussi ancienne que la doctrine."
  ],

  "salon": "Philosophies d'Orient et d'Occident",
  "title": "Épictète, l'esclave devenu maître de sagesse",
  "excerpt": "Né esclave, devenu l'un des grands stoïciens, Épictète apprenait à distinguer ce qui dépend de nous. Une leçon reprise vingt siècles plus tard par les thérapies cognitives.",
  "tag": "Informer",
  "repere": "Empire romain · Ier-IIe siècle",
  "body": [
   "Épictète naît dans les années 50 de notre ère à Hiérapolis, une cité grecque d'Asie Mineure, près de l'actuelle Pamukkale, en Turquie. Enfant, il arrive à Rome comme esclave d'Épaphrodite, un affranchi influent à la cour de l'empereur Néron. Il boite, sans que l'on sache si c'est à cause d'une maladie ou de mauvais traitements subis en servitude. Encore esclave, il suit les leçons de Musonius Rufus, un philosophe stoïcien. Le stoïcisme, école fondée à Athènes par Zénon de Citium, place le bonheur dans la vertu et dans une vie accordée à la nature et à la raison. Une fois affranchi, Épictète commence à enseigner à son tour.",
   "Vers 89, l'empereur Domitien chasse les philosophes d'Italie. Épictète s'installe alors à Nicopolis, en Épire, sur la côte nord-ouest de la Grèce. Il y ouvre une école réputée, fréquentée notamment par de jeunes Romains de haut rang, et y enseigne jusqu'à sa mort, vers 135. Nous connaissons sa pensée grâce à son élève Arrien, futur historien, qui a mis par écrit ses Entretiens : quatre livres nous sont parvenus, sur au moins huit. La plupart des spécialistes y voient un reflet fidèle de sa parole, même si certains pensent qu'Épictète les a composés lui-même. Le Manuel, petit livre qui a traversé les siècles, en est un court abrégé.",
   "Le Manuel commence par une distinction devenue célèbre. Parmi les choses, certaines dépendent de nous : nos jugements, nos élans, nos désirs, nos refus, bref tout ce qui est notre œuvre. D'autres n'en dépendent pas : notre corps, nos biens, notre réputation, nos fonctions. Les premières sont libres par nature, les secondes fragiles et soumises à autrui. Le malheur vient de ce qu'on les confond, en voulant maîtriser ce qui nous échappe. Épictète appelle prohairesis, la faculté de choix, ce noyau intérieur dont personne ne peut nous déposséder. Pour lui, la liberté ne dépend pas du rang social. L'ancien esclave sait de quoi il parle.",
   "Une autre phrase du Manuel résume sa méthode : ce qui trouble les hommes, ce ne sont pas les choses, mais les jugements qu'ils portent sur elles. La mort, par exemple, n'a rien de terrible en elle-même, sinon Socrate l'aurait jugée terrible. C'est notre opinion sur la mort qui effraie. Épictète propose donc un entraînement de chaque instant : examiner chaque impression avant d'y donner son accord, se demander si la chose dépend de nous et, sinon, se dire qu'elle ne nous concerne pas. Il ne prône pas pour autant l'indifférence aux autres. Les Entretiens insistent sur les devoirs liés à nos relations : envers nos parents, nos frères et sœurs, nos concitoyens.",
   "L'influence d'Épictète traverse les siècles. L'empereur Marc Aurèle, qui ne l'a jamais eu pour maître, se considérait comme son disciple après l'avoir lu. Au XVIIe siècle, Pascal admire le moraliste, mais juge orgueilleuse l'idée que l'être humain puisse se perfectionner par ses seules forces. Au XXe siècle, le psychologue Albert Ellis et le psychiatre Aaron Beck, fondateurs des thérapies dites cognitives, reconnaissent explicitement leur dette envers le stoïcisme. Leur principe de base remonte au Manuel : nos émotions dépendent en grande partie de la manière dont nous interprétons les événements. Les thérapies cognitives et comportementales, largement pratiquées aujourd'hui, gardent la trace de cette filiation antique."

  "title": "Les philosophes oubliées : Hypatie, Lal Ded, Gabrielle Suchon, Sor Juana",
  "excerpt": "D'Alexandrie au Cachemire, de la Bourgogne au Mexique, quatre femmes ont pensé librement malgré les obstacles. Portraits, entre histoire attestée et légende.",
  "tag": "Informer",
  "repere": "Égypte, Cachemire, France, Mexique · IVe-XVIIe siècle",
  "body": [
   "L'histoire de la philosophie a longtemps été racontée comme une affaire d'hommes. Pourtant, des femmes ont enseigné, écrit et débattu sur plusieurs continents. Leurs œuvres ont souvent été perdues, attribuées à d'autres ou transmises seulement de bouche à oreille. Retrouver leur trace demande de la prudence : il faut distinguer ce que disent les documents de ce qu'y ont ajouté les légendes. Voici quatre figures d'époques et de cultures très différentes, dont l'existence et l'influence sont bien attestées. Chacune a dû composer avec les limites imposées aux femmes de son temps, et chacune a trouvé sa propre manière de penser librement.",
   "Hypatie enseigne la philosophie à Alexandrie, en Égypte, autour de l'an 400. Fille du mathématicien Théon, elle travaille avec lui sur l'édition d'un traité d'astronomie de Ptolémée, probablement l'Almageste, puis hérite de son école, d'inspiration platonicienne. Elle attire des élèves venus de loin, dont beaucoup sont chrétiens, comme Synésios de Cyrène, dont les lettres nous renseignent sur elle. En mars 415, pendant le carême, elle est tuée par une foule chrétienne, sur fond de conflit entre l'évêque Cyrille et le préfet Oreste. L'historien Edward Watts juge ce meurtre circonstanciel plutôt que prémédité. Il met aussi en garde contre la légende qui fait de sa mort la fin d'une époque éclairée.",
   "Au XIVe siècle, dans la vallée du Cachemire, une femme appelée Lalla, ou Lal Ded, « grand-mère Lal », compose de courts poèmes chantés, les vakh. Selon la tradition, maltraitée par sa belle-famille, elle quitte le foyer conjugal et suit un maître shivaïte, c'est-à-dire un adepte d'un courant de l'hindouisme centré sur le dieu Shiva et sur le yoga. Elle parcourt ensuite le pays en chantant et en dansant, à demi vêtue. Ses vers sont les plus anciens textes connus en langue cachemirie. Transmis oralement, sans manuscrit authentique, ils restent difficiles à établir avec certitude. En 1920, le linguiste George Grierson notait que tout Cachemiri, hindou ou musulman, en connaissait et vénérait sa mémoire.",
   "En Bourgogne, Gabrielle Suchon naît à Semur en 1632. Placée au couvent par ses parents à l'adolescence, elle y reste environ vingt-cinq ans et tente au moins deux fois d'être relevée de ses vœux. Elle en sort au début des années 1670, vit ensuite auprès de sa mère et meurt à Dijon en 1703. En 1693, elle publie à Lyon, sous le pseudonyme G. S. Aristophile, un Traité de la morale et de la politique. Elle y réclame pour les femmes trois biens dont elles sont privées : la liberté, le savoir et l'autorité. En 1700, Du célibat volontaire décrit une « vie neutre », sans mariage ni couvent, consacrée à l'étude et au gouvernement de soi.",
   "Au Mexique, alors appelé Nouvelle-Espagne, Juana Inés de Asbaje naît en 1648 ou en 1651. En 1669, elle entre chez les religieuses hiéronymites et devient Sor Juana Inés de la Cruz. Poétesse célébrée, elle écrit aussi en philosophe, notamment dans son long poème Premier Songe. En 1690, l'évêque de Puebla publie sans son accord une critique qu'elle avait faite d'un sermon, puis la réprimande sous le pseudonyme de « Sœur Philothée ». Dans sa Réponse, écrite en 1691, elle défend le droit des femmes à étudier et raconte avec humour ce qu'elle apprend en cuisine. En 1694, elle renonce à ses études ; certains historiens, comme Octavio Paz, y voient l'effet de pressions de l'Église. Elle meurt en 1695."

  "title": "La Boétie, la servitude volontaire et l'amitié avec Montaigne",
  "excerpt": "Pourquoi des peuples entiers obéissent-ils à un seul homme ? Un jeune magistrat du XVIe siècle répond : parce qu'ils y consentent. Son ami Montaigne l'a rendu immortel.",
  "tag": "Informer",
  "repere": "France · XVIe siècle",
  "body": [
   "Étienne de La Boétie naît à Sarlat, en Périgord, le 1er novembre 1530. Son père meurt tôt, et il est élevé par un oncle prêtre. Il obtient sa licence de droit à Orléans en 1553 et entre très jeune au Parlement de Bordeaux, l'une des grandes cours de justice du royaume. Humaniste, il écrit des vers en latin et en français. Il rédige aussi un texte bref et brûlant : le Discours de la servitude volontaire. Sa date reste discutée. Montaigne parle d'abord d'un auteur de moins de dix-huit ans, puis corrige en seize ans. L'éditeur Paul Bonnefon situait une première version vers 1548, retouchée vers 1550.",
   "La question du Discours est simple et dérangeante : comment tant d'hommes peuvent-ils supporter un tyran qui n'a de pouvoir que celui qu'on lui donne ? Pour La Boétie, ce ne sont pas d'abord les armes qui défendent le tyran. Sa puissance repose sur le consentement de ceux qui obéissent. Il n'est donc pas nécessaire de le combattre : il suffit de cesser de le soutenir. La Boétie le compare à un grand colosse dont on aurait retiré la base, et qui s'effondre sous son propre poids. Ceux qui ignoraient son vrai titre ont plus tard rebaptisé le texte le Contre Un, c'est-à-dire « contre un seul ».",
   "Pourquoi consent-on ? La première raison est la coutume. On naît dans la servitude, on s'y habitue et l'on oublie que l'on est né libre, comme ces chevaux qui mordent d'abord le frein, puis se pavanent sous le harnais. Viennent ensuite les jeux, les spectacles et les fêtes, que La Boétie appelle les « appâts de la servitude ». Enfin, le tyran s'appuie sur une chaîne de complices : cinq ou six proches, qui en tiennent six cents, qui en tiennent six mille. Chacun obéit parce qu'il espère sa part du butin et devient, sous le grand tyran, un « tyranneau » à son tour.",
   "La Boétie ne publie pas son Discours, qui circule en manuscrit. Après le massacre de la Saint-Barthélemy, en 1572, des protestants en lutte contre la monarchie s'en emparent : un long extrait paraît en 1574, puis le texte entier en 1577 dans un recueil de Simon Goulart. Pour l'historien Philippe Desan, la première vie imprimée du Discours est entièrement protestante. Montaigne, qui voulait le placer au cœur de ses Essais, y renonce, jugeant qu'il a été publié « à mauvaise fin ». Il souligne la jeunesse de l'auteur, peut-être pour atténuer la portée politique du texte, et rappelle que son ami respectait scrupuleusement les lois de son pays.",
   "L'amitié entre les deux hommes est l'une des plus célèbres de la littérature française. Ils se rencontrent par hasard, lors d'une grande fête en ville, et se sentent aussitôt liés. Leur amitié ne dure qu'environ quatre ans. Le 18 août 1563, La Boétie meurt de maladie à trente-deux ans, et Montaigne raconte ses derniers jours dans une longue lettre à son père. Dans le chapitre « De l'amitié » des Essais, il cherche à expliquer ce lien et n'y parvient que par une formule : « Parce que c'était lui ; parce que c'était moi. » Pour Montaigne, l'amitié est la création la plus propre de notre liberté."

  "title": "Spinoza : la joie, la liberté et « Dieu ou la Nature »",
  "excerpt": "Exclu de sa communauté en 1656, Spinoza a bâti une philosophie de la joie et de la liberté. Sa manière de penser Dieu divise encore ses lecteurs.",
  "tag": "Informer",
  "repere": "Provinces-Unies · XVIIe siècle",
  "body": [
   "Spinoza naît en 1632 à Amsterdam, dans la communauté juive d'origine portugaise. Ses trois prénoms, Bento en portugais, Baruch en hébreu et Benedictus en latin, signifient tous « béni ». Brillant élève de l'école de la synagogue, il doit interrompre ses études vers dix-sept ans pour aider au commerce familial. Le 27 juillet 1656, la communauté prononce contre lui un herem, une exclusion, la plus dure qu'elle ait jamais décidée. Le texte l'accuse d'« hérésies abominables » sans les préciser, et la sentence ne sera jamais levée. Spinoza quitte bientôt Amsterdam et gagne sa vie, très probablement, en polissant des lentilles optiques.",
   "Son grand livre, l'Éthique, est construit comme un traité de géométrie, avec définitions, axiomes et démonstrations. Il y soutient qu'il n'existe qu'une seule réalité, infinie, qu'il nomme « Dieu ou la Nature » (Deus sive Natura). Ce Dieu n'est pas un juge qui récompense et punit, ni un artisan qui poursuit des buts. Il est la puissance même de la nature, qui agit par nécessité. Les lecteurs se divisent depuis lors : Spinoza divinise-t-il la nature, ou réduit-il Dieu à la nature ? Certains parlent de panthéisme, d'autres d'athéisme. Pour le spécialiste Steven Nadler, le mot panthéisme est trompeur, car il suppose encore une attitude religieuse.",
   "Pour comprendre l'être humain, Spinoza part d'un principe simple : chaque chose s'efforce de persévérer dans son être. Il appelle cet effort le conatus. Nos émotions, qu'il nomme « affects », traduisent les variations de notre puissance d'agir. La joie est le passage à une plus grande perfection, c'est-à-dire à une puissance accrue. La tristesse est le passage inverse. L'amour n'est qu'une joie accompagnée de l'idée de sa cause extérieure, la haine une tristesse accompagnée de l'idée de sa cause. Cette approche presque mathématique des émotions n'a rien de froid : elle aide à repérer ce qui augmente ou diminue notre puissance de vivre.",
   "Spinoza nie le libre arbitre au sens courant. Les hommes se croient libres, écrit-il, parce qu'ils ont conscience de leurs actions et ignorent les causes qui les déterminent. Être libre, pour lui, ce n'est pas échapper à la nécessité, c'est la comprendre. Tant que nous sommes ballottés par nos passions, nous subissons des causes extérieures. Quand nous comprenons ce qui nous affecte, nous devenons actifs et notre joie se stabilise. Au sommet se trouve l'« amour intellectuel de Dieu », une connaissance de la nature qui procure une paix profonde, la béatitude. Le chemin est ardu, reconnaît la dernière phrase de l'Éthique : tout ce qui est remarquable est aussi difficile que rare.",
   "Spinoza défend aussi la liberté de penser en politique. En 1670 paraît, sans nom d'auteur, son Traité théologico-politique. Il veut montrer que la liberté de philosopher ne menace ni la piété ni la paix de l'État, et que sa suppression les mettrait au contraire en danger. Un critique de l'époque le qualifie de livre « forgé en enfer ». Au chapitre 20, Spinoza affirme que la fin de l'État est, en vérité, la liberté. Il meurt à La Haye en 1677, à quarante-quatre ans. Ses amis publient aussitôt l'Éthique et ses autres écrits inédits. Longtemps tenu pour dangereux, il compte aujourd'hui parmi les philosophes les plus actuels de son siècle."
  ],
  "cles": [

   "Chaque être s'efforce de persévérer dans son être ; la joie est l'augmentation de notre puissance d'agir.",
   "Nous nous croyons libres parce que nous ignorons les causes qui nous déterminent ; la vraie liberté consiste à les comprendre.",
   "Pour Spinoza, la fin de l'État est la liberté, et la liberté de penser ne menace pas la paix publique.",
   "Sa pensée de Dieu reste débattue : panthéisme, athéisme ou ni l'un ni l'autre."
  ],

  "title": "Tolstoï, Kropotkine, Berdiaev : liberté et entraide dans la pensée russe",
  "excerpt": "Un romancier qui inspira Gandhi, un prince géographe qui fit de l'entraide une loi de la nature, un philosophe exilé de la liberté : trois voix russes à redécouvrir.",
  "tag": "Informer",
  "repere": "Russie · XIXe-XXe siècle",
  "body": [
   "Léon Tolstoï naît en 1828 à Iasnaïa Poliana, le domaine familial près de Toula. Célèbre pour ses romans, il consacre une grande partie de sa vie à une lecture personnelle des Évangiles. Il y retient surtout le Sermon sur la montagne et sa consigne : ne pas résister au méchant. Il en tire un principe radical, ne jamais répondre au mal par la violence, et une critique de l'État, de l'armée, des tribunaux et de l'Église officielle. L'Église orthodoxe l'excommunie en 1901. En 1910, il quitte brusquement son domaine pour finir ses jours dans la retraite, tombe malade en chemin et meurt à Astapovo.",
   "Ces idées voyagent loin. En Afrique du Sud, le jeune avocat indien Mohandas Gandhi est bouleversé par Le Royaume de Dieu est en vous, essai de Tolstoï sur la non-violence. En décembre 1908, Tolstoï écrit une Lettre à un Hindou. Il s'y étonne qu'une compagnie commerciale ait pu asservir un peuple de deux cents millions de personnes, et conclut que les Indiens se sont asservis eux-mêmes en acceptant la violence. Gandhi obtient l'autorisation de la diffuser, la préface en 1909 et entretient avec Tolstoï une correspondance jusqu'en septembre 1910. La même année, il fonde près de Johannesburg une communauté baptisée Ferme Tolstoï.",
   "Pierre Kropotkine naît prince en 1842 à Moscou. Jeune officier, il choisit un régiment de cosaques en Sibérie et dirige des expéditions géographiques jusqu'en Mandchourie. Il y découvre une nature très rude, mais ne trouve pas, entre animaux d'une même espèce, la lutte acharnée que décrivaient la plupart des darwiniens. Devenu anarchiste, c'est-à-dire partisan d'une société sans État, il est emprisonné en Russie, s'évade en 1876, puis est condamné en France à cinq ans de prison après un procès à Lyon. Il vit ensuite de longues années en Angleterre, rentre en Russie en 1917 et y meurt en 1921, critique du régime bolchevique.",
   "En 1888, le biologiste Thomas Huxley publie un texte qui présente la vie comme une lutte permanente pour l'existence. Kropotkine lui répond par une série d'articles, réunis en 1902 dans L'Entraide, un facteur de l'évolution. Il ne nie pas la lutte. Mais il soutient, à la suite du zoologiste russe Kessler, que l'entraide entre membres d'une même espèce compte davantage encore pour l'évolution que la compétition. Il en suit les formes chez les fourmis, les abeilles et les oiseaux, puis dans les sociétés humaines : communautés villageoises, guildes des villes médiévales, syndicats de son époque. Pour lui, l'éthique humaine prolonge un instinct de solidarité déjà présent dans la nature.",
   "Nicolas Berdiaev naît en 1874 près de Kiev. Étudiant marxiste, il est arrêté et exclu de l'université, puis évolue vers une philosophie chrétienne très personnelle. Emprisonné par le nouveau pouvoir soviétique, il est expulsé de Russie en 1922 avec un groupe d'intellectuels. Après un passage à Berlin, il s'installe près de Paris, à Clamart, où il meurt en 1948. « Ce n'est pas sans raison qu'on m'a appelé le philosophe de la liberté », écrit-il. Nourri de Dostoïevski et du mystique allemand Jakob Böhme, il voit dans la liberté une force créatrice de la personne. Elle ne se réduit pas, selon lui, à une protection juridique : elle doit déboucher sur la création.",
   "Berdiaev lui-même relie ces trois voix. Dans L'Idée russe, il observe que l'anarchisme est pour une large part une création russe, portée par des hommes issus de la haute noblesse : Bakounine, le prince Kropotkine, le comte Tolstoï. Il reconnaît aussi que Tolstoï a beaucoup compté dans sa propre révolte de jeunesse contre l'injustice du monde. Ces penseurs ne forment pas une école. Tolstoï prêche un christianisme sans Église et refuse toute violence. Kropotkine, homme de science, est un révolutionnaire. Berdiaev, philosophe chrétien, a connu la prison sous le tsar comme sous les Soviets. Tous cherchent pourtant une liberté qui ne soit imposée ni par le pouvoir ni par la force."
  ],
  "cles": [
   "Tolstoï tire du Sermon sur la montagne un principe : ne jamais répondre au mal par la violence.",
   "Sa Lettre à un Hindou (1908) et sa correspondance avec Gandhi ont nourri la non-violence de ce dernier.",
   "Pour Kropotkine, l'entraide au sein d'une même espèce est un facteur d'évolution plus décisif encore que la compétition.",
   "Berdiaev, qui se disait « philosophe de la liberté », voit dans la liberté une puissance créatrice et non un simple droit formel.",
   "Ces trois penseurs cherchent une liberté qui ne soit imposée ni par l'État ni par la violence."
  ],

   "À méditer : Berdiaev distingue la liberté qui protège de la liberté qui crée. Qu'avez-vous créé, récemment, grâce à votre liberté ?"

  "title": "Dōgen et l'école de Kyoto : penser le temps, le lieu et le néant",
  "excerpt": "Au XIIIe siècle, le moine Dōgen enseigne que l'être et le temps ne font qu'un. Au XXe, Nishida Kitarō bâtit à Kyoto une philosophie du « lieu », entre zen et pensée occidentale.",
  "tag": "Informer",
  "repere": "Japon · XIIIe et XXe siècles",
  "body": [
   "Dōgen naît en 1200, au début de l'époque de Kamakura, dans une famille de l'aristocratie. Selon la tradition, la mort de sa mère, quand il a huit ans, lui fait ressentir l'impermanence du monde. Adolescent, il devient moine au mont Hiei, grand centre bouddhique proche de Kyoto, mais il y trouve une pratique gâtée par ses liens avec le pouvoir. Il part alors étudier en Chine. Au mont Tiantong, il rencontre le maître Rujing et pratique la méditation assise jour et nuit. De retour au Japon, il fonde la branche japonaise de l'école zen Sōtō. En 1244, il s'installe dans les montagnes d'Echizen, au monastère qui deviendra Eihei-ji. Il meurt en 1253.",
   "Pour Dōgen, la méditation assise, zazen, n'est pas un moyen d'atteindre plus tard l'éveil. Il parle de « pratique-réalisation » : s'asseoir, c'est déjà réaliser ce que l'on cherche. Sa voie est celle du « seulement s'asseoir » (shikantaza), sans le système élaboré de kōans, ces énigmes que l'école Rinzai donne à méditer. Son grand ouvrage, le Shōbōgenzō, « Trésor de l'œil du vrai Dharma », développe la notion d'uji, que l'on traduit par « être-temps ». L'être ne peut exister à part du temps, ni le temps à part de l'être. Le temps n'est donc pas un récipient vide où les choses viendraient se loger. Il se vit ici et maintenant, à travers elles.",
   "Six siècles plus tard, le Japon s'ouvre à la philosophie occidentale. Nishida Kitarō, né en 1870 près de Kanazawa, étudie Kant et Hegel à l'université de Tokyo. Il pratique aussi assidûment le zen, auquel l'a introduit son camarade de lycée, le spécialiste du zen D. T. Suzuki. En 1911, son premier livre, Étude sur le bien, part de l'« expérience pure » : l'instant où l'on voit une couleur ou entend un son, avant même de distinguer un sujet qui perçoit et un objet perçu. Pour Nishida, l'individu ne précède pas l'expérience. C'est l'expérience, première et indivise, qui fait apparaître l'individu.",
   "Au milieu des années 1920, Nishida élabore une « logique du lieu » (basho). Il ne demande plus seulement ce que sont les choses, mais où elles apparaissent. Tout jugement se tient dans un horizon plus large : la conscience, puis la conscience de soi. Au terme de cette remontée, on ne trouve pas une chose suprême, mais un « néant absolu », c'est-à-dire un lieu ultime qui ne devient jamais objet et qui accueille toutes choses. Nishida emprunte cette idée de néant aux traditions bouddhistes et taoïstes. Il la travaille pourtant avec les outils de la philosophie occidentale, en dialogue critique avec Aristote et Hegel.",
   "Autour de Nishida se forme ce qu'on appellera l'école de Kyoto, du nom de l'université où il enseigne. Ses deux autres grandes figures sont Tanabe Hajime (1885-1962) et Nishitani Keiji (1900-1990). Ils puisent surtout dans le zen et dans le bouddhisme de la Terre pure, et Dōgen compte parmi leurs références. Leur histoire comporte une part d'ombre : pendant la guerre, des responsables politiques ont sollicité Nishida pour justifier le nationalisme japonais. Ses écrits de cette période sont jugés trop tièdes par la droite de l'époque, trop nationalistes par ses critiques de gauche, et le débat continue. Nishida meurt en juin 1945. Deux ans plus tard, des lecteurs campent toute une nuit pour acheter le premier volume de ses œuvres complètes."
  ],
  "cles": [
   "Pour Dōgen, la méditation assise n'est pas un moyen d'obtenir l'éveil : pratique et réalisation ne font qu'un.",
   "L'« être-temps » signifie que l'être et le temps sont inséparables : le temps n'est pas un contenant vide.",
   "Nishida part de l'« expérience pure », antérieure à la séparation entre sujet et objet.",
   "Sa logique du « lieu » mène à un « néant absolu » qui accueille toutes choses sans être lui-même une chose.",
   "L'école de Kyoto a fait dialoguer bouddhisme et philosophie occidentale, mais ses écrits de guerre restent discutés."
  ],
  "pratique": [
   "À essayer : asseyez-vous dix minutes, le dos droit, sans but ni technique particulière, en laissant passer pensées et sensations. C'est l'esprit du « seulement s'asseoir ».",

  "salon": "Philosophies d'Orient et d'Occident",
  "title": "Penser depuis les opprimés : Las Casas, Freire, Dussel",
  "excerpt": "Un dominicain face à la conquête, un pédagogue brésilien, un philosophe de la libération : trois façons de regarder le monde depuis ceux qu'on ne voulait pas entendre.",
  "tag": "Éduquer",
  "repere": "Amérique latine · XVIe-XXIe siècle",
  "body": [
   "Le 21 décembre 1511, sur l'île d'Hispaniola, aujourd'hui partagée entre Haïti et la République dominicaine, le dominicain Antonio de Montesinos prêche contre les colons espagnols : leurs cruautés envers les Amérindiens les mettent en état de péché mortel. Parmi ses auditeurs se trouve Bartolomé de Las Casas, né en 1484 (certaines sources indiquent 1474). Il entre à son tour chez les dominicains et devient le critique le plus sévère de la conquête. En 1542, il rédige la Très brève relation de la destruction des Indes, publiée à Séville en 1552. Il y dénonce massacres et dépeuplement, avec des chiffres que les historiens discutent encore.",
   "En 1550 et 1551, à Valladolid, Charles Quint réunit des savants autour d'une question décisive : l'Espagne a-t-elle le droit de soumettre les Amérindiens par la force ? L'humaniste Juan Ginés de Sepúlveda soutient qu'ils sont des « esclaves par nature », au sens d'Aristote. Las Casas, premier évêque du Chiapas, affirme leur pleine rationalité et défend une évangélisation pacifique. Il ne rejette pas toute idée d'esclavage naturel, mais remarque que de tels hommes existeraient aussi bien en Espagne. Le débat ne tranche rien : l'ouvrage de Sepúlveda est un temps interdit, mais la Couronne n'adopte pas les positions de Las Casas. Son combat laissera pourtant un héritage durable.",
   "Quatre siècles plus tard, au Brésil, Paulo Freire naît en 1921 à Recife. Enfant, il connaît la faim pendant la crise des années 1930. Devenu éducateur, il anime des « cercles de culture » où des adultes pauvres apprennent à lire à partir de leur propre vie, et non de manuels étrangers à leur réalité. On n'y parle pas de professeurs et d'élèves, mais d'animateurs et de participants. En 1963 et 1964, son équipe forme des étudiants pour étendre la méthode à tout le pays. Le coup d'État militaire du 1er avril 1964 arrête tout : Freire est interrogé à plusieurs reprises, puis s'exile en Bolivie et au Chili.",
   "C'est en exil qu'il écrit Pédagogie des opprimés, parue d'abord en espagnol en 1968, puis en anglais en 1970. Le livre ne sera publié en portugais, au Brésil, qu'en 1975. Freire y critique l'« éducation bancaire », où l'enseignant dépose des savoirs dans des élèves traités comme des coffres vides. Il lui oppose une éducation fondée sur le dialogue, où chacun apprend de l'autre. Son but est la conscientisation : comprendre les causes de sa situation pour pouvoir la transformer. Pour Freire, l'oppression déshumanise à la fois l'opprimé et l'oppresseur. Le livre a été interdit par plusieurs régimes, dont celui de l'apartheid en Afrique du Sud.",
   "Enrique Dussel naît en 1934 dans la province de Mendoza, en Argentine. Docteur en philosophie à Madrid, puis en histoire à la Sorbonne, il travaille aussi comme charpentier dans une coopérative à Nazareth. Au début des années 1970, il compte parmi les fondateurs de la philosophie de la libération, avec d'autres penseurs argentins. Après un attentat à la bombe contre sa maison, il s'exile au Mexique en 1975 et y enseigne près de cinquante ans, jusqu'à sa mort en 2023. Sa Philosophie de la libération (1977) propose de penser depuis ceux que le système laisse au-dehors : les pauvres, les peuples colonisés, les populations autochtones.",
   "Dans 1492, l'occultation de l'autre (1992), Dussel soutient que la conquête des Amériques marque à la fois la naissance de la modernité européenne et la dissimulation de « l'autre », ces peuples que l'Europe n'a pas voulu voir pour ce qu'ils étaient. Il a dialogué avec de grands philosophes européens et américains, comme Emmanuel Levinas, Karl-Otto Apel, Jürgen Habermas ou Richard Rorty. Des Caraïbes du XVIe siècle aux campagnes du Brésil et du Chili, ces trois penseurs partagent une méthode : partir de l'expérience de ceux que l'on n'écoutait pas. Pour eux, éduquer comme philosopher commence par apprendre à écouter."
  ],
  "cles": [
   "Las Casas a défendu, contre Sepúlveda, la pleine rationalité des Amérindiens et une évangélisation sans violence.",
   "Pour Freire, l'éducation « bancaire », qui remplit des élèves passifs, entretient l'oppression.",
   "Le dialogue et la conscientisation permettent aux opprimés de comprendre leur situation pour la transformer.",
   "La philosophie de la libération de Dussel invite à penser depuis ceux que le système exclut.",
   "Ces trois penseurs font de l'écoute des exclus le point de départ de la réflexion."
  ],
  "pratique": [

 {
  "salon": "Philosophies d'Orient et d'Occident",
  "title": "Amadou Hampâté Bâ : la sagesse de la parole africaine",
  "excerpt": "Écrivain, ethnologue, disciple d'un maître soufi, il a défendu la tradition orale africaine comme une véritable bibliothèque vivante, jusqu'à la tribune de l'UNESCO.",
  "tag": "Informer",
  "repere": "Mali · vers 1900-1991",
  "body": [
   "Amadou Hampâté Bâ naît vers 1900 à Bandiagara, au pays dogon, dans une famille peule. Enfant, il grandit au milieu des conteurs, des généalogistes et des maîtres de la tradition, puis passe par l'école coloniale française. Toute sa vie tiendra dans ce double héritage : la parole des anciens et l'écriture apprise des Européens. Il travaille longtemps dans l'administration coloniale, puis à l'Institut français d'Afrique noire, où il recueille contes, récits historiques et savoirs de la savane.",
   "Son maître spirituel, Tierno Bokar, surnommé le sage de Bandiagara, appartenait à la voie soufie tidjaniyya. Hampâté Bâ lui consacre un livre et retient de lui une leçon de tolérance : chercher la part de vérité de l'autre plutôt que d'imposer la sienne. L'historien Louis Brenner a montré combien Hampâté Bâ concevait la transmission orale du savoir religieux comme une bibliothèque vivante, où le maître incarne lui-même le livre qu'il enseigne.",
   "Après l'indépendance du Mali, il représente son pays à l'UNESCO. Il y lance un appel resté célèbre : la mort des derniers détenteurs de la tradition fait disparaître des savoirs jamais écrits, aussi sûrement qu'un incendie détruit des archives. La formule raccourcie, « quand un vieillard meurt, c'est une bibliothèque qui brûle », est le plus souvent datée de 1960. Certaines sources la placent en 1962 et sa forme exacte varie, mais son sens ne fait pas débat.",
   "Il est aussi un écrivain plein d'humour. L'Étrange Destin de Wangrin (1973) raconte la vie d'un interprète rusé de l'époque coloniale. Ses mémoires, Amkoullel, l'enfant peul (1991) puis Oui mon commandant ! (publié en 1994, après sa mort), font revivre une enfance et une jeunesse africaines entre deux mondes. Il meurt à Abidjan en 1991.",
   "Son œuvre reste une porte d'entrée vers la pensée peule et soufie, et vers une idée simple : la parole donnée, mémorisée et transmise est un savoir à part entière, qui mérite le même respect que les livres. Elle rappelle aussi une urgence toujours actuelle, celle de recueillir les mémoires avant qu'elles ne s'éteignent."
  ],
  "cles": [
   "Hampâté Bâ a recueilli et publié des pans entiers de la tradition orale de l'Afrique de l'Ouest.",
   "Son maître soufi Tierno Bokar lui a transmis une sagesse de tolérance.",

  "excerpt": "L'un a voulu réécrire l'histoire africaine à partir de l'Égypte, l'autre a chanté la négritude. Deux Sénégalais majeurs, leurs idées fortes et les critiques qu'elles ont suscitées.",

   "Léopold Sédar Senghor (1906-2001) est d'abord poète. Étudiant à Paris dans les années 1930, il fonde avec le Martiniquais Aimé Césaire et le Guyanais Léon-Gontran Damas le mouvement de la négritude : affirmer la valeur des cultures noires contre le mépris colonial. Il devient le premier président du Sénégal indépendant, de 1960 à 1980, puis le premier Africain élu à l'Académie française, en 1983.",

  "excerpt": "Dans l'Afrique du Sud de l'apartheid, un étudiant en médecine affirme que la libération commence dans la tête. Il meurt en détention à 30 ans ; sa pensée continue de circuler.",
  "tag": "Informer",
  "repere": "Afrique du Sud · 1946-1977",
  "body": [
   "Stephen Bantu Biko naît en 1946 dans la province du Cap-Oriental, en Afrique du Sud. Le pays vit sous l'apartheid, un système de ségrégation raciale inscrit dans la loi. Étudiant en médecine à Durban, Biko quitte à la fin des années 1960 l'union étudiante nationale, dominée par des libéraux blancs, pour fonder la South African Students' Organisation (SASO), une organisation d'étudiants noirs.",
   "Au cœur de sa pensée, la Conscience noire : avant de lutter contre l'oppression, les opprimés doivent se libérer du sentiment d'infériorité que l'oppression leur a appris. Le mot « noir » ne désigne pas seulement une couleur de peau, mais une condition partagée par toutes les personnes discriminées par l'apartheid, y compris les Indiens et les métis. Biko invite à reprendre confiance dans les cultures africaines, à bâtir des projets communautaires et à ne plus laisser d'autres parler à sa place.",
   "Ses textes, publiés sous le pseudonyme de Frank Talk dans le bulletin de la SASO, sont réunis après sa mort dans I Write What I Like (1978). Le pouvoir l'interdit d'expression et le confine dans sa région en 1973. Arrêté en août 1977, il est battu en détention et meurt le 12 septembre 1977, à 30 ans. Sa mort provoque une émotion internationale. Des policiers reconnaissent plus tard leur rôle devant la Commission vérité et réconciliation, qui leur refuse l'amnistie.",
   "La Conscience noire a inspiré une génération de jeunes, dont les élèves du soulèvement de Soweto en 1976. Elle nourrit encore la réflexion sur la dignité, l'estime de soi et la décolonisation des esprits, en Afrique et ailleurs. Les historiens discutent aujourd'hui son héritage, la place des femmes dans le mouvement ou ses relations avec les autres organisations anti-apartheid.",
   "Une idée reste forte et universelle : la première prison est parfois celle que l'on porte en soi. Se libérer, pour Biko, c'est d'abord cesser de se voir avec les yeux de celui qui vous domine."

  "excerpt": "Ayni, ayllu, yanantin, Pachamama : dans les Andes, une philosophie de la relation et de la réciprocité a traversé l'Empire inca et vit encore chez les Quechuas et les Aymaras.",
  "tag": "Informer",
  "repere": "Andes · époque inca (XVe-XVIe siècle) à nos jours",
  "body": [
   "Au XVe siècle, les Incas bâtissent depuis Cusco un empire immense, le Tawantinsuyu, qui s'étend de l'actuelle Colombie au Chili. Un réseau de routes de plus de 30 000 kilomètres, le Qhapaq Ñan, le relie d'un bout à l'autre ; il est inscrit au patrimoine mondial de l'UNESCO depuis 2014. La conquête espagnole, à partir de 1532, met fin à l'empire, mais pas à la pensée des peuples andins.",
   "Le philosophe Josef Estermann, qui a longtemps vécu au Pérou et en Bolivie, a décrit cette pensée comme une « philosophie andine ». Son principe premier est la relation : rien n'existe seul, tout est lié. Il en découle la correspondance entre le grand et le petit, la complémentarité des contraires, que les Quechuas appellent yanantin (homme et femme, haut et bas, soleil et lune), et la réciprocité.",
   "La réciprocité structure la vie sociale. L'ayni est l'entraide entre familles : je t'aide à construire ta maison, tu m'aides à récolter. La minka est le travail collectif pour le bien commun. L'ayllu est la communauté de parenté liée à un territoire. Et la Pachamama, la Terre-Mère, reçoit des offrandes, parce que l'on ne prend rien à la terre sans lui rendre quelque chose.",
   "Les Incas n'avaient pas d'écriture au sens habituel, mais ils utilisaient les khipus, des cordelettes nouées. Leurs nœuds notaient des nombres en base dix, pour les recensements et les tributs. On débat encore pour savoir s'ils pouvaient aussi garder des récits. L'anthropologue Pierre Déléage souligne qu'ils servaient de support à une mémoire locale, lue par des spécialistes.",
   "Cette pensée vit aujourd'hui dans les communautés quechuas et aymaras, et elle a inspiré l'idée du « bien vivre » inscrite dans les constitutions de l'Équateur et de la Bolivie. Elle mérite d'être connue sans être idéalisée : c'est une sagesse de paysans, de montagnards et d'échanges, qui dit que l'on n'existe qu'en relation."

  "title": "Ailton Krenak et Davi Kopenawa : penser la fin du monde depuis l'Amazonie",
  "excerpt": "Un écrivain krenak à l'Académie brésilienne des lettres, un chaman yanomami qui raconte « la chute du ciel » : deux voix qui interrogent notre façon d'habiter la Terre.",
  "tag": "Informer",
  "repere": "Brésil · XXe-XXIe siècle",
  "body": [
   "Ailton Krenak naît en 1953 dans la vallée du Rio Doce, au Minas Gerais, au sein du peuple krenak. En 1987, devant l'Assemblée constituante du Brésil, il se peint lentement le visage de noir avec une teinture de génipa pendant qu'il défend les droits des peuples autochtones. Ce geste devient un symbole. L'année suivante, la Constitution de 1988 reconnaît aux peuples autochtones leurs droits sur leurs terres traditionnelles.",
   "Ses livres, comme Idées pour retarder la fin du monde (2019), critiquent l'idée d'une « humanité » séparée de la Terre, qui traiterait les rivières, les forêts et les montagnes comme de simples ressources. Pour Krenak, nous sommes nature, et le monde ne finit pas une fois pour toutes : il finit chaque fois qu'un peuple et son lien à la terre sont détruits. En 2023, il devient le premier autochtone élu à l'Académie brésilienne des lettres.",
   "Davi Kopenawa, né vers 1956, est un chaman et porte-parole du peuple yanomami, qui vit dans la forêt entre le Brésil et le Venezuela. Dans les années 1980, l'invasion de chercheurs d'or apporte épidémies et violences. Kopenawa porte la cause des siens jusqu'à l'étranger ; en 1992, le territoire yanomami est officiellement reconnu au Brésil. Il fonde ensuite l'association Hutukara.",
   "Avec l'anthropologue Bruce Albert, qui l'a écouté pendant des décennies, il publie La Chute du ciel (2010). Il y raconte la forêt vivante, les esprits xapiri que voient les chamans, et sa vision des Blancs, qu'il appelle « le peuple de la marchandise ». Si les chamans disparaissent, dit-il, plus personne ne retiendra le ciel, qui tombera sur tous. En 2023, l'État brésilien a déclaré une urgence sanitaire en territoire yanomami, face aux ravages de l'orpaillage illégal.",
   "Ces deux voix ne demandent pas qu'on les imite, mais qu'on les écoute : elles posent depuis l'Amazonie la question que la crise écologique pose à tous, celle de notre manière d'habiter la Terre."

  "title": "Césaire, Fanon, Glissant : penser le monde depuis la Martinique",
  "excerpt": "Trois Martiniquais ont bouleversé la pensée du XXe siècle : la négritude, la critique de l'aliénation coloniale, et la philosophie de la Relation et du Tout-Monde.",
  "tag": "Informer",
  "repere": "Martinique · XXe siècle",
  "body": [
   "Aimé Césaire (1913-2008) publie en 1939 le Cahier d'un retour au pays natal, long poème qui affirme la dignité des peuples noirs face au mépris colonial. Avec Senghor et Damas, il est l'un des fondateurs de la négritude. Son Discours sur le colonialisme (1950) retourne contre l'Europe l'accusation de barbarie. Maire de Fort-de-France pendant plus de cinquante ans, il reste une figure tutélaire de la Martinique.",
   "Frantz Fanon (1925-1961), élève de Césaire au lycée Schœlcher, devient psychiatre. Dans Peau noire, masques blancs (1952), il analyse comment le racisme colonial s'installe dans l'esprit même de ceux qui le subissent, jusqu'à leur faire désirer le regard du dominant : c'est l'aliénation. Médecin en Algérie, il rejoint la lutte pour l'indépendance. Les Damnés de la terre paraît en 1961, l'année de sa mort, à 36 ans.",
   "Édouard Glissant (1928-2011), lui aussi passé par le lycée Schœlcher, développe une philosophie originale. Contre les pensées de système, qui veulent tout ramener à une racine unique, il propose la Relation : les cultures se rencontrent, se mélangent et se transforment sans se dissoudre. Il appelle créolisation ce mélange imprévisible, dont les Antilles sont le laboratoire, et Tout-Monde l'univers qui en naît.",
   "Glissant défend aussi un « droit à l'opacité » : chacun a le droit de ne pas être entièrement compris, réduit ou classé par l'autre pour être respecté. Une idée devenue centrale dans les études postcoloniales, en art comme en philosophie.",
   "Trois hommes, une petite île marquée par l'esclavage et la colonisation, et des pensées qui parlent au monde entier. Leur leçon commune : on peut penser l'universel depuis la marge, à condition de ne pas oublier d'où l'on parle."
  ],
  "cles": [
   "Césaire cofonde la négritude et dénonce la barbarie coloniale.",
   "Fanon analyse l'aliénation que le racisme installe dans l'esprit des dominés.",
   "Glissant pense la Relation, la créolisation et le Tout-Monde.",

  "excerpt": "Fiodorov rêvait de vaincre la mort, Tsiolkovski de peupler l'espace, Vernadsky pensait la « noosphère ». Une philosophie russe étonnante, entre religion, science et utopie.",

  "body": [
   "Nikolaï Fiodorov (1829-1903) passe une grande partie de sa vie comme bibliothécaire au musée Roumiantsev de Moscou. Discret et ascétique, il élabore une pensée vertigineuse, publiée après sa mort sous le titre de Philosophie de l'œuvre commune. Selon lui, la tâche commune de l'humanité est de vaincre la mort et même de ressusciter les ancêtres, grâce à la science et à la coopération de tous. Dostoïevski, Tolstoï et Soloviev ont admiré ce penseur hors norme.",
   "Konstantin Tsiolkovski (1857-1935), devenu sourd dans l'enfance, est un autodidacte qui enseigne les mathématiques à Kalouga. Jeune homme, il fréquente la bibliothèque où travaille Fiodorov. En 1903, il publie une étude sur la propulsion des fusées qui pose les bases du vol spatial. Il imagine des stations en orbite et une humanité essaimant dans le cosmos.",

  "excerpt": "Condamné à mort puis gracié, bagnard en Sibérie, romancier de génie : Dostoïevski a posé dans ses romans les plus grandes questions sur la liberté et le mal.",
  "tag": "Informer",
  "repere": "Russie · 1821-1881",
  "body": [
   "Fiodor Dostoïevski naît à Moscou en 1821. Jeune écrivain à Saint-Pétersbourg, il fréquente un cercle de discussion socialiste. Arrêté en 1849, il est conduit avec ses camarades devant un peloton d'exécution, puis gracié au dernier moment : la condamnation à mort était une mise en scène. Il passe ensuite quatre ans au bagne d'Omsk, en Sibérie. Cette expérience transforme sa vision de l'être humain et de la foi.",
   "Dans les Carnets du sous-sol (1864), un narrateur amer défend la liberté humaine jusqu'à l'absurde : il préfère agir contre son propre intérêt plutôt que d'être réduit à une mécanique prévisible. Dans Crime et Châtiment (1866), l'étudiant Raskolnikov tue en se croyant au-dessus de la morale commune, puis découvre que la conscience ne se laisse pas faire.",
   "Les Frères Karamazov (1880) posent la question du mal. Ivan Karamazov se révolte contre un monde où des enfants souffrent. Il raconte la légende du Grand Inquisiteur : le Christ revient à Séville, et un vieux cardinal l'accuse d'avoir accablé les hommes en leur offrant la liberté, alors qu'ils préfèrent le pain, le miracle et l'autorité. Dostoïevski ne tranche pas : il laisse le lecteur face à la question.",
   "Dans L'Idiot (1869), un personnage rapporte que le prince Mychkine aurait dit que la beauté sauvera le monde. La formule est devenue célèbre, mais dans le roman elle est citée avec ironie, et la beauté y est fragile. Dostoïevski a profondément influencé Nietzsche, qui disait avoir appris de lui en psychologie, les existentialistes comme Camus, et le philosophe russe Nicolas Berdiaev.",
   "Lire Dostoïevski, c'est aussi rencontrer ses zones d'ombre, comme le nationalisme et les passages antisémites de son Journal d'un écrivain. Son œuvre reste une école de lucidité : la liberté est un fardeau autant qu'un don, et aucune théorie ne dispense de regarder la souffrance d'autrui."

  "excerpt": "Vers l'an mille, en Asie centrale, deux jeunes savants s'écrivent et se contredisent. L'un deviendra le médecin de l'Europe, l'autre un grand observateur de l'Inde.",
  "tag": "Informer",
  "repere": "Ouzbékistan actuel · Xe-XIe siècle",
  "body": [
   "Vers l'an mille, l'Asie centrale est l'un des grands foyers intellectuels du monde. Boukhara, capitale de la dynastie samanide, possède une bibliothèque réputée. C'est là que grandit Ibn Sina, connu en Europe sous le nom d'Avicenne (980-1037). Enfant prodige, il étudie la logique, les mathématiques et la médecine, et soigne l'émir avant ses vingt ans.",
   "Son Canon de la médecine organise tout le savoir médical de son temps ; traduit en latin, il est enseigné dans les universités européennes pendant des siècles. En philosophie, il imagine une célèbre expérience de pensée, « l'homme volant » : un être créé d'un coup, suspendu dans l'air, sans aucune sensation, saurait pourtant qu'il existe. Pour Ibn Sina, la conscience de soi ne dépend pas du corps.",
   "Al-Biruni (973-après 1050) naît dans le Khwarezm, au sud de la mer d'Aral. Astronome, mathématicien et géographe, il calcule le rayon de la Terre en mesurant l'horizon depuis une montagne. Envoyé en Inde dans le sillage des conquêtes de Mahmud de Ghazni, il apprend le sanskrit et écrit vers 1030 un grand livre sur l'Inde, ses religions, ses sciences et ses coutumes, d'une étonnante volonté d'objectivité.",
   "Jeunes, les deux savants échangent une correspondance restée fameuse. Al-Biruni y pose des questions dérangeantes sur la physique d'Aristote : le vide existe-t-il, le ciel est-il vraiment fait d'une matière à part ? Ibn Sina défend Aristote, parfois avec impatience. Ce dialogue montre une pensée libre, qui ose contester les autorités. L'historien Frederick Starr y voit l'un des signes d'un véritable « âge des Lumières » centrasiatique, longtemps oublié.",
   "Ces deux figures rappellent que les sciences et la philosophie n'ont pas une seule patrie. Elles ont circulé, de la Grèce à Boukhara puis à l'Europe, grâce à des savants qui parlaient arabe et persan."

 {
  "salon": "Spiritualités & religions du monde",
  "title": "Les religions du monde aujourd'hui : ce que disent les chiffres 2010-2020",
  "excerpt": "Chrétiens, musulmans, sans-religion, hindous, bouddhistes : la grande étude du Pew Research Center publiée en 2025 montre un paysage qui bouge. Repères et limites.",
  "tag": "Informer",
  "repere": "Monde · 2010-2020",
  "body": [
   "En juin 2025, le Pew Research Center, un institut de recherche américain non partisan, a publié une vaste étude sur l'évolution des religions entre 2010 et 2020. Ses équipes ont croisé plus de 2 700 sources : recensements, grandes enquêtes, registres de population. Elles couvrent 201 pays et territoires, soit la quasi-totalité de l'humanité. Le principe est simple : chaque personne est comptée, le plus souvent, selon la religion à laquelle elle déclare appartenir, sans mesurer sa pratique ni l'intensité de sa foi. Ces chiffres restent des estimations. Au moins 65 pays ont dû reporter leur recensement, et certaines données de 2020 ne sont parues qu'en 2024.",
   "En 2020, les chrétiens restent le groupe le plus nombreux : 2,3 milliards de personnes, soit 28,8 % de la population mondiale. Viennent ensuite les musulmans (environ 2 milliards, 25,6 %), les personnes sans religion (1,9 milliard, 24,2 %), les hindous (1,2 milliard, 14,9 %) et les bouddhistes (324 millions, 4,1 %). Les juifs sont 14,8 millions. Le reste, environ 2,2 %, rassemble des traditions très variées : bahaïs, taoïstes, jaïns, shintoïstes, sikhs, wiccans, zoroastriens et de nombreux petits groupes, dont certains relèvent des religions traditionnelles ou populaires.",
   "L'islam est la religion qui a le plus progressé : 347 millions de fidèles en plus en dix ans. L'explication est surtout démographique. Les musulmans sont plus jeunes (âge médian de 24 ans, contre 33 pour les non-musulmans) et ont plus d'enfants ; les conversions pèsent peu. Le christianisme gagne 122 millions de personnes mais recule de 1,8 point en part de la population. Son centre de gravité s'est déplacé : l'Afrique subsaharienne abrite désormais 30,7 % des chrétiens du monde, contre 22,3 % pour l'Europe. Les bouddhistes sont le seul grand groupe en baisse, avec 19 millions de fidèles en moins.",
   "Les personnes sans religion ont gagné 270 millions de membres. La raison principale : beaucoup d'adultes élevés dans une religion, le plus souvent chrétienne, la quittent. Pour un adulte qui rejoint une religion après avoir grandi sans, 3,2 abandonnent la leur. La Chine rassemble à elle seule 67 % des sans-religion du monde. Ils sont désormais majoritaires dans dix pays ou territoires, dont le Japon, la Tchéquie, les Pays-Bas, l'Uruguay et la Nouvelle-Zélande. Attention à une idée reçue : sans religion ne veut pas dire athée. La catégorie réunit athées, agnostiques et personnes sans appartenance particulière, dont certaines gardent des croyances religieuses ou spirituelles.",
   "Ces chiffres ont leurs limites. Une enquête demande en général une seule appartenance, alors que bien des vies religieuses sont faites de plusieurs fils. En 2010, une enquête du même institut menée dans 19 pays d'Afrique subsaharienne montrait que de nombreux chrétiens et musulmans consultent aussi des guérisseurs traditionnels ou croient au pouvoir protecteur des amulettes. Au Japon, 57 % des habitants se disent sans religion, alors que le shintō s'y vit surtout à travers des rites et la vie sociale. En Chine, seuls 10 % des habitants déclarent une religion, le niveau le plus bas de tous les pays étudiés, et ce chiffre a changé avec la nouvelle méthode de calcul."
  ],

   "L'islam progresse surtout pour des raisons démographiques, les sans-religion surtout parce que des personnes quittent la religion de leur enfance.",
   "Le christianisme est désormais d'abord africain : 30,7 % des chrétiens vivent en Afrique subsaharienne.",
   "Les bouddhistes sont le seul grand groupe dont le nombre a baissé entre 2010 et 2020.",

 {
  "salon": "Spiritualités & religions du monde",
  "title": "L'hindouisme, une mosaïque de voies vers la libération",
  "excerpt": "Dharma, karma, samsara, moksha : quatre mots pour entrer dans une tradition de 1,2 milliard de personnes, née en Inde et plurielle par nature.",
  "tag": "Informer",
  "repere": "Sous-continent indien · depuis le IIe millénaire av. J.-C.",
  "body": [
   "Le mot « hindouisme » est récent. Il a été forgé par des auteurs britanniques au début du XIXe siècle, à partir du terme « hindou » par lequel Grecs et Perses désignaient les habitants de la vallée de l'Indus. Beaucoup de fidèles préfèrent parler de sanatana dharma, « la loi éternelle », ou de hindu dharma. Derrière ce nom récent se trouve une tradition très ancienne. Ses plus vieux textes, les hymnes du Rig-Veda, ont été composés en sanskrit vers 1500 avant notre ère, dans la région du Pendjab, aujourd'hui partagée entre l'Inde et le Pakistan. Ils ont été transmis oralement pendant plus d'un millénaire avant d'être mis par écrit, vers 300 avant notre ère.",
   "Quatre notions éclairent la vision du monde partagée par la plupart des hindous. Le dharma désigne l'ordre moral et religieux, c'est-à-dire ce qui est juste et les devoirs de chacun envers sa famille et la société. Le karma est l'effet de nos actes sur nos vies présentes et futures. Le samsara est le cycle des naissances et des morts, sans commencement ni fin clairement définis, dans lequel ce karma nous retient. La moksha, enfin, est la libération de ce cycle. Les penseurs hindous ont longtemps discuté la tension entre le dharma, qui invite à tenir son rôle dans le monde, et la moksha, qui pousse à s'en détacher.",
   "La Bhagavad-Gîtâ, « le chant de Dieu », est un épisode de la grande épopée du Mahabharata, composé sans doute au Ier ou au IIe siècle de notre ère. Le prince Arjuna, au bord d'une bataille fratricide, y dialogue avec Krishna, incarnation du dieu Vishnou. Le texte présente trois voies vers la libération. Le karma yoga est la voie de l'action : accomplir ses devoirs sans s'attacher à leurs fruits. Le jnana yoga est la voie de la connaissance : une longue discipline de méditation pour percevoir l'unité entre soi et le brahman, le principe absolu. La bhakti est la voie de la dévotion, l'amour d'un Dieu personnel. La tradition les juge adaptées à des tempéraments différents mais accessibles à tous.",
   "L'hindouisme réunit des systèmes de pensée, de croyances et de rites très variés, que l'Encyclopædia Britannica juge mieux compris à travers leurs multiples formes régionales. Beaucoup de fidèles honorent un Dieu suprême sous une forme particulière : Vishnou pour les vishnouites, Shiva pour les shivaïtes, la Déesse (Shakti) pour les shaktas. D'autres le pensent comme un absolu sans forme, le brahman. La dévotion a été portée par des poètes en langues populaires, femmes et hommes de toutes conditions, en tamoul dès le VIIe siècle puis dans toute l'Inde. Au XVIe siècle, la princesse rajpoute Mira Bai brava les usages de son rang de veuve pour chanter son amour de Krishna.",
   "Aujourd'hui, l'hindouisme compte environ 1,2 milliard de fidèles, soit 14,9 % de l'humanité, et 95 % d'entre eux vivent en Inde. Il existe aussi à Bali, en Indonésie, sous une forme propre, et dans de nombreuses diasporas : au Canada, 2,3 % des habitants se déclaraient hindous en 2021. La question des castes traverse l'histoire de la tradition. Des textes anciens affirment déjà que la qualité de brahmane tient au savoir plutôt qu'à la naissance, et la poésie dévotionnelle oppose volontiers l'étroitesse de certains brahmanes à la ferveur de poètes-saints comme Kabir ou Ravidas. La psalmodie des Védas est inscrite au patrimoine immatériel de l'UNESCO ; seules 13 de ses plus de mille écoles de récitation ont survécu."
