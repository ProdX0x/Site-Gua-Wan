  "excerpt": "De l'éveil du Bouddha aux écoles Theravada, Mahayana et Vajrayana, une tradition qui part d'un constat, la souffrance, et propose un chemin pour s'en libérer.",
  "tag": "Informer",
  "repere": "Inde du Nord-Est · Ve siècle av. J.-C.",
  "body": [
   "Siddhartha Gautama, que ses disciples appelleront le Bouddha, « l'Éveillé », a vécu dans le nord-est de l'Inde. La tradition situe sa vie vers 560-480 avant notre ère ; beaucoup d'historiens pensent aujourd'hui qu'il est mort vers 405. Selon les récits, ce prince du clan des Shakya, né dans le jardin de Lumbini, quitte une vie de luxe après avoir pris conscience de la vieillesse, de la maladie et de la mort. Il rejette ensuite aussi bien les plaisirs que les mortifications extrêmes, et atteint l'éveil en méditant sous un arbre, à Bodh-Gaya selon la tradition. Il enseigne pendant quarante-cinq ans et fonde des communautés de moines et de nonnes.",
   "Son premier sermon, prononcé dans le parc aux gazelles d'Isipatana, près de Bénarès (Varanasi), expose les quatre nobles vérités. Première vérité : l'existence comporte de la souffrance, ou de l'insatisfaction (dukkha) : vieillir, tomber malade, être séparé de ce qu'on aime, ne pas obtenir ce qu'on désire. Deuxième : cette souffrance a une origine, la soif ou l'avidité qui nous fait nous agripper aux choses. Troisième : elle peut cesser, quand cette soif s'éteint ; c'est l'apaisement du nirvana. Quatrième : il existe un chemin pour y parvenir. La démarche ressemble à celle d'un médecin : constater le mal, trouver sa cause, affirmer la guérison possible, prescrire le traitement.",
   "Ce traitement est le noble sentier octuple, aussi appelé « voie du milieu », car il évite à la fois la recherche des plaisirs et les privations qui épuisent. Ses huit branches sont la vue juste, l'intention juste, la parole juste, l'action juste, les moyens d'existence justes, l'effort juste, l'attention juste et la concentration juste. Une idée reçue veut que tous les bouddhistes passent leur temps à méditer. Dans la plupart des sociétés bouddhistes, les laïcs pratiquent surtout le don : ils soutiennent les moines et les nonnes, qui enseignent et accomplissent les rites, et acquièrent ainsi des « mérites » pour leur vie présente et future.",
   "Au fil des siècles, trois grands courants se sont formés. Le Theravada, « la voie des Anciens », s'appuie sur les textes conservés en pali ; il domine au Sri Lanka, en Birmanie, en Thaïlande, au Cambodge et au Laos. Le Mahayana, « le grand véhicule », a reconnu de nouveaux textes et met en avant le bodhisattva, qui cherche l'éveil pour en montrer le chemin aux autres ; il s'est répandu en Chine, en Corée, au Japon et au Vietnam, avec des écoles comme le zen ou la Terre pure. Le Vajrayana, « le véhicule de diamant », apparu en Inde dans la seconde moitié du Ier millénaire, recourt à des rituels et des mantras pour hâter l'éveil ; il s'est implanté au Tibet, en Mongolie et dans l'Himalaya.",
   "Avec 324 millions de fidèles en 2020, le bouddhisme est le seul grand groupe religieux dont les effectifs ont baissé en dix ans. Ses fidèles vivent surtout dans des pays dont le poids démographique diminue, comme la Chine et le Japon, leur population est plus âgée, et l'on compte 1,8 départ pour 1 arrivée. Ailleurs, il se renouvelle. En 1956, à Nagpur, Bhimrao Ramji Ambedkar, l'un des rédacteurs de la Constitution indienne, se convertit avec des centaines de milliers de dalits, autrefois appelés « intouchables », pour rompre avec le système des castes. Autre nuance : dans le monde theravada, l'ordre des nonnes a disparu il y a plus de mille ans, et les efforts pour le rétablir restent limités."
  ],

  "excerpt": "Une tradition où l'étude est un acte religieux et où le désaccord se transmet avec respect : Torah, Talmud, courants et visages méconnus du judaïsme.",

  "body": [
   "Le judaïsme est la religion du peuple juif, née chez les Hébreux de l'Antiquité. Il repose sur la croyance en un Dieu unique et transcendant, qui s'est révélé à Abraham, à Moïse et aux prophètes, et sur une vie conforme aux Écritures et aux traditions des rabbins. Son texte fondateur est la Torah, première partie de la Bible hébraïque. Pour la tradition rabbinique, la révélation comprend aussi une loi orale, transmise de maître à disciple puis mise par écrit. On compte aujourd'hui environ 14,8 millions de juifs dans le monde. Avec la croissance de la population juive d'Israël, passée de 5,8 à 6,8 millions entre 2010 et 2020, le Moyen-Orient et l'Afrique du Nord ont dépassé l'Amérique du Nord comme première région juive du monde.",
   "Vers l'an 200, Rabbi Juda ha-Nassi rassemble cette tradition orale dans la Mishna, un recueil de lois. Pendant les siècles suivants, les sages la commentent dans les académies de Palestine et de Babylonie, l'actuel Irak. Ces discussions forment la Guemara. Ensemble, Mishna et Guemara composent le Talmud, mot qui signifie « étude ». Il en existe deux : le Talmud de Jérusalem, plus court et jamais complètement mis en forme, et le Talmud de Babylone, rédigé lentement jusqu'à la fin du Ve siècle environ. Au XIe siècle, Rachi, un savant de Troyes, en Champagne, en écrit un commentaire si clair qu'il est encore imprimé à côté du texte sur les pages du Talmud.",
   "Le Talmud n'est pas un code de lois bien rangé. C'est une conversation de plusieurs siècles, où les avis divergents sont conservés et attribués à leurs auteurs. Son style reflète l'esprit des académies, où chacun participait à l'examen du texte en débattant. Étudier y devient un acte religieux : comprendre, c'est interpréter activement plutôt que mémoriser. Un passage célèbre, au traité Eruvin, raconte que les écoles de Hillel et de Shammaï se sont opposées pendant trois ans. Une voix céleste tranche : les deux positions sont « paroles du Dieu vivant », mais la loi suit Hillel. Pourquoi ? Parce que ses disciples étaient aimables et patients, et enseignaient l'avis de leurs adversaires avant le leur.",
   "Le judaïsme d'aujourd'hui est pluriel. Les courants orthodoxes tiennent pour contraignantes les lois de la Bible et du Talmud. Le judaïsme réformé, né en Allemagne au début du XIXe siècle, a modifié de nombreuses pratiques pour les adapter au monde moderne ; d'autres courants, comme le judaïsme conservateur, ont trouvé leurs propres équilibres. Tous se réclament pourtant des sages du Talmud. D'autres traditions s'en écartent : les karaïtes, apparus au VIIIe siècle en Babylonie, rejettent la loi orale. Les Beta Israel d'Éthiopie, dont quelque 45 000 membres ont rejoint Israël entre 1980 et 1992, ont une Bible et des prières en guèze, une langue éthiopienne ancienne, et ne suivent pas les lois talmudiques.",
   "Des figures longtemps oubliées témoignent de cette vitalité. Née à Berlin en 1902, Regina Jonas soutient en 1930 un mémoire intitulé « Une femme peut-elle exercer la fonction de rabbin ? ». Elle y conclut que, du point de vue de la loi juive, presque rien ne s'y oppose, hormis les préjugés et le manque d'habitude. Ordonnée en 1935 par le rabbin libéral Max Dienemann, elle est la première femme rabbin connue. Déportée, elle continue de prêcher et d'enseigner au camp de Theresienstadt de 1942 à 1944, avant d'être assassinée à Auschwitz. Son histoire n'a été redécouverte qu'après la chute du mur de Berlin, quand des archives est-allemandes sont devenues accessibles."

  "excerpt": "Du message de Jésus de Nazareth aux Églises catholique, orthodoxes et protestantes : une religion de 2,3 milliards de fidèles, aujourd'hui d'abord africaine.",

  "repere": "Galilée et Jérusalem · Ier siècle",
  "body": [
   "Le christianisme est né autour de Jésus de Nazareth, un juif de Galilée né entre 6 et 4 avant notre ère, peu avant la mort d'Hérode le Grand, et exécuté à Jérusalem vers l'an 30. Comme la plupart des juifs de Palestine à son époque, il parlait araméen. Ses disciples acquièrent la conviction qu'il est ressuscité et le reconnaissent comme le Christ, du grec christos, qui traduit l'hébreu mashiah, « celui qui a reçu l'onction ». Pour la plupart des chrétiens, il est Dieu fait homme. Les principales sources sur sa vie sont les quatre Évangiles, écrits entre 60 et 90 environ, après les lettres de l'apôtre Paul, rédigées à partir de l'an 50.",
   "Dans les Évangiles, Jésus annonce la venue du royaume de Dieu, surtout à travers des paraboles tirées de la vie des villages, comme celle de la brebis perdue que le berger part chercher. Les Béatitudes, au début du Sermon sur la montagne, proclament heureux les pauvres et les doux. Jésus affirme que des pécheurs, comme les collecteurs d'impôts et les prostituées, auront leur place dans le royaume, et il appelle à aimer jusqu'à ses ennemis. Interrogé sur le plus grand commandement, il associe l'amour de Dieu et l'amour du prochain, en reprenant un précepte du Lévitique. Son message s'enracine ainsi dans le judaïsme de son temps.",
   "Au fil de l'histoire, les chrétiens se sont divisés. Entre le Ve et le XIe siècle, les Églises de langue grecque et l'Église de Rome s'éloignent peu à peu. En 1054, les excommunications réciproques entre le pape et le patriarche de Constantinople marquent la rupture entre catholiques et orthodoxes ; elles ne seront levées qu'en 1965. Au XVIe siècle, la Réforme menée notamment par Martin Luther et Jean Calvin donne naissance au protestantisme. En 2010, environ la moitié des chrétiens étaient catholiques, 37 % protestants au sens large et 12 % orthodoxes. D'autres Églises anciennes, dites orientales, comme l'Église orthodoxe éthiopienne Tewahedo, gardent leurs propres langues liturgiques et traditions.",
   "Le visage du christianisme a changé. Avec 2,3 milliards de fidèles en 2020, il reste la première religion du monde, mais sa part recule, surtout parce que beaucoup de personnes élevées dans le christianisme le quittent : on compte 3,1 départs pour une arrivée. Dans le même temps, son centre de gravité s'est déplacé vers le Sud. L'Afrique subsaharienne abrite désormais 30,7 % des chrétiens, contre 22,3 % pour l'Europe. Les orthodoxes, environ 260 millions, vivent pour près de quatre sur cinq en Europe ; la Russie en compte à elle seule plus de 100 millions. L'Église éthiopienne Tewahedo réunit environ 36 millions de fidèles, près de 14 % du monde orthodoxe.",
   "Le christianisme possède aussi une longue tradition mystique, c'est-à-dire une recherche d'expérience directe de Dieu par la prière. En Angleterre, Julienne de Norwich, une recluse née en 1342, reçoit en 1373 une série de visions. Elle les médite pendant vingt à trente ans dans ses Révélations de l'amour divin, où le Christ lui répond que « tout sera bien ». En Russie, Séraphin de Sarov (1759-1833) vit vingt-cinq ans en ermite dans la forêt, puis accueille pèlerins et fidèles. Il enseigne que la prière contemplative n'est pas réservée aux moines : elle est, selon lui, à la portée de tout chrétien. L'Église orthodoxe russe l'a proclamé saint en 1903."

  "title": "L'islam : cinq piliers, une communauté plurielle et la voie soufie de Rûmî",
  "excerpt": "Deux milliards de fidèles, de l'Indonésie au Maroc : les pratiques communes de l'islam, la diversité sunnite et chiite, et la quête mystique des soufis.",
  "tag": "Informer",
  "repere": "Arabie · VIIe siècle",
  "body": [
   "L'islam est né en Arabie au VIIe siècle, autour de la prédication du prophète Muhammad. Le mot islam signifie littéralement « remise de soi » : le croyant, le musulman, s'en remet à la volonté de Dieu, Allah en arabe. Pour les musulmans, cette volonté est révélée dans le Coran, transmis par Dieu à Muhammad. Muhammad y est le dernier d'une lignée de prophètes qui comprend Adam, Noé, Abraham, Moïse, Salomon et Jésus. Dans les années 620, chassés de La Mecque, Muhammad et ses compagnons s'installent à Médine, où naît en 622 la première communauté musulmane organisée. Le Prophète meurt en 632. L'islam compte aujourd'hui environ 2 milliards de fidèles.",
   "Les « cinq piliers » résument les devoirs que la tradition sunnite place au centre de la vie musulmane. Un hadith, parole attribuée au Prophète et rapportée dans le recueil d'al-Bukhari, les énumère. Ce sont la profession de foi (« il n'y a de dieu que Dieu, Muhammad est le messager de Dieu »), la prière rituelle cinq fois par jour, l'aumône obligatoire (zakat) au profit des pauvres, le jeûne du mois de ramadan, du lever au coucher du soleil, et le pèlerinage à La Mecque (hajj) pour qui en a les moyens physiques et financiers. Les chiites tiennent aussi ces pratiques pour essentielles, mais présentent souvent leur foi selon un autre classement.",
   "La communauté s'est divisée très tôt sur la succession du Prophète. Des membres de la communauté choisirent Abou Bakr comme calife. D'autres estimaient que la direction revenait à Ali, cousin et gendre de Muhammad, puis à sa famille, en s'appuyant notamment sur une parole du Prophète dont le sens reste discuté : ce sont les chiites, aujourd'hui divisés en plusieurs branches, dont les duodécimains, les ismaéliens et les zaydites du Yémen. Selon le Pew Research Center, 87 à 90 % des musulmans sont sunnites et 10 à 13 % chiites. Contrairement à une idée reçue, l'islam n'est pas d'abord arabe : 62 % des musulmans vivent en Asie, environ 20 % au Moyen-Orient et en Afrique du Nord. L'Indonésie en compte 239 millions.",
   "Le soufisme est la dimension mystique de l'islam : la recherche d'une expérience personnelle et directe de l'amour et de la connaissance de Dieu. Son nom viendrait de suf, la laine, en souvenir des vêtements de laine des premiers ascètes. Les historiens pensent aujourd'hui qu'il est né de l'ascétisme musulman des premiers siècles, et non d'influences étrangères, intégrées plus tard. Les soufis se rassemblent en confréries autour d'un maître et pratiquent le dhikr, le « souvenir » de Dieu par la répétition de ses noms. Au VIIIe siècle, Rabia al-Adawiyya, une femme de Bassora, fut la première à formuler l'idéal d'un amour de Dieu désintéressé, sans espoir du paradis ni crainte de l'enfer.",
   "Le plus célèbre des poètes soufis, Jalal al-Din Rûmî, naît en 1207 à Balkh, dans l'actuel Afghanistan, et meurt en 1273 à Konya, en Turquie. En 1244, sa rencontre avec un derviche errant, Shams de Tabriz, bouleverse sa vie. Il compose alors une abondante poésie lyrique, puis le Masnavi, près de 26 000 distiques en persan. Après sa mort, ses disciples forment l'ordre des Mevlevi, connu pour sa cérémonie du sema, où les derviches tournent sur eux-mêmes ; l'UNESCO l'a inscrite au patrimoine immatériel en 2008. Rûmî est souvent présenté comme le poète le plus vendu aux États-Unis, mais bien des adaptations populaires effacent ses références au Coran, qu'il a étudié toute sa vie."
  ],

  "title": "Le sikhisme : Guru Nanak, l'égalité et la table ouverte du langar",
  "excerpt": "Né au Pendjab à la fin du XVe siècle, le sikhisme affirme l'égalité de tous devant Dieu. Sa cuisine communautaire gratuite, le langar, en est le symbole vivant.",
  "tag": "Informer",
  "repere": "Pendjab · fin du XVe siècle",
  "body": [
   "Le sikhisme est né au Pendjab, région aujourd'hui partagée entre l'Inde et le Pakistan. Selon la tradition, son fondateur, Guru Nanak, naît en 1469 à Talvandi, l'actuelle Nankana Sahib, au Pakistan, et meurt en 1539 à Kartarpur. En pendjabi, sikh signifie « celui qui apprend ». Les fidèles appellent leur voie Gurmat, « la voie du Guru ». Après Nanak, neuf autres gourous se succèdent, habités selon les sikhs par un même esprit. À la mort du dixième, Guru Gobind Singh, en 1708, l'autorité passe au livre saint, le Guru Granth Sahib, considéré depuis comme le Guru éternel. On compte près de 25 millions de sikhs dans le monde.",
   "Selon les récits de sa vie, Nanak a grandi dans un milieu hindou et dialoguait avec des ascètes hindous comme avec des soufis musulmans. Il enseigne un Dieu unique, sans forme, qu'on ne peut ni représenter ni enfermer dans un lieu, et une libération par la méditation sur le Nom divin (nam simaran). Les sikhs considèrent leur tradition comme distincte depuis l'origine. Plusieurs historiens occidentaux la rattachent plutôt, au départ, au mouvement des Sants de l'Inde du Nord, dont faisait partie le poète Kabir. Les biographies de Nanak, les janam-sakhis, écrites cinquante à quatre-vingts ans après sa mort, mêlent d'ailleurs souvenirs historiques et légendes.",
   "L'égalité est au cœur du message. Le Guru Granth Sahib condamne nettement le système des castes. On y trouve, à côté des hymnes des gourous, ceux de poètes extérieurs au sikhisme : des Sants, pour la plupart hindous, comme Kabir, et deux soufis musulmans, dont Farid. Dans un hymne célèbre, Guru Nanak défend aussi la dignité des femmes. Depuis la fondation de la Khalsa, la communauté des initiés, en 1699 selon la tradition, les hommes initiés prennent le nom de Singh, « lion », et les femmes celui de Kaur, « princesse ». Ces noms sont aujourd'hui donnés à tous les sikhs, dès la cérémonie de naissance.",
   "Le langar est la traduction la plus concrète de cette égalité. Chaque gurdwara, le lieu de culte sikh, comprend une salle où un repas est offert gratuitement à toute personne qui se présente, sikhe ou non. Chacun s'y assoit en rang, ni devant pour revendiquer un rang supérieur, ni derrière pour marquer une infériorité. Selon l'Encyclopædia Britannica, le langar est né comme une protestation contre le système des castes. Le Guru Granth Sahib garde la mémoire de Mata Khivi, épouse du deuxième gourou, Guru Angad : elle distribuait les richesses du langar, une bouillie de riz au beurre clarifié comparée à de l'ambroisie. Au Temple d'or d'Amritsar, le langar sert chaque jour des milliers de repas.",
   "La diaspora sikhe est importante : au Canada, environ 770 000 personnes, soit 2,1 % de la population, se déclaraient sikhes en 2021. Contrairement à une idée reçue, tous les sikhs ne portent pas les cheveux non coupés et le turban. L'obligation des « cinq K » (cheveux non coupés, peigne, caleçon court, bracelet d'acier et épée cérémonielle) ne s'est généralisée qu'avec les mouvements de réforme de la fin du XIXe et du début du XXe siècle. Le sikhisme connaît aussi ses débats. Rejetée par les textes, la caste pèse encore dans certains mariages, et certains gurdwaras restent liés à une caste particulière, même si beaucoup de sikhs s'en affranchissent aujourd'hui."
  ],

  "title": "Le jaïnisme et l'ahimsa : la non-violence poussée jusqu'au bout",
  "excerpt": "Ne nuire à aucun être vivant, même le plus petit : le jaïnisme fait de cet idéal une discipline de vie. Mahavira, les deux grandes écoles et l'héritage reçu par Gandhi.",
  "tag": "Informer",
  "repere": "Vallée orientale du Gange · VIIe-Ve siècle av. J.-C.",
  "body": [
   "Le jaïnisme est, avec l'hindouisme et le bouddhisme, l'une des trois plus anciennes traditions religieuses de l'Inde encore vivantes. Les historiens le font naître entre le VIIe et le Ve siècle avant notre ère, dans le bassin oriental du Gange. Son nom vient du sanskrit ji, « vaincre » : le jina, le « vainqueur », est celui qui a triomphé de ses passions, et les jaïns sont ses disciples. Des savants occidentaux l'ont longtemps pris pour une secte hindoue ou une dissidence bouddhiste. On le reconnaît aujourd'hui comme une tradition indépendante. Faute de statistiques précises, on estime qu'il compte plus de six millions de fidèles, en grande majorité en Inde.",
   "Pour les jaïns, la vérité a été enseignée par vingt-quatre tirthankaras, littéralement « faiseurs de gués », c'est-à-dire des sauveurs qui ont enseigné la voie jaïne. Le dernier est Mahavira. La tradition le fait naître vers 599 et mourir en 527 avant notre ère ; beaucoup d'historiens le placent jusqu'à un siècle plus tard, à l'époque du Bouddha. Issu d'une famille de guerriers de Kshatriyakundagrama, faubourg de Vaishali, dans l'actuel Bihar, il renonce au monde à trente ans. Après douze ans d'ascèse extrême, il atteint l'omniscience (kevala). Il s'appuie sur l'enseignement de Parshvanatha, le vingt-troisième tirthankara, un maître du VIIe siècle avant notre ère originaire de Bénarès.",
   "Au centre se trouve l'ahimsa, la non-nuisance. Pour les jaïns, chaque être vivant possède une âme (jiva), y compris les insectes, les plantes et les êtres microscopiques. Faire du tort à une âme attire le karma, conçu comme une matière très fine qui se dépose sur l'âme et la retient dans le cycle des renaissances. Moines et nonnes prononcent cinq grands vœux : ne pas nuire, ne pas mentir, ne pas voler, rester chaste, ne rien posséder. Ils ne mangent pas après la tombée de la nuit, pour ne pas blesser d'insectes attirés par la nourriture, et boivent de l'eau bouillie. Dans certains courants, ils portent en permanence un tissu devant la bouche.",
   "La plupart des jaïns sont des laïcs. Ils prennent des « petits vœux » adaptés à la vie ordinaire et suivent un régime qui exclut la viande, le vin, le miel et certains fruits et racines jugés riches en vies. Deux grandes écoles se partagent la tradition. Les religieux shvetambara (« vêtus de blanc ») portent des robes blanches ; chez les digambara (« vêtus d'espace »), les moines vont nus. Elles divergent aussi sur les femmes : pour les digambara, une âme ne peut atteindre la libération depuis un corps féminin. Les nonnes sont pourtant environ trois fois plus nombreuses que les moines, même si leur statut reste moins prestigieux. Le jeûne rituel jusqu'à la mort, la sallekhana, que les jaïns distinguent du suicide, est aujourd'hui rare.",
   "Le jaïnisme a profondément marqué Gandhi. Il grandit au Gujarat, dans une famille vishnouite fortement imprégnée de jaïnisme, où la non-violence, le végétarisme et le jeûne allaient de soi. Avant son départ pour étudier le droit à Londres, c'est un moine jaïn, Becharji Swami, qui lui fait prononcer le vœu de ne toucher ni au vin, ni aux femmes, ni à la viande. Plus tard, Gandhi place le poète et joaillier Raychandbhai, honoré par des communautés jaïnes comme un réformateur sous le nom de Shrimad Rajchandra, parmi les trois « modernes » qui l'ont le plus marqué, avec Tolstoï et Ruskin. Il transpose ensuite l'ahimsa en politique, sous la forme de la résistance non violente."
  ],
  "cles": [
   "L'ahimsa, ne nuire à aucun être vivant, est la règle centrale du jaïnisme.",
   "Mahavira est, pour les jaïns, le dernier des vingt-quatre tirthankaras et non un fondateur absolu.",
   "Moines et nonnes suivent cinq grands vœux ; les laïcs adaptent ces exigences à la vie ordinaire.",

  "excerpt": "Née dans l'Iran ancien, la religion de Zarathoustra place chacun devant un choix entre la Vérité et le Mensonge. Elle vit encore en Iran, en Inde et dans la diaspora.",

  "body": [
   "Le zoroastrisme est la religion fondée, selon la tradition, par le prophète iranien Zarathoustra, que les Grecs appelaient Zoroastre. Il devint la religion dominante de l'Iran jusqu'au triomphe de l'islam, après la conquête arabe du VIIe siècle. Il survit aujourd'hui en Iran, en particulier à Yazd et à Kerman, où les zoroastriens ont longtemps formé une minorité persécutée, et surtout en Inde, où vivent les descendants d'émigrés iraniens, les Parsis. Il réunit des traits monothéistes et dualistes. L'Encyclopædia Britannica juge probable son influence sur le judaïsme, le christianisme et l'islam, tout en soulignant combien ses origines restent obscures.",
   "Quand a vécu Zarathoustra ? La question embarrasse les spécialistes depuis longtemps. S'il existe un semblant de consensus, il le situe vers 1000 avant notre ère, à un siècle près ; mais des chercheurs reconnus ont proposé des dates allant de 1750 avant notre ère à la « 258e année avant Alexandre », soit le VIe siècle avant notre ère. Aucun lieu ni aucun personnage cité dans ses hymnes n'est connu par une autre source. La langue des textes oriente vers l'est du monde iranien. Certains savants doutent même qu'il soit l'auteur des hymnes qui portent son nom : un personnage appelé Zarathoustra y apparaîtrait, sans en être forcément le poète.",
   "Ses enseignements sont conservés dans les Gâthâs, des hymnes en avestique, une langue iranienne ancienne, intégrés à la liturgie du Yasna. Ils célèbrent un dieu suprême, Ahura Mazda, et évoquent deux esprits originels, jumeaux, l'un meilleur et l'autre mauvais « en pensée, en parole et en acte ». Chaque être humain doit choisir entre eux, entre la Vérité et le Mensonge, et ce choix engage toute sa vie. La triade des bonnes pensées, des bonnes paroles et des bonnes actions traverse ainsi toute la religion. Après la mort, enseigne-t-elle, l'âme est jugée puis s'élève par trois étapes qui correspondent à ses bonnes pensées, ses bonnes paroles et ses bonnes actions.",
   "Après la conquête arabe, des zoroastriens quittent l'Iran pour l'Inde. Le seul récit de cet exil, la Qissa-i Sanjan, n'avance que des chiffres ronds, si bien que les historiens proposent des dates allant de 716 à 936. Accueillis au Gujarat, ces réfugiés deviennent les Parsis. Sous la domination britannique, ces anciens agriculteurs s'enrichissent dans le commerce puis l'industrie, surtout à Bombay : la famille Tata y lance la sidérurgie indienne. Vers sept ans en Inde, dix ans en Iran, les enfants sont initiés en recevant une chemise sacrée (sadre) et une cordelette (kusti), qu'ils porteront toute leur vie. Dans les temples, des prêtres entretiennent le feu sacré, la bouche couverte d'un voile.",
   "Une figure méconnue montre les liens entre Parsis et zoroastriens d'Iran. En 1854, Manekji Limji Hataria, envoyé par les Parsis de Bombay, découvre la grande pauvreté de ses coreligionnaires iraniens, soumis à un impôt discriminatoire, la jizya. Il fonde des écoles, la première en 1860 à Téhéran, et joue un rôle central dans une longue campagne, relayée sur le plan international, qui obtient l'abolition de cet impôt en 1882. Aujourd'hui, la communauté parsie, en déclin, débat vivement de son avenir : faut-il accepter les conjoints non zoroastriens et les conversions ? Comment préserver les funérailles traditionnelles, qui exposent les corps aux vautours dans des « tours du silence », alors que ces oiseaux ont presque disparu de Bombay dans les années 1990 ?"

  "title": "Le shintō, la voie des kami : sanctuaires, pureté et nature",
  "excerpt": "Sans fondateur ni dogme, le shintō honore des kami présents dans les montagnes, les rochers ou les ancêtres. Une tradition japonaise qui se vit plus qu'elle ne se professe.",
  "tag": "Informer",
  "repere": "Japon · des origines à aujourd'hui",
  "body": [
   "Le mot shintō signifie « la voie des kami ». Il s'est imposé pour distinguer les croyances indigènes du Japon du bouddhisme, introduit officiellement dans l'archipel en 552 selon la date traditionnelle. Le shintō n'a ni fondateur, ni écritures sacrées au sens strict, ni dogmes fixés. Ses grands récits mythologiques sont consignés dans deux chroniques, le Kojiki, compilé en 712, et le Nihon shoki, compilé en 720. Elles racontent l'origine de la famille régnante et visaient à renforcer son autorité : les historiens y lisent donc une forte coloration politique, autour notamment de la déesse du soleil, Amaterasu.",
   "Le mot kami est difficile à traduire. Il désigne des divinités, mais aussi des forces de la nature, bienfaisantes ou redoutables, des ancêtres illustres, des animaux, des plantes ou des rochers, dès lors qu'ils suscitent révérence et respect. Les mythes parlent des « huit cents myriades de kami » pour dire leur nombre infini, et de nouveaux kami continuent d'être reconnus. Dès l'Antiquité, les Japonais voyaient des kami dans les mers et les montagnes, comme chez des êtres humains remarquables. Le kami n'est pas forcément un être lointain : il se manifeste dans un objet, un lieu, un paysage.",
   "Les kami sont honorés dans des sanctuaires, les jinja. Un portique, le torii, sépare l'espace sacré du monde profane. Avant de prier, le visiteur se lave les mains et se rince la bouche à un bassin. Ce geste exprime une idée centrale, la pureté. Les rites de harae purifient le corps et l'esprit des fautes et des souillures (kegare) accumulées, parfois par des ablutions dans l'eau, le misogi. Au cœur du sanctuaire, dans le bâtiment principal (honden), un objet accueille le kami, le plus souvent un miroir soigneusement enveloppé. Nul ne doit le voir : seul le prêtre principal entre dans ce sanctuaire intérieur.",
   "Le grand sanctuaire d'Ise, consacré à Amaterasu, illustre le rapport du shintō au temps et à la matière. Depuis 690, ses principaux bâtiments sont reconstruits à l'identique tous les vingt ans sur un terrain voisin, ce qui demande environ 14 000 pièces de bois : la 62e reconstruction a eu lieu en 2013, la suivante est prévue en 2033. Ce lien entre les kami et des lieux précis explique aussi pourquoi la disparition de sanctuaires a marqué les esprits. Entre 1906 et 1914, une politique de fusion imposée par l'État fit passer leur nombre d'environ 200 000 à 120 000. Des intellectuels comme Minakata Kumagusu s'y opposèrent, et l'État finit par renoncer aux fusions forcées.",
   "L'histoire du shintō est mêlée à celle du bouddhisme. Pendant des siècles, kami et bouddhas ont été associés : des temples bouddhiques s'élevaient dans l'enceinte des sanctuaires, et des moines en assuraient parfois la gestion. Cet amalgame prend fin avec la restauration de Meiji, en 1868, et le shintō devient un culte d'État. Ce « shintō d'État » est démantelé en 1945 sur ordre des forces d'occupation alliées, et la Constitution de 1947 confirme cette séparation. Aujourd'hui, 57 % des Japonais se disent sans religion, alors que le shintō se vit surtout dans les rites et la vie sociale. Le Japon religieux ne se résume pas aux grands sanctuaires : l'Encyclopédie du shintō de l'université Kokugakuin consacre une section propre aux rites d'Okinawa et d'Amami, au sud de l'archipel."
  ],

  "title": "Religions yoruba, vodun et leurs héritiers aux Amériques",
  "excerpt": "D'Ile-Ife à Bahia, La Havane et Port-au-Prince : orisha, Ifá, vodun, candomblé, santería et vodou haïtien, des traditions vivantes, loin des clichés.",
  "tag": "Informer",
  "repere": "Afrique de l'Ouest et Amériques · Ife dès le XIe siècle",
  "body": [
   "Les religions africaines sont souvent réduites à des clichés. Ce sont pourtant des systèmes complets de pensée, de rites et de soin. La religion des Yoruba, peuple du Nigeria et du Bénin voisin, en offre un bel exemple. Pour les Yoruba, Ile-Ife, dans le sud-ouest du Nigeria, est une cité sainte, le lieu légendaire de la naissance de l'humanité. Elle était déjà la capitale d'un royaume bien établi au début du XIe siècle, et ses artisans y créaient dès le XIIe ou le XIIIe siècle de célèbres têtes en terre cuite et en bronze. Les fidèles honorent les orisha, des divinités comme Osun, déesse de la fécondité, auxquelles on demande protection, sagesse et réussite.",
   "Au cœur de cette tradition se trouve Ifá, un système de divination proclamé par l'UNESCO en 2005 et inscrit en 2008 au patrimoine culturel immatériel de l'humanité. Ifá ne repose pas sur les dons d'un voyant. Le prêtre, appelé babalawo, manipule des noix de palme sacrées ou une chaîne divinatoire pour obtenir des signes. Chaque signe renvoie à l'une des 256 parties d'un vaste corpus, les odu, divisées en versets que le babalawo récite et interprète. On le consulte avant toute décision importante, personnelle ou collective. Le mot Ifá désigne aussi Orunmila, divinité de la sagesse. L'UNESCO s'inquiète de la transmission : beaucoup de prêtres sont âgés et les jeunes s'en détournent.",
   "Plus à l'ouest, dans l'ancien royaume du Dahomey, l'actuel Bénin, le mot vodun signifie « esprit » ou « divinité » en langue fon. Le vodun s'y vit au quotidien, aux côtés du christianisme et de l'islam, avec sa propre science divinatoire, le Fâ. Ces religions donnent une grande place aux ancêtres et aux forces de la nature, et donc aux lieux sacrés. Au Nigeria, la forêt sacrée d'Osun-Osogbo, inscrite au patrimoine mondial en 2005, est l'un des derniers vestiges de forêt primaire du sud du pays. Une artiste autrichienne, Suzanne Wenger, intégrée à la communauté yoruba, a contribué avec un mouvement d'artistes à faire revivre ce sanctuaire, où une grande fête annuelle dure douze jours.",
   "Avec la traite atlantique, des Africains réduits en esclavage ont emporté leurs croyances vers les Amériques, où elles se sont recomposées. Au Brésil, le candomblé domine à Bahia ; sa branche nagô, issue de la religion des Yoruba réduits en esclavage, influence les autres. À Cuba, des Yoruba déportés en grand nombre au début du XIXe siècle ont transmis la religion des orisha, appelée santería ou religion lucumí ; on y consulte notamment l'oracle d'Ifá, interprété par un babalawo. En Haïti, le vodou mêle les héritages fon, kongo et yoruba au catholicisme : les esprits, les lwa, sont fêtés aux jours des saints, comme Ogou le 25 juillet, jour de la Saint-Jacques.",
   "Ces traditions ont longtemps été discriminées sous la colonisation et caricaturées par le cinéma : sorcellerie, poupées ensorcelées, zombies. Elles sont aujourd'hui mieux reconnues. Aux États-Unis, la Cour suprême a garanti à l'unanimité en 1993 le droit des fidèles de la santería à pratiquer le sacrifice d'animaux. En Afrique, une enquête du Pew Research Center menée en 2010 dans 19 pays montrait que de nombreux chrétiens et musulmans consultent aussi des guérisseurs traditionnels ou croient au pouvoir protecteur des amulettes. Le vodou haïtien, enfin, n'a ni chef ni hiérarchie centrale : il se transmet dans les familles et dans des communautés guidées par des prêtresses (manbo) et des prêtres (oungan)."
  ],

  "title": "Sila et l'Inuit Qaujimajatuqangit : ce que les Inuit savent depuis toujours",
  "excerpt": "Dans l'Arctique canadien, un même mot désigne le ciel, le climat et la sagesse. Et huit valeurs inuit guident aujourd'hui le gouvernement du Nunavut.",
  "tag": "Informer",
  "repere": "Arctique canadien · tradition ancienne, Nunavut depuis 1999",
  "body": [
   "Les Inuit vivent dans l'Arctique, du Groenland à l'Alaska en passant par le nord du Canada. Leur savoir est né d'une relation très fine avec un environnement extrême : glace, neige, mer, animaux, lumière changeante. En inuktitut, le mot sila désigne à la fois l'air, le temps qu'il fait, l'univers qui nous entoure et une forme d'intelligence ou de sagesse. Être en accord avec sila, c'est comprendre le monde et agir avec justesse.",
   "En 1999, le territoire du Nunavut est créé au Canada, avec une population majoritairement inuit. Son gouvernement s'est engagé à intégrer l'Inuit Qaujimajatuqangit, souvent abrégé IQ, dans ses lois et ses politiques. L'expression se traduit par « ce que les Inuit savent depuis longtemps » : un ensemble de connaissances, de valeurs et de manières de faire transmises par les aînés.",
   "Le gouvernement du Nunavut a formulé huit valeurs directrices. On y trouve le respect des autres et le souci de leur bien-être, l'accueil et l'inclusion, le service à la famille et à la communauté, la décision prise par la discussion et le consensus, l'apprentissage par l'observation et la pratique, le travail en commun vers un but partagé, l'ingéniosité face aux problèmes, et le respect de la terre, des animaux et de l'environnement. La loi sur l'éducation du Nunavut s'y réfère directement.",
   "Ces valeurs ne sont pas une simple liste. Les chercheurs Frank Tester et Peter Irniq, lui-même inuk, rappellent que l'IQ est un savoir vivant, lié à la terre et à l'expérience, et qu'il porte une histoire de résistance face à la colonisation, aux déplacements forcés et aux pensionnats. Les mettre par écrit pour une administration pose question : comment garder vivante une sagesse qui s'apprend d'abord sur la glace, aux côtés des aînés ?",
   "Pour le reste du monde, la pensée inuit offre une leçon précieuse au moment où l'Arctique se réchauffe plus vite que la planète : observer patiemment, décider ensemble et respecter ce qui nous fait vivre."
  ],
  "cles": [
   "Sila désigne à la fois l'air, le climat, l'univers et une forme de sagesse.",
   "L'Inuit Qaujimajatuqangit rassemble des savoirs et des valeurs transmis par les aînés.",
   "Le Nunavut, créé en 1999, s'est engagé à intégrer huit valeurs inuit dans ses politiques.",

  "pratique": [

  "salon": "Spiritualités & religions du monde",
  "title": "Héhaka Sápa (Black Elk) : la vision d'un sage lakota",
  "excerpt": "Témoin de Little Bighorn et de Wounded Knee, guérisseur puis catéchiste catholique, Black Elk a confié sa grande vision à un poète. Ce que dit le livre, et ce qu'il a changé.",
  "tag": "Informer",
  "repere": "Grandes Plaines, Lakota oglala · 1863-1950",
  "body": [
   "Héhaka Sápa, Black Elk en anglais, naît vers 1863 chez les Lakota oglala, dans les Grandes Plaines d'Amérique du Nord. Adolescent, il est témoin de la bataille de Little Bighorn, en 1876. Vers neuf ans, lors d'une maladie, il reçoit une grande vision : les puissances des quatre directions, du ciel et de la terre lui montrent l'unité de toute vie et lui confient la mission d'aider son peuple.",
   "Sa vie traverse l'effondrement du monde lakota : réserves, disparition des bisons, voyage en Europe avec le spectacle de Buffalo Bill à la fin des années 1880, massacre de Wounded Knee en 1890. Au début du XXe siècle, il se convertit au catholicisme et devient catéchiste, sous le nom de Nicholas Black Elk, sans renoncer à sa compréhension lakota du sacré. Il meurt en 1950 à Pine Ridge.",
   "En 1931, le poète John G. Neihardt recueille son récit, traduit par son fils Ben Black Elk. Le livre Black Elk Speaks paraît en 1932 et devient, dans les années 1960 et 1970, un classique de la spiritualité amérindienne. En 1984, l'anthropologue Raymond DeMallie publie les transcriptions des entretiens : on y voit que Neihardt a beaucoup réécrit, ajouté des passages et laissé de côté la vie catholique de Black Elk.",
   "Les historiens débattent depuis de la manière de concilier ces deux fidélités. Pour certains, comme Clyde Holler, Black Elk a vécu son catholicisme et sa tradition lakota comme deux langages du même sacré. Ce débat n'enlève rien à la force de la vision, mais il invite à lire le livre comme une œuvre à deux voix.",
   "L'Église catholique a ouvert une cause en béatification pour Nicholas Black Elk, tandis que de nombreux Lakota le revendiquent comme un sage de leur tradition. En 2016, le plus haut sommet des Black Hills a été rebaptisé Black Elk Peak en son honneur."

  "salon": "Spiritualités & religions du monde",
  "title": "Le chamanisme sibérien : un mot toungouse, des pratiques bien vivantes",
  "excerpt": "Le mot « chaman » vient des langues de Sibérie. Au Touva comme ailleurs, ces pratiques ont survécu à la répression soviétique et renaissent, entre tradition et réinvention.",
  "tag": "Informer",
  "repere": "Sibérie, Touva · tradition ancienne, renouveau depuis les années 1990",
  "body": [
   "Le mot « chaman » vient de l'évenki, une langue toungouse de Sibérie orientale. Il est entré dans la langue russe au XVIIe siècle, au contact des peuples sibériens, puis dans les langues européennes grâce aux récits de voyageurs. L'historien Andrei Znamenski a montré comment ces premiers témoignages russes, souvent hostiles, ont façonné l'image du chaman en Europe.",
   "En Sibérie, le chaman est un spécialiste qui fait le lien entre la communauté humaine et les esprits : esprits de la nature, des lieux, des animaux et des ancêtres. Il soigne, devine, accompagne les âmes des morts, protège la chasse ou le troupeau. Son tambour, appelé düngür au Touva, et son costume chargé de symboles l'aident à entrer en transe. Les pratiques varient beaucoup d'un peuple à l'autre : Évenks, Iakoutes, Bouriates ou Touvas ne forment pas une religion unique.",
   "Sous l'Union soviétique, les chamans sont persécutés, surtout à partir des années 1930 : tambours confisqués, arrestations, interdits. Les savoirs se transmettent alors en secret, dans les familles. Après 1991, le chamanisme renaît au grand jour. Au Touva, l'ethnographe et écrivain Mongouch Kenin-Lopsan, lui-même issu d'une famille de chamans, fonde en 1993 une association de chamans, Düngür.",
   "Le mot « chamanisme » a aussi voyagé. L'historien des religions Mircea Eliade en a fait, en 1951, une catégorie universelle, centrée sur les « techniques archaïques de l'extase ». Beaucoup d'anthropologues critiquent aujourd'hui cette généralisation, et regardent avec prudence le « néo-chamanisme » des stages et du tourisme spirituel, souvent très éloigné des pratiques sibériennes.",
   "Le chamanisme sibérien est donc à la fois très ancien et très contemporain. Il coexiste au Touva avec le bouddhisme, s'adapte à la ville et continue de dire une chose simple : le monde est peuplé de présences avec lesquelles il faut entretenir de bonnes relations."
  ],

 {
  "salon": "Spiritualités & religions du monde",
  "title": "Tengri, le Ciel éternel des peuples des steppes",
  "excerpt": "Des inscriptions de l'Orkhon aux lettres des khans mongols, le Ciel bleu éternel guide les Turcs et les Mongols. Une spiritualité ancienne, aujourd'hui revendiquée et réinventée.",
  "tag": "Informer",
  "repere": "Mongolie et Asie centrale · VIIIe siècle à nos jours",
  "body": [
   "Chez les anciens peuples turcs et mongols, Tengri désigne à la fois le ciel et la puissance divine qui l'habite. Les plus anciens textes qui en parlent sont les inscriptions de l'Orkhon, gravées au VIIIe siècle en écriture runique turque sur des stèles dressées en Mongolie, en l'honneur des souverains Kül Tegin et Bilge Khagan. Le Ciel y donne aux khans leur légitimité et punit ceux qui trahissent. La vallée de l'Orkhon est inscrite au patrimoine mondial de l'UNESCO.",
   "À l'époque de l'empire mongol, au XIIIe siècle, Gengis Khan et ses successeurs invoquent le « Ciel bleu éternel ». Leurs lettres aux souverains étrangers, y compris au pape, s'ouvrent par la force de ce Ciel. Face au Ciel-Père se tient la Terre-Mère, et les hommes vivent entre les deux.",
   "Le culte de Tengri n'était pas une religion organisée, avec un livre et un clergé. Il se mêlait au chamanisme, au culte des ancêtres et des esprits des montagnes, honorés sur les ovoo, ces cairns de pierres où l'on fait des offrandes. L'empire mongol accueillait aussi bouddhistes, musulmans et chrétiens, avec une tolérance religieuse remarquable pour l'époque.",
   "Depuis les années 1990, après la fin de l'Union soviétique, un mouvement appelé tengrisme apparaît au Kazakhstan, au Kirghizistan, en Bouriatie, au Tatarstan et en Mongolie. Des intellectuels et des militants le présentent comme la religion d'origine des peuples turcs et mongols. La politologue Marlène Laruelle y voit en partie une « invention de la tradition », liée à la construction d'identités nationales.",
   "Entre héritage authentique et réinvention, Tengri continue d'exprimer une intuition simple et forte : le ciel immense des steppes est une présence, devant laquelle l'être humain se sent à la fois petit et relié."
  ],

 {
  "salon": "Textes sacrés & sagesses",
  "title": "L'Épopée de Gilgamesh : l'amitié, la mort et la sagesse d'un roi d'Uruk",
  "excerpt": "Un roi tout-puissant perd son ami et part chercher l'immortalité. Le plus ancien grand récit connu parle déjà de deuil, d'amitié et de ce qu'il reste quand on doit mourir.",
  "tag": "Informer",
  "repere": "Mésopotamie (Irak) · vers 2000-1100 av. J.-C.",
  "body": [
   "Gilgamesh a probablement été un roi d'Uruk, une cité du sud de la Mésopotamie, dans l'actuel Irak, au cours de la première moitié du IIIe millénaire avant notre ère. Aucune source historique ne confirme pourtant ses exploits. Autour de son nom sont nés des récits écrits en cunéiforme, une écriture faite de petits coins imprimés dans l'argile. Des poèmes en sumérien, la plus ancienne langue écrite de la région, nous sont parvenus sur des tablettes de la première moitié du IIe millénaire. À cette époque dite paléo-babylonienne, celle du roi Hammurabi, une première épopée est composée en akkadien, la langue sémitique de Babylone. On la présente souvent comme le plus ancien grand récit littéraire conservé.",
   "La version la plus complète, dite « standard », s'étend sur douze tablettes. On l'attribue à un lettré, Sîn-lēqi-unninni, qui l'aurait remaniée au XIe siècle avant notre ère. Ses meilleures copies proviennent de la bibliothèque du roi assyrien Assurbanipal à Ninive (VIIe siècle avant notre ère), mise au jour au milieu du XIXe siècle. Le 3 décembre 1872, l'assyriologue George Smith présenta à Londres sa traduction d'un fragment de la onzième tablette : il racontait un déluge étonnamment proche de celui de la Genèse, et ce fut une sensation. Depuis, de nouveaux fragments, retrouvés dans toute la Mésopotamie et jusqu'en Anatolie, comblent peu à peu les lacunes du texte.",
   "Le récit s'ouvre sur un roi trop dur envers son peuple. Pour le contenir, le dieu Anu fait naître Enkidu, un homme sauvage qui vit parmi les bêtes. Après une lutte, les deux hommes deviennent des amis inséparables. Ensemble, ils partent affronter Humbaba, gardien d'une lointaine forêt de cèdres, puis tuent le Taureau céleste envoyé par la déesse Ishtar, dont Gilgamesh a repoussé les avances. Les dieux décident alors qu'Enkidu doit mourir. Bouleversé, Gilgamesh part au bout du monde interroger Uta-napishti, le survivant du Déluge, pour apprendre à échapper à la mort. Il obtient une plante qui rend la jeunesse, mais un serpent la lui vole. Il rentre à Uruk, toujours mortel.",
   "Le cœur du poème est une méditation sur la mortalité. C'est la mort de son ami qui fait découvrir à Gilgamesh la peur de mourir : le deuil lui révèle sa propre condition. Le texte rappelle que les dieux ont établi la mort et la vie, sans révéler à personne le jour de sa mort. Le héros échoue à devenir immortel, mais il revient transformé. Le prologue le présente comme celui qui « a vu l'Abîme », qui a parcouru une route lointaine, épuisé puis apaisé, et dont toutes les peines ont été gravées sur une stèle. La sagesse naît ici de l'expérience, de l'amitié perdue et de l'acceptation des limites humaines.",
   "On peut lire l'épopée comme un récit de deuil universel, sans rien connaître de la Mésopotamie. Il faut seulement accepter un texte troué : les tablettes sont cassées, et les traducteurs signalent les passages perdus ou restitués. En français, la traduction de Jean Bottéro, L'Épopée de Gilgameš. Le grand homme qui ne voulait pas mourir (Gallimard, 1992), reste une référence claire et abondamment commentée. Pour aller plus loin, l'édition savante de l'assyriologue Andrew George est consultable gratuitement en ligne, en anglais, sur le site de l'Electronic Babylonian Library de l'université de Munich, avec le texte akkadien et sa traduction ligne à ligne."
  ],
  "cles": [
   "Le texte n'a pas d'auteur unique : il a mûri pendant plus d'un millénaire, des poèmes sumériens à la version standard en douze tablettes.",
   "L'amitié entre Gilgamesh et Enkidu est le moteur du récit, et la mort d'Enkidu en est le tournant.",
   "Le récit du Déluge de la tablette XI, révélé en 1872, montre les liens entre les traditions mésopotamiennes et la Bible.",
   "La quête d'immortalité échoue, mais le héros revient plus sage, réconcilié avec sa condition humaine."

  "pratique": [
   "Lisez d'abord les tablettes I et II, puis VII et VIII : la rencontre des deux amis, puis la mort d'Enkidu et le chant de deuil de Gilgamesh.",
   "Notez dans un carnet ce que Gilgamesh cherche à chaque étape de son voyage, puis ce qu'il trouve réellement.",
   "Comparez le récit du Déluge de la tablette XI avec celui de la Genèse (chapitres 6 à 9) : relevez trois ressemblances et trois différences.",

 {
  "salon": "Textes sacrés & sagesses",
  "title": "Le Livre des morts des anciens Égyptiens : la pesée du cœur et la Maât",
  "excerpt": "Des formules pour « sortir au jour » après la mort, un cœur posé face à une plume : comment les Égyptiens imaginaient le jugement des morts et la justice, la Maât.",
  "tag": "Informer",
  "repere": "Égypte ancienne · de 1650 av. J.-C. à l'époque romaine",
  "body": [
   "Le « Livre des morts » n'est pas un livre unique. C'est le nom moderne, donné par l'égyptologue allemand Karl Richard Lepsius, qui en publia un premier recueil en 1842, d'un ensemble d'environ 175 à 200 formules selon les décomptes, que les Égyptiens appelaient les « chapitres pour sortir au jour ». Chaque exemplaire est une sélection, copiée pour un défunt précis, et aucun ne contient toutes les formules. Ces textes devaient protéger le mort et l'aider à franchir les dangers de l'au-delà pour renaître à la lumière. On les déposait dans la tombe, le plus souvent sous la forme d'un rouleau de papyrus illustré de scènes peintes.",
   "Ces formules ont une longue histoire. Beaucoup prolongent les Textes des sarcophages du Moyen Empire (vers 2000 av. J.-C.), eux-mêmes héritiers des Textes des pyramides (vers 2400 av. J.-C.). Le recueil apparaît d'abord sur des cercueils et des linceuls de la famille royale de la XVIIe dynastie, vers 1650-1550 av. J.-C. À partir du règne d'Hatchepsout, vers 1450 av. J.-C., il est copié sur papyrus pour de nombreuses tombes de l'élite, et cela jusqu'à l'époque romaine. Sous la XXVIe dynastie (664-525 av. J.-C.), l'ordre des chapitres est standardisé. La plupart des grands papyrus conservés viennent de Thèbes, l'actuelle Louxor.",
   "La scène la plus célèbre accompagne le chapitre 125. Sur le papyrus de Hounefer, scribe royal sous le pharaon Séthi Ier, conservé au British Museum, Anubis, le dieu à tête de chacal, conduit le défunt vers une balance. Sur un plateau repose son cœur, que les Égyptiens tenaient pour le siège de la pensée et de la mémoire ; sur l'autre, la plume, hiéroglyphe de la Maât. Thot, dieu à tête d'ibis, note le résultat. Sous la balance attend Ammit, la « Dévoreuse », mi-crocodile, mi-lion, mi-hippopotame. Si l'épreuve est réussie, Horus mène le défunt devant Osiris, souverain des morts.",
   "La Maât désigne à la fois une déesse et un principe : la vérité, la justice et l'ordre du monde établi à la création, opposé à l'isfet, le désordre. Au chapitre 125, le défunt s'adresse au dieu juge et à quarante-deux assesseurs. Il énumère les fautes qu'il n'a pas commises : il n'a ni volé, ni menti, ni tué, ni affamé, ni fait pleurer ; il n'a pas truqué la balance, ni retenu l'eau en sa saison, ni pris le lait de la bouche des enfants. Les égyptologues parlent de « confession négative ». Cette liste dessine en creux une morale sociale très concrète, attentive aux plus faibles et au partage des ressources.",
   "Ces textes relèvent d'une religion qui n'est plus pratiquée, mais ils restent émouvants : ils montrent des femmes et des hommes qui espéraient être jugés sur leur conduite. Il faut les lire comme des formules rituelles, souvent répétitives, plutôt que comme un traité de morale. Une hypothèse savante rattache même la liste des fautes niées à un serment de pureté prêté avant d'entrer au service d'un temple. En français, la traduction de référence reste celle de Paul Barguet, Le Livre des morts des anciens Égyptiens (Cerf, 1967, plusieurs fois rééditée). La BnF et le British Museum présentent en ligne de magnifiques papyrus."

  "excerpt": "Au bord d'une bataille, un guerrier refuse de combattre. Son cocher, Krishna, lui répond : agir sans s'attacher aux fruits de l'acte. Un texte majeur de la pensée indienne.",
  "tag": "Informer",
  "repere": "Inde ancienne · entre le IIIe s. av. et le IIIe s. apr. J.-C.",
  "body": [
   "La Bhagavad-Gîtâ, le « Chant du Bienheureux », est un épisode du Mahâbhârata, l'immense épopée sanskrite de l'Inde ancienne, qui compte près de 100 000 strophes. Elle occupe les chapitres 23 à 40 du sixième livre de l'épopée. Ce poème d'environ 700 vers, répartis en 18 chants, se présente comme un dialogue entre le prince Arjuna et Krishna, que ses fidèles considèrent comme un avatar, c'est-à-dire une incarnation, du dieu Vishnou. La tradition attribue l'épopée au sage Vyâsa, mais les historiens y voient l'œuvre de nombreuses mains. La Gîtâ est devenue l'un des textes les plus lus, récités et commentés de l'hindouisme.",
   "Sa date reste débattue. L'indianiste Anne-Marie Esnoul la situait entre le IIIe siècle avant et le IIIe siècle après notre ère, avec un noyau probablement composé dans les premiers siècles avant notre ère ; l'Encyclopædia Britannica propose plutôt le Ier ou le IIe siècle de notre ère. Esnoul la décrivait comme l'un des longs passages spéculatifs insérés dans l'épopée, qui se lit aussi comme une œuvre autonome. Le dialogue reprend des idées des Upanishads, des textes philosophiques plus anciens, et du Sâmkhya, une école qui distingue l'âme et la matière. On ignore où, précisément, elle a été composée.",
   "Tout commence sur le champ de bataille de Kurukshetra, au nord de l'actuelle Delhi. Deux branches d'une même famille, les Pândava et les Kaurava, vont s'affronter pour le trône. Arjuna, guerrier pândava, voit dans le camp adverse des cousins, des amis, des maîtres. Il pose son arc et refuse de tuer. Krishna, qui conduit son char, lui répond au fil des chants. L'âme, explique-t-il, ne meurt pas avec le corps. Arjuna doit accomplir son devoir de guerrier, son dharma, c'est-à-dire l'ordre moral propre à sa condition. Au onzième chant, Krishna révèle sa forme cosmique, terrifiante, qui engloutit tous les êtres, avant de redevenir l'ami familier d'Arjuna. Puis la bataille a lieu.",
   "L'idée la plus célèbre est celle de l'action sans désir, le niṣkāma karma. On ne renonce pas à agir, on renonce au désir des fruits de l'action : réussite, gloire ou profit. Le texte propose plusieurs chemins qui se complètent : l'action désintéressée (karma-yoga), la connaissance (jñāna) et la dévotion aimante envers Dieu (bhakti), que la Gîtâ met particulièrement en valeur. Les grands philosophes du Vedânta, Shankara, Râmânuja et Madhva, l'ont commentée chacun selon sa propre philosophie. Au XXe siècle, Gandhi, qui en écrivit lui aussi un commentaire, y voyait d'abord un enseignement sur l'action accomplie sans désir.",
   "Pour un lecteur d'aujourd'hui, le cadre guerrier peut dérouter. Beaucoup de lecteurs, en Inde comme ailleurs, y lisent une image du combat intérieur que chacun doit mener ; d'autres rappellent que le texte parle aussi, littéralement, du devoir social d'un guerrier. Les deux lectures coexistent. Le poème a fasciné l'Occident dès le XIXe siècle, notamment les penseurs américains Emerson et Thoreau. En français, la traduction de Marc Ballanfat (Flammarion, 2007) offre une présentation et des notes claires. Celle d'Émile Senart, révisée par Michel Hulin (Points, 2010), est suivie d'extraits du commentaire de Shankara."
  ],

  "title": "Le Dhammapada : les versets du Bouddha sur l'esprit",
  "excerpt": "423 strophes courtes, faciles à retenir, qui placent l'esprit au point de départ de tout. Le Dhammapada est l'un des textes bouddhistes les plus lus au monde.",
  "tag": "Informer",
  "repere": "Inde et Sri Lanka · transmis oralement, écrit au Ier s. av. J.-C.",
  "body": [
   "Le Dhammapada, que l'on peut traduire par « Paroles du Dhamma », c'est-à-dire de l'enseignement du Bouddha, est sans doute le livre le plus connu du canon pâli. Ce canon rassemble les écritures du bouddhisme Theravâda, la « Voie des Anciens », aujourd'hui majoritaire au Sri Lanka et dans une grande partie de l'Asie du Sud-Est. Le recueil compte 423 strophes réparties en 26 chapitres. Il se trouve dans la « Petite collection » (Khuddaka Nikāya) de la « Corbeille des discours ». Ses vers sont brefs et rythmés, faits pour être appris par cœur et récités. Le pâli, sa langue, est une langue indienne ancienne proche du sanskrit.",
   "Les strophes sont attribuées au Bouddha, qui vécut dans le nord-est de l'Inde entre le VIe et le IVe siècle avant notre ère ; ses dates exactes restent discutées. Ses paroles ont d'abord circulé oralement, et le canon pâli fut mis par écrit au Sri Lanka, probablement au Ier siècle avant notre ère. Plus de la moitié des strophes se retrouvent ailleurs dans le canon, et d'autres puisent dans un fonds de maximes commun à l'Inde ancienne. Des versions parallèles existent en prâkrit, une langue populaire de l'Inde ancienne, en sanskrit et en chinois. L'une d'elles, écrite en kharoṣṭhī, une écriture du nord-ouest de l'Inde, fut publiée dès 1898 à Paris par Émile Senart.",
   "Chaque chapitre porte sur un thème : les paires, la vigilance, l'esprit, les fleurs, le sot, le sage, la colère, le bonheur, la voie. Le premier chapitre oppose deux à deux les attitudes : une pensée corrompue entraîne la souffrance comme la roue suit le pas du bœuf ; une pensée pure entraîne le bonheur comme une ombre qui ne vous quitte pas. Le troisième chapitre est consacré à l'esprit (citta) : il frémit, difficile à garder et à contenir, mais le sage le redresse comme l'artisan redresse une flèche. Un commentaire ancien, attribué par la tradition au moine Buddhaghosa, rattache chaque strophe à une histoire racontant dans quelles circonstances le Bouddha l'aurait prononcée.",
   "L'idée centrale est que l'esprit précède tout : nos paroles et nos actes naissent d'une intention, et c'est elle qui en détermine les fruits. La haine ne s'apaise jamais par la haine, dit la cinquième strophe, mais par la non-haine, que certains traducteurs rendent par « amour » : c'est là une loi éternelle. Le texte invite à la vigilance, à la maîtrise de soi et à la bienveillance, plus qu'à l'adhésion à des croyances. Les traducteurs débattent du sens exact des premiers mots : dhammā désigne-t-il les « phénomènes », les « états mentaux » ou les « choses » ? Et mano, l'« esprit » ou l'« intention » ? Chaque choix éclaire autrement le texte.",
   "Le Dhammapada se prête à une lecture lente, une strophe par jour. Il faut garder en tête que certains chapitres s'adressent d'abord aux moines, et que certaines images, comme celle du brahmane idéal, viennent du monde indien ancien. Sa force tient à sa simplicité : il parle d'expérience quotidienne, de colère, de paresse, de joie. En français, Les Dits du Bouddha. Le Dhammapada, traduit du pâli et commenté par le Centre d'études dharmiques de Gretz (Albin Michel, 1993, nouvelle édition en 2004), est accessible et bien annoté. Le site SuttaCentral propose gratuitement le texte pâli, accompagné de traductions anglaises."
  ],

   "La haine ne cesse pas par la haine : la paix commence par une transformation intérieure.",

  "salon": "Textes sacrés & sagesses",
  "title": "Le Tao Te King : le non-agir, l'eau et l'énigme de Laozi",
  "excerpt": "Cinq mille caractères, une voie insaisissable, un auteur peut-être légendaire. Comment les manuscrits de Mawangdui et de Guodian ont changé notre lecture du Tao Te King.",
  "tag": "Éduquer",
  "repere": "Chine (royaume de Chu) · avant 300 av. J.-C.",
  "body": [
   "Le Tao Te King, ou Daodejing en transcription moderne, signifie « Classique de la Voie et de la Vertu ». Le dao est la « voie » : à la fois chemin, méthode et principe insaisissable d'où naissent toutes choses. Le de est la « vertu », au sens d'efficacité, de rayonnement de celui qui suit la voie. Le texte compte environ cinq mille caractères chinois, répartis dans la version reçue en deux parties et 81 courts chapitres. Il fut d'abord appelé simplement Laozi, du nom de son auteur supposé ; le titre Daodejing ne s'impose que vers la fin de la dynastie Han, qui régna de 206 av. J.-C. à 220 apr. J.-C.",
   "Qui était Laozi ? Vers 100 avant notre ère, l'historien Sima Qian en donne la première biographie connue. Il le présente comme Li Er, originaire du royaume de Chu, archiviste à la cour des Zhou, que Confucius serait venu consulter. Au moment de quitter la Chine, il aurait écrit son livre à la demande du gardien d'une passe. Mais Sima Qian rapporte aussi d'autres identifications possibles. Le nom Laozi signifie probablement « Vieux Maître ». Peu de spécialistes, hors de Chine, acceptent ce récit tel quel, et les avis divergent : pour le sinologue Alan Chan, le livre est plutôt une anthologie, née de recueils de sentences mis par écrit à partir du Ve siècle et unifiés au IVe siècle avant notre ère.",
   "L'archéologie a renouvelé la question. En 1973, à Mawangdui, près de Changsha, une tombe scellée en 168 avant notre ère a livré deux copies sur soie. Elles contiennent tous les chapitres connus, dans un ordre un peu différent, et la partie sur la vertu y précède celle sur la voie. En 1993, une tombe de Guodian, dans le Hubei, datée d'environ 300 avant notre ère, a révélé des lattes de bambou portant environ 2 000 caractères correspondant au Laozi, soit à peu près deux cinquièmes du texte. Ce sont les plus anciennes versions connues. Elles ne suivent ni l'ordre actuel ni la division en deux parties.",
   "Ces découvertes nourrissent deux débats. Le premier porte sur la date : faute d'indices internes, les estimations allaient du VIIIe au IIIe siècle avant notre ère. Guodian prouve qu'une partie du texte circulait vers 300 avant notre ère, sans dire si le livre complet existait déjà. Le second porte sur le sens. Là où le chapitre 19 de la version reçue dit « Rejetez la bienveillance, abandonnez la justice », visant les vertus prônées par les confucéens, Guodian dit « Rejetez l'artifice, abandonnez la tromperie ». Le texte serait-il devenu plus polémique au fil des copies ? Les chercheurs restent prudents, car d'autres lattes de Guodian critiquent aussi ces vertus.",
   "Que dit le texte ? Il oppose à l'agitation des puissants le wuwei, le « non-agir ». Ce n'est pas la passivité, mais une action sans forçage ni désir égoïste, qui laisse les choses suivre leur cours naturel. L'image favorite est l'eau : souple et humble, elle se loge dans les lieux que les hommes dédaignent, et pourtant rien ne résiste à sa force. Le sage cultive la simplicité, comparée au bois brut, et se méfie des belles paroles. Le texte s'adresse aussi aux gouvernants : le meilleur souverain est celui dont le peuple sait à peine qu'il existe. Dans le taoïsme religieux, Laozi est vénéré comme la personnification du dao lui-même.",
   "Comment le lire aujourd'hui ? Lentement, chapitre par chapitre, en acceptant l'ambiguïté : le chinois classique est très elliptique, et deux traductions peuvent diverger fortement. Il est utile d'en comparer plusieurs. En français, Rémi Mathieu a publié Le Daode jing. Classique de la voie et de son efficience (Entrelacs, 2008), qui traduit séparément le texte reçu de Wang Bi (IIIe siècle), les manuscrits de Mawangdui et les lattes de Guodian : on mesure ainsi concrètement ce que l'archéologie change. La traduction de Liou Kia-hway (Gallimard, 1967, souvent rééditée) reste un bon point de départ, simple et poétique."

  "excerpt": "De courts dialogues entre un maître et ses disciples, compilés après sa mort. Les Entretiens ont façonné l'éducation et la morale de l'Asie orientale pendant deux mille ans.",
  "tag": "Informer",
  "repere": "Chine (pays de Lu) · Ve-IIe s. av. J.-C.",
  "body": [
   "Les Entretiens, en chinois Lunyu, rassemblent de courtes paroles de Confucius et de brefs échanges avec ses disciples. Confucius, Kongzi ou « Maître Kong » en chinois, serait né en 551 et mort en 479 avant notre ère, dans le pays de Lu ou à sa lisière, dans l'actuelle province du Shandong. Issu d'une famille noble mais appauvrie, il devint célèbre pour sa connaissance des rites de la dynastie Zhou et forma de nombreux disciples. Le livre compte vingt chapitres, sans plan d'ensemble apparent : on y passe d'une maxime à une anecdote, d'une question politique à une remarque sur la musique ou sur l'amitié.",
   "Comment le texte s'est-il formé ? Selon l'historien Ban Gu (39-92), les Entretiens auraient été compilés par les disciples de Confucius, puis par les disciples de ceux-ci, avant d'être transmis discrètement. Depuis un article influent de Zhu Weizheng en 1986, plusieurs historiens doutent de cette ancienneté, car on ne trouve guère de citations explicites du livre avant le IIe siècle avant notre ère. L'archéologie apporte de nouvelles pièces : une version sur lattes de bambou retrouvée à Dingzhou, dans le Hebei, date de 55 avant notre ère, et la tombe du marquis de Haihun (59 avant notre ère) contiendrait deux chapitres perdus d'une ancienne version en 22 chapitres.",
   "Au centre du livre se trouve le junzi, l'« homme de bien », un idéal fondé sur la conduite plus que sur la naissance. Cinq qualités le définissent : le ren, la justice (yi), les rites (li), la sagesse (zhi) et la fiabilité (xin). Le ren, souvent traduit par « bienveillance » ou « humanité », est la plus large. Quand un disciple lui demande ce qu'il est, Confucius répond simplement : « Aimer les autres » (XII, 22). L'étude est l'autre pilier : « Étudier sans réfléchir mène à la confusion, réfléchir sans étudier est périlleux » (II, 15). Le Maître se dit lui-même « transmetteur et non créateur » (VII, 1).",
   "Le passage XIII, 3 a donné son nom à une idée célèbre, la « rectification des noms » (zhengming). Un disciple demande à Confucius par quoi il commencerait s'il devait gouverner. Réponse : rendre correctes les dénominations. Si les noms ne sont pas justes, le langage ne s'accorde plus au réel, les affaires échouent, les rites et la musique déclinent, les châtiments frappent à faux, et le peuple ne sait plus où poser pied ni main. Un autre passage (XII, 11) le dit en quelques mots : que le prince soit prince, le ministre ministre, le père père et le fils fils. L'ordre politique commence par la vérité du langage.",
   "Sous les Han, Confucius devient une autorité officielle. Au XIIe siècle, le lettré Zhu Xi place les Entretiens au cœur du programme des « Quatre Livres », qui marquera durablement la Chine, la Corée et le Japon. Au XVIIIe siècle, les récits des jésuites le font connaître en Europe comme le premier philosophe chinois. On peut lire aujourd'hui le livre comme une conversation morale ouverte, en gardant en tête que son texte s'est fixé tardivement. En français, la traduction d'Anne Cheng (Seuil, 1981 ; Points, 2014) est précise et sobre, celle de Pierre Ryckmans, alias Simon Leys (Gallimard, 1987), très vivante. La version de Séraphin Couvreur (1895) est libre d'accès sur Wikisource."
  ],

  "excerpt": "« Vanité des vanités » d'un côté, le cri d'un juste qui souffre de l'autre : deux livres de la Bible hébraïque qui osent interroger le sens de la vie et la justice divine.",
  "tag": "Informer",
  "repere": "Judée · VIe-IIIe s. av. J.-C.",
  "body": [
   "Qohélet, appelé l'Ecclésiaste dans la tradition chrétienne, et le Livre de Job appartiennent aux Écrits (Ketouvim), la troisième partie de la Bible hébraïque, et à ce que les spécialistes nomment la littérature de sagesse. Ils sont lus et médités dans le judaïsme comme dans le christianisme. Qohélet fait partie des cinq rouleaux (Megillot) lus lors de fêtes de l'année juive. Ces deux livres partagent une audace rare : ils mettent en doute l'idée rassurante selon laquelle le juste serait toujours récompensé et le méchant toujours puni, ce que les théologiens appellent la doctrine de la rétribution.",
   "Le livre de Qohélet tire son nom de son narrateur. Le mot hébreu, que l'on rattache à l'assemblée (qahal), a été rendu en grec par Ekklesiastès. Le premier verset présente l'auteur comme « fils de David, roi de Jérusalem », ce qui désigne Salomon, au Xe siècle avant notre ère. Mais la langue du livre, riche en formes araméennes, et son esprit raisonneur conduisent les historiens à le dater de la seconde moitié du IIIe siècle avant notre ère. Son auteur réel reste inconnu. Le livre compte douze chapitres ; son épilogue parle de Qohélet à la troisième personne et conclut sur la crainte de Dieu.",
   "Le livre s'ouvre et se referme sur un refrain : « Vanité des vanités, tout est vanité ». Le mot hébreu hevel désigne d'abord la buée, le souffle, ce qui passe et ne se saisit pas ; le latin l'a rendu par vanitas. Qohélet a tout essayé, le plaisir, la richesse, la sagesse, et constate que tout est « poursuite du vent ». La course n'appartient pas aux plus rapides, ni le pain aux sages : le temps et le hasard les atteignent tous. Il en tire pourtant une leçon de vie : « Va, mange avec joie ton pain », profite des jours qui te sont donnés, car il y a un temps pour tout.",
   "Le Livre de Job affronte la souffrance injuste. Un long poème (chapitres 3 à 42,6) y est encadré par un récit en prose (chapitres 1-2 et 42,7-17). Job, homme riche et intègre, perd ses biens, ses enfants et sa santé, à la suite d'un défi lancé par « le satan », c'est-à-dire « l'adversaire » en hébreu, qui doute de sa fidélité. Trois amis viennent le consoler et lui expliquent qu'il a dû pécher. Job proteste de son innocence et en appelle à Dieu. Celui-ci lui répond du milieu de la tempête par des questions sur la création : « Où étais-tu quand je fondais la terre ? » À la fin, Dieu donne tort aux amis.",
   "Selon l'Encyclopædia Britannica, le cadre en prose, issu d'une légende ancienne née hors d'Israël, serait antérieur au VIe siècle avant notre ère, et la partie poétique daterait du VIe au IVe siècle ; les chapitres 28 et 32 à 37 seraient des ajouts. Le dialogue avec Dieu dénoue la tension sans résoudre le problème de la souffrance imméritée. Pour les croyants, Job et Qohélet sont des paroles inspirées qui accompagnent l'épreuve et le doute ; pour les historiens, des témoins d'un débat intellectuel du judaïsme ancien. En français, la Bible de Louis Segond (1910), libre de droits, se lit sur Wikisource ; la Traduction œcuménique de la Bible (TOB) offre des notes précieuses."

  "title": "Le Coran : une parole récitée, ses sourates et ses enseignements de sagesse",
  "excerpt": "114 sourates, une récitation au cœur de la prière, une mise par écrit précoce confirmée par les manuscrits : le livre saint de l'islam, entre foi et histoire.",
  "tag": "Informer",
  "repere": "Arabie occidentale (La Mecque, Médine) · 610-632",
  "body": [
   "Le Coran est l'écriture sacrée de l'islam. Selon la croyance musulmane, il a été révélé par l'ange Gabriel (Jibrîl) au prophète Muhammad, à La Mecque puis à Médine, dans l'ouest de l'Arabie, à partir de 610 environ et jusqu'à la mort du Prophète en 632. Pour les croyants, il est la parole même de Dieu, transmise en langue arabe, et non un livre composé par un homme. La tradition rapporte que les premiers versets révélés sont ceux qui ouvrent la sourate 96 : « Lis (ou récite), au nom de ton Seigneur qui a créé ». Le mot qur'ân vient d'ailleurs d'un verbe qui signifie à la fois « lire » et « réciter ».",
   "Le Coran est nettement plus court que la Bible. Il se divise en 114 sourates, sortes de chapitres, elles-mêmes formées de versets appelés âyât, un mot qui signifie aussi « signes ». Le décompte aujourd'hui dominant est de 6 236 versets, d'autres traditions anciennes comptant un peu différemment. À l'exception de la courte sourate d'ouverture, la Fâtiha, récitée lors de chacune des cinq prières quotidiennes, les sourates sont rangées à peu près par longueur décroissante. Toutes, sauf la neuvième, commencent par la formule « Au nom de Dieu, le Miséricordieux, le Compatissant ». La tradition distingue les sourates mecquoises et médinoises, ces dernières contenant davantage de prescriptions.",
   "D'après les sources islamiques, les révélations étaient conservées dans les mémoires et sur des supports variés : feuilles de palme, pierres, parchemins. Après la mort du Prophète, Zayd ibn Thâbit les aurait réunies sur des feuillets ; le troisième calife, 'Uthmân (644-656), aurait ensuite diffusé une version de référence vers 650. Cette standardisation portait sur le squelette consonantique, c'est-à-dire les lettres sans les voyelles, ce qui explique l'existence de plusieurs « lectures » reconnues, sept, dix ou quatorze selon les classements. Les datations au carbone 14 de manuscrits anciens concordent globalement avec ce récit : à Birmingham, deux feuillets ont été datés entre 568 et 645.",
   "Le Coran est d'abord une parole dite à voix haute. Sa récitation psalmodiée obéit à des règles précises de prononciation et de rythme, réunies sous le nom de tajwîd. De nombreux fidèles en apprennent le texte entier par cœur : chacun d'eux est appelé hâfiz, « celui qui garde » le texte en mémoire. Les versets accompagnent la prière, les fêtes, les deuils et la vie quotidienne. Pour la tradition musulmane, le Coran au sens plein est le texte arabe : une traduction est généralement considérée comme une interprétation de son sens. C'est pourquoi certaines éditions françaises se présentent comme un « essai de traduction », à l'image de celle de Jacques Berque.",
   "Parmi les grands thèmes du Coran figurent l'unicité de Dieu, le jugement dernier et la responsabilité personnelle : au jour du jugement, chaque âme répondra de ses propres actes. Le texte invite à méditer les « signes » de la nature, la pluie, les montagnes, l'alternance du jour et de la nuit, comme des marques de la bienveillance divine. Il insiste sur la protection des plus faibles, orphelins et pauvres, et sur la miséricorde et le pardon de Dieu. Les historiens étudient en parallèle son dialogue avec les traditions juives et chrétiennes de l'Antiquité tardive ; certains n'excluent pas un travail d'édition peu après la mort du Prophète, question encore ouverte.",
   "Le Coran ne se présente pas comme un récit continu : les sourates passent d'un thème à l'autre, et beaucoup de passages font allusion à des histoires que les premiers auditeurs connaissaient, d'Abraham à Moïse, de Marie à Jésus. On peut commencer par les sourates courtes de la fin du livre, parmi les plus anciennes selon la chronologie classique proposée par les historiens. Les musulmans s'appuient sur une longue tradition d'interprétation, le tafsîr. En français, on peut lire la traduction de Jacques Berque (Albin Michel, 1995) ou celle de Denise Masson (Gallimard) et, pour l'approche historique, Le Coran des historiens (Cerf, 2019)."

  "title": "Le Popol Vuh : le livre des Mayas k'iche' et le manuscrit qui l'a sauvé",
  "excerpt": "La création du monde, les jumeaux héroïques, les humains faits de maïs : le grand récit k'iche' nous est parvenu grâce à la copie d'un dominicain du XVIIIe siècle.",
  "tag": "Informer",
  "repere": "Hautes terres du Guatemala · 1554-1558, copie vers 1700-1715",
  "body": [
   "Le Popol Vuh est le grand récit sacré des Mayas k'iche', un peuple des hautes terres du Guatemala dont la langue, le k'iche', est toujours parlée. Son titre a été traduit de bien des manières : « Livre du Conseil », « Livre de la communauté », « Livre du peuple ». Le mot popol évoque aussi une natte tissée, et vuh (ou wuj) signifie « livre ». Le texte entremêle la création du monde, les aventures de héros divins et l'histoire des lignées royales k'iche' jusque vers 1550. Beaucoup de Mayas le considèrent aujourd'hui comme leur écriture sacrée, l'équivalent de ce qu'est la Bible pour les chrétiens, et le tiennent en profonde révérence.",
   "Le texte que nous lisons a été écrit en langue k'iche', avec l'alphabet latin, par un ou plusieurs auteurs mayas entre 1554 et 1558, quelques décennies après la conquête espagnole. Les auteurs expliquent eux-mêmes qu'ils écrivent parce que l'on ne peut plus voir l'ancien livre. Ce manuscrit du XVIe siècle est perdu. Nous le connaissons grâce à Francisco Ximénez (1666-1729), prêtre dominicain et linguiste, curé de Chichicastenango, qui l'a recopié entre 1700 et 1715 et traduit en espagnol, sur deux colonnes côte à côte. Sa copie, couverte de corrections, suggère que le texte était fait pour être dit à voix haute, peut-être par plusieurs récitants.",
   "Le manuscrit de Ximénez a ensuite beaucoup voyagé. Le prêtre français Charles-Étienne Brasseur de Bourbourg affirma l'avoir acheté en 1855 à Rabinal, au Guatemala, un point aujourd'hui discuté, avant de l'emporter en France. Il publia en 1861 la première traduction française, avec le texte k'iche'. Après sa mort en 1874, le manuscrit passa par un collectionneur puis par un libraire parisien, avant d'être acheté en 1887 par l'Américain Edward E. Ayer. Il est conservé depuis 1912 à la Newberry Library de Chicago, sous la cote Ayer MS 1515, et se consulte en version numérique. Sans cette chaîne fragile de copies et de transmissions, le texte aurait disparu.",
   "Au commencement, raconte le Popol Vuh, tout était immobile et silencieux : seuls existaient le ciel et la mer. Les dieux créateurs veulent des êtres capables de les nommer et de les honorer. Les animaux n'y parviennent pas : ils ne savent que crier. Un premier humain de terre se défait comme de la boue. Des hommes de bois parlent, mais n'ont ni sang ni humeurs et ne se souviennent pas de leurs créateurs ; un déluge les anéantit, et leurs descendants seraient les singes. Vient ensuite l'épopée des jumeaux Hunahpu et Xbalanque, qui défient au jeu de balle les seigneurs de Xibalba, le monde souterrain, et deviennent le Soleil et la Lune. Enfin, les humains véritables sont façonnés avec du maïs jaune et blanc.",
   "Le Popol Vuh se lit comme une cosmologie, mais aussi comme une réflexion sur ce qui fait l'humain : la parole, la mémoire, la gratitude envers ce qui nous fait vivre. Il faut le lire en sachant qu'il nous parvient à travers des filtres : écrit après la conquête, recopié et traduit par un missionnaire, puis retraduit dans de nombreuses langues. Les noms des dieux et les jeux de mots k'iche' résistent à la traduction. En français, la version d'Adrián Recinos traduite de l'espagnol par Valérie Faurie (Albin Michel, 1991) est accessible ; la traduction pionnière de Brasseur de Bourbourg (1861) a beaucoup vieilli. Le manuscrit original se feuillette en ligne sur le site de la Newberry Library."
  ],
