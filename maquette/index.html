<title>Guà Wàn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: app shell. Glass top bar, left rail of the three voies, 760px reading column, right "en ce moment" rail. The ensō (the human at the centre of their universe) is the recurring mark. */
:root{
  --bg:#F3EEE4;          /* washi */
  --surface:#FBF8F2;     /* kinari */
  --sunken:#ECE5D8;
  --fg:#1C1A17;          /* sumi */
  --muted:#6A645A;       /* usuzumi */
  --line:rgba(28,26,23,.12);
  --line-strong:rgba(28,26,23,.24);
  --accent:#B83E26;      /* shu */
  --accent-ink:#FBF8F2;
  --gold:#8A6A36;        /* kin */
  --c-esprit:#34507A;    /* ai */
  --c-creation:#A0651F;  /* kohaku */
  --c-corps:#B05F63;     /* sakura */
  --c-sex:#8E2C3A;       /* beni */
  --halo:transparent;
  --glow:0 0 0 transparent;
  --shadow:0 1px 2px rgba(28,26,23,.06),0 10px 28px -14px rgba(28,26,23,.22);
  --glass:rgba(251,248,242,.8);
  --scrim:rgba(28,26,23,.38);
  --screen:#0F0E0C;      /* écran vidéo, identique dans les deux thèmes */
  --screen-fg:#ECE5D8;
  --ok:#3E7B4F;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121110;--surface:#1A1917;--sunken:#24221F;--fg:#ECE5D8;--muted:#A39B8E;
    --line:rgba(236,229,216,.10);--line-strong:rgba(236,229,216,.22);
    --accent:#E3613F;--accent-ink:#121110;--gold:#D4B074;
    --c-esprit:#8AA6D6;--c-creation:#E2A75A;--c-corps:#E5A6A6;--c-sex:#D06A7C;
    --halo:rgba(227,97,63,.6);--glow:0 0 22px -4px rgba(227,97,63,.55);
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 14px 34px -18px rgba(0,0,0,.7);
    --glass:rgba(18,17,16,.72);--scrim:rgba(0,0,0,.55);--ok:#6CC08A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121110;--surface:#1A1917;--sunken:#24221F;--fg:#ECE5D8;--muted:#A39B8E;
  --line:rgba(236,229,216,.10);--line-strong:rgba(236,229,216,.22);
  --accent:#E3613F;--accent-ink:#121110;--gold:#D4B074;
  --c-esprit:#8AA6D6;--c-creation:#E2A75A;--c-corps:#E5A6A6;--c-sex:#D06A7C;
  --halo:rgba(227,97,63,.6);--glow:0 0 22px -4px rgba(227,97,63,.55);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 14px 34px -18px rgba(0,0,0,.7);
  --glass:rgba(18,17,16,.72);--scrim:rgba(0,0,0,.55);--ok:#6CC08A;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.22;text-wrap:balance;margin:0}
p{margin:0}
figure{margin:0}
.mono{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}

/* ---------- Ensō ---------- */
.enso{display:block;overflow:visible}
.enso-stroke{fill:none;stroke:var(--fg);stroke-width:8;stroke-linecap:round;filter:url(#brush)}
.enso-ghost{fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round;opacity:.3}
.enso-dot{fill:var(--accent);filter:drop-shadow(0 0 5px var(--halo))}
.draw .enso-stroke{stroke-dasharray:100;animation:draw 1.5s .15s cubic-bezier(.6,.1,.2,1) both}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line)}
.topbar-in{position:relative;display:flex;align-items:center;gap:12px;height:60px;max-width:1380px;margin-inline:auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand .enso{width:30px;height:30px}
.brand .enso-stroke{stroke-width:12}
.brand .enso-ghost{display:none}
.brand-name{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:.02em}
.mock-chip{flex:none;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);padding:1px 7px;border-radius:999px;opacity:.85}
.search{flex:1;max-width:440px;margin-inline:auto;display:flex;align-items:center;gap:10px;height:38px;padding:0 12px 0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-size:14px;text-align:left;transition:border-color .2s}
.search:hover{border-color:var(--line-strong)}
.search svg{width:17px;height:17px;flex:none}
.search span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-strong);border-radius:5px;padding:0 6px;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:4px;flex:none}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;position:relative;color:var(--fg);transition:background .2s}
.icon-btn:hover{background:var(--sunken)}
.icon-btn svg{width:19px;height:19px}
.notif-dot{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:var(--glow)}
.menu-btn{display:none}
.notif-pop{position:absolute;top:58px;right:max(16px, env(safe-area-inset-right, 0px));width:min(330px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:50}
.notif-pop p{padding:10px 12px;border-radius:8px;font-size:13.5px;line-height:1.45}
.notif-pop p:hover{background:var(--sunken)}
.notif-pop .when{display:block;margin-top:2px}

.avatar{--c:var(--muted);width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.hanko{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:12px;font-weight:700;transform:rotate(-5deg);vertical-align:middle;flex:none;line-height:1}
.hanko.gold{background:var(--gold)}
.hanko.sm{width:17px;height:17px;font-size:10.5px}
.badge-creator{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-left:8px}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:236px minmax(0,1fr) 284px;gap:36px;max-width:1380px;margin-inline:auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.main{padding-block:28px 96px;min-width:0}
.page{max-width:760px;display:grid;gap:36px}
.page.wide{max-width:1000px}

/* ---------- Sidebar ---------- */
.sidebar{position:sticky;top:calc(60px + env(safe-area-inset-top, 0px));align-self:start;max-height:calc(100dvh - 60px - env(safe-area-inset-top, 0px));overflow-y:auto;padding-block:22px 40px;scrollbar-width:thin}
.nav-sec{display:grid;gap:1px;margin-bottom:20px}
.nav-title{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 10px 6px}
.nav-link{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;text-decoration:none;font-size:14.5px;color:var(--fg);text-align:left;transition:background .15s}
.nav-link:hover{background:var(--sunken)}
.nav-link[aria-current="page"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:500}
.nav-link .k{width:20px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-size:15px;color:var(--c,var(--muted))}
.nav-link .k svg{width:17px;height:17px}
.nav-link .count{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.nav-link .lock{width:13px;height:13px;margin-left:auto;color:var(--muted);flex:none}
.nav-sub{display:grid;gap:1px;margin:2px 0 8px 19px;padding-left:10px;border-left:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.nav-sub .nav-link{font-size:13.5px;padding:5px 10px;color:var(--muted)}
.nav-sub .nav-link.on{color:var(--fg);background:var(--sunken)}
.nav-club .nav-title{color:var(--gold)}
.b18{display:inline-block;font-family:var(--f-mono);font-size:10.5px;font-weight:500;line-height:1.4;color:var(--c-sex);border:1.5px solid var(--c-sex);border-radius:5px;padding:0 5px}
.b18.sm{font-size:9.5px;margin-left:auto}

/* ---------- Rail ---------- */
.rail{position:sticky;top:calc(60px + env(safe-area-inset-top, 0px));align-self:start;padding-block:28px 40px;display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px}
.panel h3{font-size:18px}
.panel h4{font-family:var(--f-mono);font-weight:400;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2.2s infinite;vertical-align:middle}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,70,40,.45)}70%{box-shadow:0 0 0 9px rgba(200,70,40,0)}100%{box-shadow:0 0 0 0 rgba(200,70,40,0)}}
.live-card .mono{display:flex;align-items:center;gap:8px;color:var(--accent)}
.when{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.events{display:grid;gap:12px;list-style:none;margin:0;padding:0}
.events li{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;font-size:13.5px;line-height:1.4}
.events .day{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);line-height:1.3;font-variant-numeric:tabular-nums}
.events .day b{display:block;color:var(--fg);font-size:13px;font-weight:500}
.events .hanko{margin-left:4px}
.online{display:flex;padding-left:6px}
.online .avatar{width:30px;height:30px;font-size:10.5px;margin-left:-6px;border:2px solid var(--surface)}
.small{font-size:12.5px}
.mission p{font-family:var(--f-display);font-size:18px}
.mission span{color:var(--gold)}

/* ---------- Buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;font-weight:500;font-size:14.5px;text-decoration:none;border:1px solid transparent;white-space:nowrap;transition:transform .15s,box-shadow .2s,background .2s,border-color .2s}
.btn svg{width:16px;height:16px}
.btn-sm{height:32px;padding:0 14px;font-size:13px}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:var(--glow)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{border-color:var(--line-strong);color:var(--fg)}
.btn-ghost:hover{background:var(--sunken)}
.btn-gold{background:var(--gold);color:var(--accent-ink)}
.btn-gold:hover{transform:translateY(-1px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{--c:var(--accent);display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;line-height:1.3;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--line-strong)}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip.on,.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface))}
.chip[disabled]{cursor:not-allowed;color:var(--muted);background:transparent;border-style:dashed}
.chip svg{width:13px;height:13px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--sunken);border:1px solid var(--line)}
.seg button{padding:5px 14px;border-radius:999px;font-size:13px;color:var(--muted);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* ---------- Sections ---------- */
.sec{display:grid;gap:16px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:24px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.toolbar h2{font-size:22px}

/* ---------- Home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center}
.hero h1{font-size:clamp(32px,4.2vw,50px);margin-block:12px 18px;font-weight:600;letter-spacing:-.005em}
.devise{font-family:var(--f-display);font-size:18px;color:var(--muted);border-left:2px solid var(--gold);padding-left:14px}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.hero-art{display:grid;justify-items:center;gap:6px}
.cosmos{width:100%;max-width:300px;height:auto;overflow:visible}
.cosmos .orbits{transform-origin:130px 130px;transform-box:view-box;animation:spin 180s linear infinite}
.cosmos ellipse{fill:none;stroke:var(--line-strong);stroke-width:1}
.cosmos .sat{filter:drop-shadow(0 0 6px var(--halo))}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-art figcaption{display:flex;align-items:center;gap:8px;color:var(--muted)}
.here-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.live-strip{display:none;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:14px}
.live-strip span{min-width:0;flex:1}
.voies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.voie{position:relative;overflow:hidden;display:grid;gap:8px;align-content:start;padding:20px 18px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;transition:border-color .2s,transform .2s,box-shadow .2s}
.voie:hover{border-color:color-mix(in srgb,var(--c) 60%,transparent);transform:translateY(-2px);box-shadow:0 14px 30px -20px var(--c)}
.voie .kanji{font-family:var(--f-display);font-size:46px;line-height:1;color:var(--c)}
.voie h3{font-size:21px}
.voie p{font-size:13.5px;color:var(--muted);line-height:1.55}
.voie .mono{color:var(--c);margin-top:4px}

/* ---------- Posts ---------- */
.feed{display:grid;gap:14px}
.post{--c:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px 12px;display:grid;gap:10px;transition:border-color .2s}
.post:hover{border-color:var(--line-strong)}
.post-meta{display:flex;align-items:center;gap:10px;font-size:13.5px;min-width:0}
.who{min-width:0;flex:1;line-height:1.35}
.who b{font-weight:500}
.where{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:middle}
.post h3{font-size:19px}
.post > p{color:var(--fg);opacity:.88}
.tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;flex:none;align-self:flex-start}
.tag-informer{border:1px solid var(--line-strong);color:var(--fg)}
.tag-eduquer{border:1px solid var(--gold);color:var(--gold)}
.post-actions{display:flex;gap:2px;margin-left:-8px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;font-size:13px;color:var(--muted);transition:background .15s,color .15s}
.act:hover{background:var(--sunken);color:var(--fg)}
.act svg{width:16px;height:16px}
.act.liked{color:var(--accent)}
.act.liked svg path{fill:currentColor}
.pinned{border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
.pin{display:inline-flex;align-items:center;gap:5px;color:var(--gold);flex:none}
.pin svg{width:13px;height:13px}
.prose{display:grid;gap:10px}
.start{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;padding:16px 18px;border-radius:8px;background:var(--sunken)}
.start h4{font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.start ol,.start ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px;line-height:1.5}

.ph{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:8px;background:var(--sunken);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.ph .enso{width:58px;height:58px;opacity:.3}
.ph .ph-label{position:absolute;left:10px;bottom:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ph .play{position:absolute;width:50px;height:50px;border-radius:50%;background:var(--glass);display:grid;place-items:center;border:1px solid var(--line-strong);color:var(--fg)}
.ph .play svg{width:18px;height:18px;margin-left:3px}
.ph.hatch{background:repeating-linear-gradient(135deg,var(--sunken) 0 11px,var(--bg) 11px 13px)}
.ph.hatch .ph-label{color:var(--c-sex)}

/* ---------- Bloc ---------- */
.bloc-head{position:relative;overflow:hidden;padding:28px 24px 24px;border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 15%,var(--surface)),var(--surface) 72%);border:1px solid color-mix(in srgb,var(--c) 28%,var(--line))}
.bloc-head .big-k{position:absolute;right:-4px;top:-34px;font-family:var(--f-display);font-size:190px;line-height:1;color:var(--c);opacity:.12;pointer-events:none}
.bloc-head .eyebrow{color:var(--c)}
.bloc-head h1{font-size:clamp(32px,4vw,44px);margin-block:8px 10px}
.bloc-head p{max-width:54ch;color:var(--muted);position:relative}
.stats{position:relative;display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:16px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sub-intro{color:var(--muted);font-size:14px;margin-top:-6px}
.composer-fake{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;width:100%}
.composer-fake:hover{border-color:var(--line-strong)}
.fake-input{flex:1;min-width:0;color:var(--muted);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chantier{--c:var(--c-sex);border:1px dashed color-mix(in srgb,var(--c-sex) 55%,transparent);border-radius:14px;padding:20px;background:color-mix(in srgb,var(--c-sex) 5%,var(--surface))}
.chantier-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chantier-head h2{font-size:22px}
.chantier-tag{color:var(--c-sex);margin-left:auto}
.chantier > p{font-size:14px;color:var(--muted);max-width:62ch}
.ph-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.empty{display:grid;justify-items:center;gap:12px;padding:36px 16px;text-align:center;border:1px dashed var(--line-strong);border-radius:var(--r);color:var(--muted)}
.empty .enso{width:54px;height:54px}

/* ---------- Oracle ---------- */
.oracle{position:relative;display:grid;gap:20px}
.oracle-bg{position:absolute;top:-70px;right:-60px;width:min(460px,90vw);pointer-events:none;z-index:0}
.oracle-bg svg{width:100%;height:auto;display:block}
.oracle-bg .orbits{transform-origin:200px 200px;transform-box:view-box;animation:spin 240s linear infinite}
.oracle-bg ellipse,.oracle-bg circle.ring{fill:none;stroke:var(--line-strong);stroke-width:.8}
.oracle-bg ellipse.dash{stroke-dasharray:2 5}
.oracle-bg .sat{fill:var(--accent);filter:drop-shadow(0 0 6px var(--halo))}
.oracle > :not(.oracle-bg){position:relative;z-index:1}
.oracle-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-end}
.oracle-head h1{font-size:clamp(28px,3.6vw,40px);margin-block:8px 8px;max-width:18ch}
.quota{display:grid;gap:7px;min-width:230px;font-size:13px;padding:12px 14px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.quota b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.meter{height:4px;border-radius:4px;background:var(--sunken);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));box-shadow:var(--glow);transition:width .4s}
.link-gold{color:var(--gold);font-size:12.5px;text-decoration:none}
.link-gold:hover{text-decoration:underline}
.oracle-grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px}
.hist{display:grid;gap:3px;align-content:start}
.hist button{text-align:left;padding:8px 10px;border-radius:8px;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist button:hover{background:var(--sunken)}
.hist button.on{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.hist .new{border:1px dashed var(--line-strong);color:var(--fg);margin-bottom:8px;text-align:center}
.hist .mono{padding:6px 10px 2px;color:var(--muted);font-size:10px}
.chat{--c:var(--accent);display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;min-height:540px;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.chat-tools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.tool{display:inline-flex;align-items:center;gap:8px}
.tool .mono{color:var(--muted);font-size:10px}
select{font:inherit;font-size:13.5px;height:34px;padding:0 10px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);max-width:100%}
.guides{display:flex;flex-wrap:wrap;gap:6px}
.guides .chip{padding:4px 10px;font-size:12.5px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-left:auto}
.switch .track{width:34px;height:20px;border-radius:999px;background:var(--sunken);border:1px solid var(--line-strong);position:relative;transition:background .2s;flex:none}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch[aria-checked="true"]{color:var(--fg)}
.switch[aria-checked="true"] .track{background:color-mix(in srgb,var(--accent) 25%,var(--sunken))}
.switch[aria-checked="true"] .track::after{transform:translateX(14px);background:var(--accent);box-shadow:var(--glow)}
.chat-log{padding:20px 18px;display:grid;gap:18px;align-content:start;overflow-y:auto;max-height:60vh;min-height:300px}
.msg-user{justify-self:end;max-width:80%;background:var(--sunken);border-radius:14px 14px 4px 14px;padding:10px 14px;font-size:14.5px}
.msg-ai{display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));gap:12px}
.answer{display:grid;gap:8px;font-size:14.5px;align-content:start;min-width:0}
.compare .answer{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.model-badge{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.model-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:var(--glow)}
.typing{display:inline-flex;gap:4px;padding:6px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite}
.typing span:nth-child(2){animation-delay:.18s}
.typing span:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chat-empty{display:grid;justify-items:center;gap:14px;padding:30px 8px;text-align:center}
.chat-empty .enso{width:70px;height:70px}
.chat-empty .h{font-family:var(--f-display);font-size:21px}
.suggests{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.composer{display:flex;gap:10px;align-items:flex-end;padding:12px 14px;border-top:1px solid var(--line)}
.composer textarea{flex:1;min-width:0;resize:none;font:inherit;font-size:14.5px;line-height:1.5;border:1px solid var(--line-strong);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--fg);max-height:140px}
.composer textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.fineprint{font-size:11.5px;color:var(--muted);padding:0 14px 12px}

/* ---------- Club ---------- */
.club-hero{position:relative;overflow:hidden;border-radius:16px;padding:46px 30px 40px;background:var(--sunken);border:1px solid var(--line);display:grid;gap:14px;justify-items:start}
.club-hero .seigaiha{position:absolute;inset:0;width:100%;height:100%;-webkit-mask-image:linear-gradient(100deg,transparent 30%,#000 95%);mask-image:linear-gradient(100deg,transparent 30%,#000 95%);opacity:.55}
.seigaiha circle{fill:none;stroke:var(--gold);stroke-width:.7}
.seigaiha .sg-o{fill:var(--sunken)}
.club-hero > :not(.seigaiha){position:relative}
.club-hero .eyebrow{color:var(--gold)}
.club-hero h1{font-size:clamp(36px,5.4vw,60px);font-weight:700;letter-spacing:-.01em}
.club-hero p.lead{max-width:48ch;font-size:16.5px}
.hanko-lg{width:56px;height:56px;font-size:30px;border-radius:8px}
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.feat article{padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:grid;gap:6px;align-content:start}
.feat .k{font-family:var(--f-display);font-size:24px;line-height:1.2;color:var(--gold)}
.feat h3{font-size:17px}
.feat p{font-size:13.5px;color:var(--muted);line-height:1.55}
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.steps li{padding-top:12px;border-top:1px solid var(--gold);display:grid;gap:4px;font-size:13.5px;align-content:start}
.steps .num{font-family:var(--f-display);font-size:24px;color:var(--gold);line-height:1.2}
.steps b{font-weight:500;font-size:15px}
.steps span.muted{line-height:1.5}
.pricing{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.plan{padding:22px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;gap:14px;align-content:start}
.plan.club{border-color:var(--gold);box-shadow:0 22px 44px -28px var(--gold)}
.plan-head{display:flex;align-items:center;gap:10px}
.plan-head h3{font-size:19px}
.price{font-family:var(--f-display);font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.price small{font-family:var(--f-body);font-size:14px;font-weight:400;color:var(--muted)}
.plan ul{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-size:14px;line-height:1.5}
.plan li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px}
.plan li::before{content:"";width:8px;height:8px;margin-top:7px;border-radius:50%;border:1.5px solid var(--gold)}
.plan.free li::before{border-color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}
.host{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;padding:22px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.host .avatar{width:74px;height:74px;font-size:20px}
.host h3{font-size:22px}
.todo{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;color:var(--gold);border:1px dashed var(--gold);border-radius:8px;padding:10px 12px;line-height:1.5}
.faq{display:grid}
.faq details{border-bottom:1px solid var(--line);padding:14px 2px}
.faq summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--f-mono);color:var(--muted)}
.faq details[open] summary::after{content:"−"}
.faq p{margin-top:8px;color:var(--muted);font-size:14.5px;max-width:64ch}
.club-final{display:grid;justify-items:center;gap:14px;padding:30px 16px;text-align:center;border-top:1px solid var(--line)}
.club-final h2{font-size:28px}
.kintsugi{height:1px;border:0;margin:0;background:linear-gradient(90deg,transparent,var(--gold) 10%,var(--gold) 46%,transparent 47%,transparent 49%,var(--gold) 50%,var(--gold) 90%,transparent);opacity:.6}

/* ---------- En-têtes de page, liens ---------- */
.main{container-type:inline-size}
.page-head{display:grid;gap:8px}
.page-head h1{font-size:clamp(30px,4vw,44px)}
.page-head p.muted{max-width:60ch}
.plain{text-decoration:none}
.plain:hover{text-decoration:underline}
a.avatar,.av-link{text-decoration:none}
.av-link{display:inline-grid;flex:none}
.who a{font-weight:500;text-decoration:none}
.who a:hover{text-decoration:underline}
.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{white-space:nowrap;flex:none}

/* ---------- Lives ---------- */
.live-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.live-layout.on{grid-template-columns:minmax(0,1fr) 290px}
.player{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;color:var(--screen-fg);display:grid;place-items:center;border:1px solid var(--line);
  background:radial-gradient(110% 100% at 78% 12%,rgba(200,70,40,.30),transparent 60%),radial-gradient(90% 80% at 8% 100%,rgba(212,176,116,.16),transparent 60%),var(--screen)}
.player .enso{width:min(24%,140px);height:auto}
.player .enso-stroke,.player .enso-ghost{stroke:var(--screen-fg)}
.grid-lines{position:absolute;inset:0;background-image:linear-gradient(rgba(236,229,216,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(236,229,216,.06) 1px,transparent 1px);background-size:36px 36px;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000,transparent 72%);mask-image:radial-gradient(circle at 50% 50%,#000,transparent 72%)}
.pl-badge{position:absolute;top:14px;left:14px;display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border-radius:999px;background:rgba(236,229,216,.1);border:1px solid rgba(236,229,216,.2);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.pl-badge.live{background:#C8442B;border-color:#C8442B;color:#FBF8F2}
.pl-badge.live .live-dot{background:#FBF8F2}
.pl-viewers{position:absolute;top:16px;right:16px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;opacity:.8}
.pl-foot{position:absolute;left:16px;right:16px;bottom:14px;display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}
.pl-foot .mono{opacity:.75}
.pl-count{font-family:var(--f-display);font-size:clamp(17px,2.6vw,26px);font-variant-numeric:tabular-nums}
.live-bar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between}
.live-bar h2{font-size:22px}
.live-bar p.muted{font-size:13.5px;margin-top:2px}
.live-bar .acts{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.live-bar .switch{margin-left:0}
.livechat{contain:size;display:grid;grid-template-rows:auto minmax(0,1fr) auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.livechat h3{font-family:var(--f-mono);font-weight:400;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line)}
.livechat-log{overflow-y:auto;padding:12px 14px;display:grid;gap:9px;align-content:start;font-size:13.5px;line-height:1.45}
.livechat-log b{font-weight:500;margin-right:6px;color:var(--c,var(--fg))}
.livechat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.livechat input{flex:1;min-width:0;height:36px;border-radius:999px;border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);font:inherit;font-size:13.5px;padding:0 12px}
.livechat input:focus{outline:none;border-color:var(--accent)}
.livechat form button{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.livechat form button svg{width:16px;height:16px}
.prog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.prog article{display:grid;gap:6px;align-content:start;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.pday{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.pday b{font-family:var(--f-display);font-size:22px;font-weight:600}
.pday span{font-family:var(--f-mono);font-size:13px;color:var(--c);font-variant-numeric:tabular-nums}
.prog h3{font-size:17px}
.prog p{font-size:13.5px;color:var(--muted);line-height:1.55}
.replays{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.replay{display:grid;gap:8px;align-content:start;text-align:left}
.thumb{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:10px;overflow:hidden;display:grid;place-items:center;border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 30%,var(--sunken)),var(--sunken) 75%);transition:transform .2s}
.replay:hover .thumb{transform:translateY(-2px)}
.thumb .tk{font-family:var(--f-display);font-size:64px;line-height:1;color:var(--c);opacity:.35}
.thumb .play{position:absolute;width:44px;height:44px;border-radius:50%;background:var(--glass);display:grid;place-items:center;border:1px solid var(--line-strong);color:var(--fg)}
.thumb .play svg{width:16px;height:16px;margin-left:2px}
.thumb .dur{position:absolute;right:8px;bottom:8px;font-family:var(--f-mono);font-size:11px;background:var(--screen);color:var(--screen-fg);padding:1px 6px;border-radius:4px;font-variant-numeric:tabular-nums}
.replay .rt{font-size:15px;font-weight:500;line-height:1.4}
.replay .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12.5px;color:var(--muted)}
.locked-card{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;padding:20px;border:1px dashed var(--gold);border-radius:14px;background:color-mix(in srgb,var(--gold) 6%,var(--surface))}
.locked-card > div{flex:1;min-width:200px;display:grid;gap:4px}
.locked-card h3{font-size:19px}
.locked-card p{font-size:14px;color:var(--muted)}

/* ---------- Calendrier ---------- */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}
.cal{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.cal-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cal-head h2{font-size:22px;flex:1;min-width:150px}
.cal-nav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-strong);font-family:var(--f-mono);font-size:16px}
.cal-nav:hover{background:var(--sunken)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.cal-day{min-height:92px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;min-width:0;transition:background .15s}
.cal-grid > :nth-child(7n){border-right:0}
button.cal-day:hover{background:var(--sunken)}
.cal-day.out{background:color-mix(in srgb,var(--sunken) 55%,transparent)}
.cal-day .dn{font-family:var(--f-mono);font-size:12px;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.cal-day.today .dn{background:var(--accent);color:var(--accent-ink);box-shadow:var(--glow)}
.cal-day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.evs{display:grid;gap:2px;min-width:0}
.ev{display:flex;align-items:center;gap:5px;font-size:11.5px;line-height:1.35;min-width:0;white-space:nowrap}
.ev i{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.ev .et{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.ev .tt{overflow:hidden;text-overflow:ellipsis}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px;font-size:12px;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.day-panel{display:grid;gap:10px;padding:18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);position:sticky;top:calc(76px + env(safe-area-inset-top, 0px))}
.day-panel h3{font-size:20px}
.day-ev{display:grid;gap:4px;padding-top:12px;border-top:1px solid var(--line)}
.day-ev .t{font-family:var(--f-mono);font-size:13px;color:var(--c);font-variant-numeric:tabular-nums}
.day-ev b{font-weight:500}
.day-ev .muted{font-size:13px}
.day-ev .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

/* ---------- Annuaire ---------- */
.dir-tools{display:grid;gap:12px}
.dir-search{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--muted)}
.dir-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.dir-search svg{width:18px;height:18px;flex:none}
.dir-search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;color:var(--fg);outline:none}
.dir-row{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.dir-row select{height:32px;font-size:13px}
.dir-count{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.dir-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mcard{display:grid;gap:10px;align-content:start;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit;transition:border-color .2s,transform .2s}
.mcard:hover{border-color:var(--line-strong);transform:translateY(-2px)}
.mcard-top{display:flex;align-items:center;gap:12px;min-width:0}
.mcard-top > div{min-width:0;display:grid;gap:1px}
.av{position:relative;flex:none;display:inline-grid}
.av.online::after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
.mcard .avatar{width:46px;height:46px;font-size:14px}
.mcard h3{font-family:var(--f-body);font-size:15px;font-weight:500;line-height:1.35;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mcard .city{font-size:12.5px;color:var(--muted)}
.mcard .bio{font-size:13.5px;color:var(--muted);line-height:1.5}
.vchips{display:flex;flex-wrap:wrap;gap:6px 12px}
.vchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.vchip i{width:7px;height:7px;border-radius:50%;background:var(--c)}

/* ---------- Profil ---------- */
.prof-head{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:20px;align-items:center;padding:26px 24px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 10%,var(--surface)),var(--surface) 62%)}
.prof-id{display:grid;gap:12px;justify-items:start;min-width:0}
.prof-id .avatar{width:80px;height:80px;font-size:22px}
.prof-id .av.online::after{width:16px;height:16px;right:3px;bottom:3px;border-width:3px}
.prof-id h1{font-size:clamp(26px,3.4vw,36px);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prof-id .bio{font-size:15px;max-width:52ch}
.prof-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.prof-meta .on{color:var(--ok)}
.prof-actions{display:flex;gap:8px;flex-wrap:wrap}
.universe{width:100%;max-width:220px;height:auto;justify-self:center;overflow:visible}
.universe .orb{fill:none;stroke-width:1;opacity:.6}
.universe .lbl{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.08em;fill:var(--muted)}
.universe .core{fill:var(--surface);stroke:var(--c);stroke-width:1.2}
.universe .core-t{font-family:var(--f-mono);font-size:13px;fill:var(--fg)}
.universe .sat{filter:drop-shadow(0 0 5px var(--halo))}
.universe .orbits{transform-origin:110px 110px;transform-box:view-box;animation:spin 200s linear infinite}
.prof-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prof-stats div{background:var(--surface);padding:14px 16px;display:grid;gap:2px}
.prof-stats b{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.prof-stats span{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:10px 14px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.about{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.about section{padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:grid;gap:10px;align-content:start}
.about h4{font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.about p{font-size:14.5px}
.words{display:flex;flex-wrap:wrap;gap:6px 16px}
.words span{font-family:var(--f-display);font-size:21px}
.privacy{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);padding:12px 14px;border-radius:var(--r);background:var(--sunken)}
.privacy svg{width:16px;height:16px;flex:none;margin-top:2px}
.activity{list-style:none;margin:0;padding:0;display:grid}
.activity li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}

@container (max-width:760px){
  .cal-wrap{grid-template-columns:minmax(0,1fr)}
  .day-panel{position:static}
  .live-layout.on{grid-template-columns:minmax(0,1fr)}
  .livechat{contain:none;height:340px}
  .prog{grid-template-columns:minmax(0,1fr)}
}
@container (max-width:620px){
  .prof-head{grid-template-columns:minmax(0,1fr)}
  .universe{max-width:190px;order:-1}
  .about{grid-template-columns:minmax(0,1fr)}
  .activity li{grid-template-columns:minmax(0,1fr);gap:2px}
}
@container (max-width:560px){
  .cal-day{min-height:54px;padding:4px}
  .ev .et,.ev .tt{display:none}
  .evs{display:flex;flex-wrap:wrap;gap:3px}
  .cal-dow{padding:6px 4px;font-size:9.5px;letter-spacing:.04em}
  .prof-stats b{font-size:21px}
}

/* ---------- Carte des Humains ---------- */
.map-wrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}
.map-card{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.map-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.map{position:relative;max-width:100%;background:radial-gradient(80% 90% at 50% 40%,color-mix(in srgb,var(--accent) 5%,transparent),transparent 70%)}
.map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.map .land circle{fill:var(--line-strong)}
.map .grat line{stroke:var(--line);stroke-width:1}
.mpin{--c:var(--accent);position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--c);color:var(--accent-ink);font-family:var(--f-mono);font-size:11px;font-weight:500;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 28%,transparent),0 0 16px -2px var(--halo);transition:transform .15s;z-index:1}
.mpin:hover,.mpin:focus-visible,.mpin.sel{transform:translate(-50%,-50%) scale(1.15);z-index:3}
.mpin.sel{outline:2px solid var(--fg);outline-offset:3px}
.mpin.online::after{content:"";position:absolute;inset:-5px;border-radius:999px;border:1px solid var(--c);animation:ring 2.6s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:scale(.85);opacity:.9}to{transform:scale(1.7);opacity:0}}
.mpin .plbl{position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;font-size:10px;letter-spacing:.06em;color:var(--fg);background:var(--glass);border:1px solid var(--line);padding:1px 6px;border-radius:4px;pointer-events:none;opacity:0;transition:opacity .15s}
.mpin:hover .plbl,.mpin:focus-visible .plbl,.mpin.sel .plbl,.mpin.cluster .plbl{opacity:1}
.apin{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--c);transform:translate(-50%,-50%);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent),0 0 12px -2px var(--halo);transition:transform .15s;z-index:1}
.apin:hover,.apin:focus-visible{transform:translate(-50%,-50%) scale(1.5);z-index:3}
.apin .plbl{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) scale(.667);transform-origin:bottom center;width:max-content;max-width:220px;display:grid;gap:2px;text-align:center;font-size:12px;line-height:1.35;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);padding:6px 9px;border-radius:8px;box-shadow:var(--shadow);pointer-events:none;opacity:0;transition:opacity .15s}
.apin .plbl small{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.apin:hover .plbl,.apin:focus-visible .plbl{opacity:1}
.legend{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.map-foot{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.map-side{display:grid;gap:12px;padding:18px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.map-side h3{font-size:20px}
.city-list{list-style:none;margin:0;padding:0;display:grid}
.city-list button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.city-list button:hover{color:var(--accent)}
.city-list .n{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.city-list i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.cm{display:flex;align-items:center;gap:10px;text-decoration:none;padding:6px;margin-inline:-6px;border-radius:8px;color:inherit}
.cm:hover{background:var(--sunken)}
.cm .avatar{width:34px;height:34px;font-size:11px}
.cm span{display:grid;line-height:1.35;font-size:14px;min-width:0}
.cm small{font-size:12px;color:var(--muted)}

/* ---------- Publication ---------- */
.crumbs{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.crumbs a{color:var(--c);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.post-full{display:grid;gap:18px;padding:26px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.post-full h1{font-size:clamp(26px,3.6vw,38px)}
.prose-l{display:grid;gap:14px;font-size:16.5px;line-height:1.75;max-width:65ch}
.sources{display:grid;gap:4px;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:10px;font-size:13.5px;color:var(--muted)}
.sources h4{font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.sources ol{margin:0;padding-left:18px;display:grid;gap:6px;line-height:1.5}
.sources a{color:var(--fg);text-decoration:underline;text-decoration-color:var(--line-strong);white-space:nowrap}
.sources a:hover{color:var(--accent)}
.plaisir{display:grid;gap:8px;padding:16px 18px;border-radius:12px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 35%,var(--line))}
.plaisir h4,.pratique h4{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.plaisir .kj{font-family:var(--f-display);font-size:19px;letter-spacing:0}
.plaisir p{font-size:15.5px;line-height:1.7;max-width:65ch}
.pratique{display:grid;gap:8px;padding:16px 18px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.pratique h4{color:var(--gold)}
.pratique ol{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px;line-height:1.55;max-width:65ch}
.repere{color:var(--c);margin-bottom:-8px}
.essentiel{display:grid;gap:8px;padding:16px 18px;border-radius:12px;background:var(--sunken)}
.essentiel h4,.videos h4{font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.essentiel ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:15px;line-height:1.55;max-width:65ch}
.citation{margin:0;display:grid;gap:8px;padding:6px 0 6px 22px;position:relative}
.citation::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:2px;background:linear-gradient(var(--gold),transparent)}
.citation blockquote{margin:0;font-family:var(--f-display);font-size:clamp(19px,2.4vw,23px);line-height:1.5;max-width:40ch}
.citation figcaption{font-size:13px;color:var(--muted)}
.citation cite{font-style:italic}
.videos{display:grid;gap:10px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.vwin{display:grid;gap:8px;align-content:start}
.vscreen{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;display:grid;place-items:center;color:var(--screen-fg);text-decoration:none;border:1px solid var(--line);
  background:radial-gradient(100% 90% at 80% 10%,rgba(200,70,40,.32),transparent 60%),var(--screen);transition:transform .2s,box-shadow .2s}
.vscreen:hover{transform:translateY(-2px);box-shadow:0 16px 34px -20px rgba(200,70,40,.8)}
.vscreen .enso{position:absolute;width:38%;max-width:150px;height:auto;opacity:.18}
.vscreen .enso-stroke,.vscreen .enso-ghost{stroke:var(--screen-fg)}
.vplay{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#C8442B;color:#FBF8F2;box-shadow:0 0 24px -2px rgba(200,70,40,.7)}
.vplay svg{width:20px;height:20px;margin-left:3px}
.vlang,.vyt{position:absolute;top:10px;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;padding:2px 7px;border-radius:4px;background:rgba(236,229,216,.12);border:1px solid rgba(236,229,216,.2)}
.vlang{left:10px}
.vyt{right:10px}
.vmeta{display:grid;gap:2px;font-size:13.5px;line-height:1.4}
.vmeta b{font-weight:500}
.vmeta span{color:var(--muted);font-size:12.5px}
.src-badge{margin-left:auto;align-self:center;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.reacts{display:flex;flex-wrap:wrap;gap:8px}
.reacts .chip .kj{font-family:var(--f-display);font-size:15px;color:var(--c)}
.c-form{display:flex;gap:12px;align-items:flex-start}
.c-form .avatar{width:36px;height:36px;font-size:11px}
.c-form > div{flex:1;min-width:0;display:grid;gap:8px;justify-items:end}
.c-form textarea{width:100%;resize:vertical;min-height:72px;font:inherit;font-size:14.5px;line-height:1.5;border:1px solid var(--line-strong);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--fg)}
.c-form textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.comments{display:grid}
.cmt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.cmt.reply{padding:12px 0 0;border-bottom:0}
.cmt .avatar{width:32px;height:32px;font-size:11px}
.cmt-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;font-size:13.5px}
.cmt-head a{font-weight:500;text-decoration:none}
.cmt-head a:hover{text-decoration:underline}
.cmt-head .badge-creator{margin:0}
.cmt-body > p{font-size:14.5px;margin-top:3px}
.cmt-acts{display:flex;flex-wrap:wrap;gap:2px;margin:2px 0 0 -8px}
.cmt-acts .act{font-size:12.5px;padding:4px 8px}
.cmt-replies{margin-top:4px;padding-left:14px;border-left:1px solid var(--line)}
.cmt.new{animation:flash 1.6s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--accent) 14%,transparent)}to{background:transparent}}

/* ---------- Inscription ---------- */
.signup{display:grid;grid-template-columns:290px minmax(0,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.su-side{position:relative;overflow:hidden;display:grid;gap:16px;align-content:start;padding:30px 24px;color:var(--screen-fg);background:radial-gradient(100% 70% at 80% 0%,rgba(200,70,40,.28),transparent 60%),var(--screen)}
.su-side .enso{width:76px;height:76px}
.su-side .enso-stroke,.su-side .enso-ghost{stroke:var(--screen-fg)}
.su-side h2{font-size:26px}
.su-side .devise{color:rgba(236,229,216,.75);font-size:15px;border-color:#D4B074}
.su-side ul{list-style:none;margin:0;padding:0;display:grid;gap:12px;font-size:13.5px}
.su-side li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:start;line-height:1.45}
.su-side li b{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1;color:color-mix(in srgb,var(--c) 55%,#ECE5D8)}
.su-side .small{color:rgba(236,229,216,.65)}
.su-main{display:grid;gap:22px;align-content:start;padding:28px}
.su-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.su-steps li{display:grid;gap:6px;font-size:12px;color:var(--muted)}
.su-steps li::before{content:"";height:3px;border-radius:3px;background:var(--sunken)}
.su-steps li.done::before,.su-steps li.cur::before{background:var(--accent);box-shadow:var(--glow)}
.su-steps li.cur{color:var(--fg);font-weight:500}
.su-main h2{font-size:26px}
.su-form{display:grid;gap:16px}
.field{display:grid;gap:6px}
.field > label,.field > .lab{font-size:13.5px;font-weight:500}
.field input,.field textarea{font:inherit;font-size:15px;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);width:100%}
.field textarea{height:auto;min-height:84px;padding:10px 14px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.field.err input,.field.err textarea{border-color:var(--accent)}
.field .msg{font-size:12.5px;color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted)}
.row2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.strength{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.strength i{height:3px;border-radius:3px;background:var(--sunken)}
.strength i.on{background:var(--sc)}
.or{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.btn-wide{width:100%}
.su-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.voie-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.vp{display:grid;gap:6px;align-content:start;text-align:left;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);transition:border-color .15s,background .15s}
.vp:hover{border-color:var(--line-strong)}
.vp[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface));box-shadow:0 0 0 1px var(--c)}
.vp .kanji{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--c)}
.vp b{font-family:var(--f-display);font-size:18px;font-weight:600}
.vp span.muted{font-size:12.5px;line-height:1.45}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5;cursor:pointer}
.check input{width:18px;height:18px;flex:none;margin-top:2px;accent-color:var(--accent)}
.su-grid{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:20px;align-items:start}
.preview{display:grid;gap:8px}
.preview .mono{color:var(--muted);font-size:10px}
.welcome{display:grid;justify-items:center;text-align:center;gap:14px;padding:26px 8px}
.welcome .enso{width:120px;height:120px}
.welcome h2{font-size:32px}
.welcome p{max-width:46ch;color:var(--muted)}
.rules{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}

@container (max-width:760px){
  .map-wrap{grid-template-columns:minmax(0,1fr)}
  .signup{grid-template-columns:minmax(0,1fr)}
  .su-side{padding:22px 20px}
  .su-side ul,.su-side .small{display:none}
  .su-grid{grid-template-columns:minmax(0,1fr)}
}
@container (max-width:560px){
  .voie-pick{grid-template-columns:minmax(0,1fr)}
  .su-main{padding:20px 16px}
  .post-full{padding:18px 16px}
  .su-steps li{font-size:10.5px}
}

/* ---------- Overlays ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:52}
.palette{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:start center;padding-top:calc(12vh + env(safe-area-inset-top, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.palette-box{width:min(560px,100%);background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);overflow:hidden}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font:inherit;font-size:16px;background:transparent;color:var(--fg);outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.palette li button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;text-align:left;font-size:14px}
.palette li button.sel{background:var(--sunken)}
.palette .grp{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.palette .pk{width:20px;text-align:center;font-family:var(--f-display);color:var(--c,var(--muted))}
.palette .none{padding:14px;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13.5px;transition:opacity .25s,transform .25s;z-index:70;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tabbar{display:none}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .layout{grid-template-columns:228px minmax(0,1fr);gap:30px}
  .rail{display:none}

  "title": "Sucré, salé, acide, amer, umami : comment la langue détecte les saveurs",
  "excerpt": "Cinq saveurs reconnues, des récepteurs spécialisés, deux candidates encore discutées. Ce que l'on sait du goût, et pourquoi la « carte de la langue » est fausse.",
  "tag": "Informer",
  "body": [
   "Au sens strict, le goût (les scientifiques parlent de gustation) désigne ce que perçoivent les bourgeons du goût. Ce sont de petits groupes de cellules sensorielles logés dans les papilles de la langue, mais aussi sur le palais et au fond de la gorge. Cinq qualités sont aujourd'hui reconnues : le sucré, le salé, l'acide, l'amer et l'umami, cette saveur ronde et savoureuse du bouillon, du parmesan ou de la tomate mûre, liée au glutamate. Tout le reste, la fraise, le café, le basilic, vient de l'odorat. Selon une revue de référence publiée dans Nature en 2006, chaque saveur est captée par des cellules spécialisées, dotées de leurs propres récepteurs.",
   "Le sucré, l'umami et l'amer reposent sur des récepteurs dits « couplés aux protéines G » : des sortes d'antennes posées à la surface de la cellule qui, une fois activées, déclenchent une cascade de signaux à l'intérieur. Le sucré est capté par l'association de deux protéines, T1R2 et T1R3. L'umami utilise T1R1, associée elle aussi à T1R3. L'amer dispose d'une famille entière, les récepteurs T2R, dont l'humain possède au moins 25 versions. Cette diversité permet de repérer un très grand nombre de molécules amères, parmi lesquelles beaucoup de substances potentiellement toxiques. L'amertume fonctionne d'abord comme une sentinelle.",

   "Aimer un aliment et en avoir envie semblent synonymes. Pour le cerveau, ce sont deux processus distincts. Les chercheurs Kent Berridge et Morten Kringelbach parlent de « liking », aimer, c'est-à-dire le plaisir ressenti au moment de goûter, et de « wanting », désirer, l'élan qui pousse à chercher et à manger. Le désir mobilise un vaste réseau qui inclut la dopamine, un messager chimique du cerveau. Le plaisir dépend de circuits plus petits et plus fragiles. Chez le rat, augmenter la dopamine accroît l'envie de sucre sans augmenter le plaisir qu'il procure. Et des personnes atteintes de la maladie de Parkinson, privées d'une partie de leur dopamine, jugent toujours normalement le plaisir d'un goût sucré.",
   "Où naît le plaisir proprement dit ? Chez le rat, les chercheurs ont repéré des « points chauds hédoniques » : de minuscules zones, d'environ un millimètre cube, situées dans le noyau accumbens et le pallidum ventral (deux structures profondes du cerveau), ainsi que dans le tronc cérébral. Y injecter des opioïdes, des molécules apparentées à la morphine que le corps produit aussi, peut doubler les réactions de plaisir au sucre. Ces réactions se lisent sur le visage : petits coups de langue pour le sucré, bouche béante et secousses de la tête pour l'amer. Ces cartes viennent de l'animal. Chez l'humain, leur emplacement reste une extrapolation.",
   "Chez l'humain, l'imagerie cérébrale désigne une région située juste au-dessus des yeux : le cortex orbitofrontal. En 2003, une équipe d'Oxford a fait consommer à des volontaires un aliment liquide jusqu'à satiété, tout en mesurant leur activité cérébrale. L'activité d'une partie de ce cortex diminuait à mesure que l'aliment devenait moins agréable, et cette baisse était propre à l'aliment consommé. Ce cortex semble donc suivre de près le plaisir ressenti. Prudence toutefois : l'imagerie montre des corrélations, pas des causes, et des patients porteurs de lésions frontales conservent souvent l'essentiel de leurs plaisirs.",
   "Ce phénomène porte un nom : la satiété sensorielle spécifique, décrite en 1981 par Barbara et Edmund Rolls. Dans leurs expériences, des volontaires notaient l'agrément de huit aliments, en mangeaient un seul au déjeuner, puis les notaient à nouveau. Le plaisir baissait davantage pour l'aliment consommé que pour les autres. La même équipe a montré qu'on mange environ un tiers de plus quand on propose des sandwichs à quatre garnitures plutôt qu'à une seule. D'où la fameuse « petite place pour le dessert » : la satiété n'est pas qu'une affaire d'estomac. Le plaisir d'un aliment précis s'estompe, tandis que les autres gardent leur attrait."
  ],

  "excerpt": "Pincez-vous le nez et une fraise devient simplement sucrée. Ce que nous appelons « goût » est une flaveur, que le cerveau construit en mêlant plusieurs sens.",
  "tag": "Éduquer",
  "body": [
   "Nous disons qu'un yaourt « a le goût de fraise ». Pourtant, la langue ne détecte que cinq saveurs : sucré, salé, acide, amer et umami. La fraise, elle, est une odeur. Les spécialistes réservent donc le mot « goût » aux saveurs et parlent de « flaveur » pour l'expérience complète d'un aliment. La flaveur réunit le goût, l'odeur, la texture, la température et d'autres sensations, comme le piquant du piment ou la fraîcheur de la menthe. Le neurobiologiste Gordon Shepherd, qui a popularisé le terme de « neurogastronomie », souligne que cet ensemble est assemblé par le cerveau, en lien étroit avec la mémoire et les émotions.",
   "L'odorat fonctionne par deux chemins. Quand on renifle un plat, les molécules odorantes entrent par les narines : c'est l'olfaction orthonasale. Quand on mâche et qu'on avale, elles remontent depuis l'arrière de la bouche vers le nez : c'est l'olfaction rétronasale, ou rétro-olfaction. En 1982, le psychologue Paul Rozin a proposé de voir l'odorat comme un « sens double ». Les odeurs reniflées semblent venir du monde extérieur. Les odeurs rétronasales, elles, semblent venir de la bouche. C'est pour cela que nous les confondons si facilement avec le goût.",
   "L'imagerie cérébrale confirme que ces deux chemins ne sont pas équivalents. En 2005, l'équipe de la neuroscientifique Dana Small a diffusé des odeurs à des volontaires, soit par le nez, soit par l'arrière de la bouche. La voie rétronasale activait davantage la zone du cerveau qui représente la bouche. Pour l'odeur de chocolat, mais pas pour des odeurs non alimentaires comme la lavande, certaines régions réagissaient différemment selon la voie, dont le cortex orbitofrontal médian. Il s'agit d'une seule étude, mais elle suggère que le cerveau traite à part une odeur qui signale un aliment en bouche.",
   "On lit souvent que 80 % du goût viendrait de l'odorat. Le psychologue Charles Spence, de l'université d'Oxford, a cherché l'origine de ces chiffres, qui varient de 75 à 95 % selon les auteurs. Sa conclusion : aucune étude solide ne justifie un pourcentage aussi précis. Cela n'enlève rien au rôle majeur du nez, que chacun peut vérifier avec l'exercice ci-dessous. La texture et la température comptent aussi. La chaleur renforce par exemple la perception du sucré, si bien qu'une glace fondue paraît souvent plus sucrée que la même glace bien froide."

  "title": "Éduquer son palais : goûter souvent, goûter lentement",
  "excerpt": "Nos goûts ne sont pas figés. L'exposition répétée, la génétique et l'attention portée à chaque bouchée façonnent ce que nous aimons.",

  "body": [
   "Une part de nos préférences est innée : le sucré plaît dès la naissance, l'amer déplaît. Mais une grande part s'apprend. Le levier le mieux étudié est l'exposition répétée : goûter plusieurs fois un aliment, en petite quantité et sans pression, tend à le rendre plus acceptable. Une méta-analyse de 2018, c'est-à-dire une analyse qui regroupe les résultats de nombreuses études, a rassemblé 43 articles consacrés aux légumes. Elle conclut que l'exposition répétée augmente l'appréciation et la consommation du légume goûté. Les effets restent modestes, et la plupart des études portent sur des enfants. Les données chez l'adulte sont rares.",
   "Nous ne vivons pas tous dans le même monde gustatif. On sait depuis longtemps que certaines personnes perçoivent à peine l'amertume de molécules comme le PTC ou le PROP (propylthiouracile), alors que d'autres la trouvent intense. La chercheuse américaine Linda Bartoshuk et son équipe ont décrit les « supergoûteurs », qui jugent le PROP très amer. Ils perçoivent aussi plus fortement certaines saveurs sucrées et amères, ainsi que la brûlure de l'alcool ou du piment. Une partie de ces différences s'explique par les variantes d'un gène de récepteur de l'amer, TAS2R38, identifié en 2003.",
   "La science a toutefois nuancé ce tableau. Des travaux anciens associaient les supergoûteurs à un plus grand nombre de papilles fongiformes, ces petites bosses en forme de champignon à l'avant de la langue. En 2014, une étude participative menée dans un musée auprès d'un large public n'a trouvé aucun lien entre la densité de ces papilles et l'amertume perçue du PROP. Les auteurs invitent à ne pas employer le mot « supergoûteur » à la légère. Les chercheurs envisagent plutôt aujourd'hui un continuum de sensibilité, qui ne se résume ni au PROP ni aux papilles.",

  "excerpt": "Quelques centaines de récepteurs, un code fait de combinaisons et un débat animé sur le nombre d'odeurs que nous savons distinguer.",

  "body": [
   "Tout commence dans une petite zone de muqueuse située en haut des fosses nasales, l'épithélium olfactif. Ses neurones portent des récepteurs capables de reconnaître des molécules odorantes. En 1991, Linda Buck et Richard Axel ont découvert, chez le rat, une très grande famille de gènes codant ces récepteurs. Leurs travaux sur les récepteurs olfactifs et l'organisation de l'odorat leur ont valu le prix Nobel de physiologie ou médecine en 2004. Ils ont notamment établi que chaque neurone olfactif ne porte qu'un seul type de récepteur, et que les neurones de même type envoient leurs signaux vers un même point du bulbe olfactif, le premier relais de l'odorat dans le cerveau.",
   "Chez l'humain, on compte entre 340 et 400 récepteurs olfactifs fonctionnels environ, selon les méthodes de décompte. Une analyse du génome publiée en 2004 recensait 339 gènes intacts, à côté de près de 300 « pseudogènes », des gènes devenus inactifs au fil de l'évolution. Ces récepteurs appartiennent à la même grande famille que ceux du sucré ou de l'amer, celle des récepteurs couplés aux protéines G. En 2023, des chercheurs ont obtenu pour la première fois l'image en trois dimensions d'un récepteur olfactif humain fixant une molécule odorante. Cette avancée aide à comprendre comment un récepteur « choisit » ses molécules.",

  "excerpt": "Une odeur peut nous ramener des décennies en arrière, avec une émotion intacte. Pourquoi l'odorat a un accès privilégié à la mémoire et aux émotions.",
  "tag": "Informer",
  "body": [
   "Dans « Du côté de chez Swann », Marcel Proust raconte comment une madeleine trempée dans du thé fait resurgir tout un pan de son enfance. Les chercheurs ont repris son nom : on parle d'« effet Proust » quand une odeur déclenche le souvenir d'un épisode personnel marquant. La psychologue américaine Rachel Herz a consacré une grande partie de ses travaux à tester cette intuition littéraire. Ses résultats, et ceux d'autres équipes, dessinent un tableau plus précis que la légende, avec des points solides et des nuances importantes.",
   "Une première raison est anatomique. Pour la vue, l'ouïe ou le toucher, l'information passe d'abord par le thalamus, une sorte de gare de triage, avant d'atteindre le cortex. L'odorat fait exception. Depuis le bulbe olfactif, les signaux rejoignent directement le cortex olfactif primaire, puis l'amygdale, qui traite les émotions, et l'hippocampe, essentiel à la mémoire des événements, sans détour préalable par le thalamus. Cette proximité expliquerait pourquoi une odeur peut faire surgir émotion et souvenir presque instantanément. L'explication est plausible et largement admise, mais l'apprentissage joue aussi un rôle central : une odeur tire sa force des moments auxquels elle a été associée.",
   "Les expériences confirment surtout la charge émotionnelle. Dans une étude de 2004, Rachel Herz a présenté les mêmes indices (feu de camp, herbe coupée, pop-corn) sous forme d'odeur, d'image ou de son. Les souvenirs rappelés par les odeurs étaient plus émotionnels et plus évocateurs, mais pas plus nets ni plus précis. La même année, une étude d'imagerie a montré une activation plus forte de l'amygdale et de régions de l'hippocampe face à un parfum associé à un souvenir personnel. Elle ne portait que sur cinq femmes : c'est un indice, pas une démonstration.",
   "Les odeurs semblent aussi ouvrir l'accès à des souvenirs plus anciens. En 2006, deux chercheurs suédois ont demandé à 93 personnes âgées d'évoquer un souvenir à partir d'un mot, d'une image ou d'une odeur. Les souvenirs liés aux odeurs remontaient surtout à la première décennie de vie, avant 10 ans, alors que les autres dataient plutôt de 11 à 20 ans. Ils s'accompagnaient d'un sentiment plus fort d'être ramené dans le passé. Attention : toutes les odeurs ne réveillent pas de bons souvenirs. Elles peuvent aussi raviver des expériences douloureuses, notamment après un traumatisme."

   "L'odorat est un sens plastique : son fonctionnement se modifie avec l'exposition répétée aux odeurs. En 2009, le chercheur allemand Thomas Hummel et ses collègues en ont tiré une méthode simple, l'entraînement olfactif. Des personnes ayant perdu une partie de leur odorat ont senti, deux fois par jour pendant 12 semaines, quatre odeurs intenses : rose, eucalyptus, citron et clou de girofle. Les 40 participants entraînés ont amélioré leurs scores aux tests d'odorat, contrairement aux 16 personnes non entraînées. L'étude n'était pas randomisée (les groupes n'étaient pas tirés au sort), mais elle a ouvert tout un champ de recherche.",

 {

  "title": "L'odeur de l'autre : gènes, liens et mythe des phéromones",
  "excerpt": "Chacun porte une odeur qui lui est propre. Gènes immunitaires, liens affectifs, phéromones : ce qui est établi, ce qui reste discuté et ce qui relève du mythe.",
  "tag": "Informer",
  "body": [
   "Chaque personne possède une odeur corporelle singulière, façonnée par de nombreux facteurs encore mal démêlés, dont une part génétique. Cette odeur semble jouer un rôle social. En 2022, une équipe israélienne a comparé les odeurs corporelles de paires d'amis du même sexe, sans relation amoureuse. Un nez électronique et des évaluateurs humains ont conclu que les amis sentaient plus semblable que des paires formées au hasard. Mieux : lors de rencontres entre inconnus, les duos à l'odeur proche avaient des échanges plus positifs. Il y aurait donc bien un peu de « chimie » dans l'amitié, au sens propre.",
   "Une piste célèbre concerne le complexe majeur d'histocompatibilité (CMH), appelé HLA chez l'humain : un ensemble de gènes qui aident le système immunitaire à reconnaître les intrus. En 1995, le biologiste suisse Claus Wedekind a demandé à des étudiants de porter le même tee-shirt deux nuits de suite. Des étudiantes ont ensuite évalué l'odeur des tee-shirts. Elles jugeaient plus agréables les odeurs des hommes dont le CMH différait du leur. L'hypothèse évolutive : cette préférence aiderait à transmettre des défenses immunitaires plus variées. L'étude a eu un immense écho dans les médias.",
   "Vingt-cinq ans plus tard, le bilan est nettement plus réservé. En 2020, une série de méta-analyses a passé en revue les études disponibles. Elle ne trouve pas de lien significatif entre différence de CMH et préférence d'odeur, ni entre différence de CMH et choix du partenaire dans des couples réels. Les auteurs relèvent aussi, dans une partie de ces travaux, des signes de biais de publication, c'est-à-dire une tendance à publier plus volontiers les résultats positifs. Ils réclament des échantillons plus grands et plus divers. L'idée d'un nez qui choisirait selon nos gènes immunitaires reste séduisante, mais elle n'est pas confirmée.",
   "Et les phéromones ? Chez l'animal, ce sont des signaux chimiques qui déclenchent une réponse précise chez les membres de la même espèce. Chez l'humain, quatre molécules dérivées de stéroïdes ont été présentées comme phéromones, dont l'androstadiénone et l'estratétraénol. Selon une revue critique de 2015, aucune preuve solide ne le confirme : petits échantillons, effets surestimés, biais de publication, manque de réplication. Une étude en double aveugle de 2017 n'a trouvé aucun effet de ces deux molécules sur l'évaluation de visages. Une des pistes les plus sérieuses concerne les bébés : une sécrétion de l'aréole des mères qui allaitent stimule la tétée de n'importe quel nourrisson."

 {
  "salon": "Le Toucher",
  "title": "Les fibres de la caresse : pourquoi un geste lent fait du bien",
  "excerpt": "Notre peau abrite des fibres nerveuses réglées pour les caresses lentes et tièdes. Ce qu'on sait d'elles, et ce qu'elles disent du plaisir d'être touché.",
  "tag": "Informer",
  "body": [
   "Quand une main glisse doucement sur votre avant-bras, deux messages partent vers le cerveau. Le premier est rapide et précis : il indique où se trouve le contact, quelle est sa pression, dans quelle direction il avance. Il circule dans des fibres nerveuses entourées de myéline, une gaine isolante qui accélère l'influx. Le second est lent et discret. Il emprunte des fibres sans myéline appelées afférences C-tactiles, ou fibres CT. Une afférence est simplement une fibre qui transporte une information de la peau vers le système nerveux. Celles-ci ne servent pas à reconnaître un objet : elles semblent surtout signaler la douceur d'un contact.",
   "Ces fibres, d'abord découvertes chez le chat, ont longtemps intrigué. En 2002, l'équipe suédoise de Håkan Olausson étudie une personne qui a perdu les grosses fibres myélinisées du toucher. Quand on effleure sa peau, elle ne perçoit presque rien de précis, mais décrit une vague sensation agréable. L'imagerie cérébrale montre alors une activation de l'insula, une région du cortex qui participe à la perception de l'état intérieur du corps et des émotions, sans activation nette des aires classiques du toucher. Les auteurs parlent d'un toucher « limbique », tourné vers l'émotion plutôt que vers l'analyse.",
   "En 2009, la même équipe enregistre directement l'activité de ces fibres chez des volontaires, grâce à la microneurographie : une électrode très fine est glissée dans un nerf du bras. On caresse la peau avec un pinceau doux à différentes vitesses. Les fibres C-tactiles répondent le plus fort entre 1 et 10 centimètres par seconde, et ce sont justement ces vitesses que les participants jugent les plus agréables. Plus lent ou plus rapide, l'agrément diminue. Les fibres myélinisées se comportent autrement : leur activité augmente simplement avec la vitesse du geste.",
   "Une étude de 2014 ajoute un ingrédient : la température. Une sonde pilotée par ordinateur caresse l'avant-bras à 18, 32 ou 42 °C, et à cinq vitesses. Les fibres C-tactiles répondent le mieux à un geste lent à 32 °C, une température proche de celle de la peau. Et c'est seulement à cette température que leur activité suit le plaisir déclaré par les participants. Ces fibres semblent donc accordées à une caresse lente donnée par une autre peau. On les trouve dans la peau velue, comme l'avant-bras ou le dos ; elles sont rares, voire absentes, dans la paume des mains.",
   "Faut-il les appeler « fibres du plaisir » ? Une revue publiée en 2023 invite à la nuance. Les fibres C-tactiles soutiennent bien le toucher doux et affectif, mais toute expérience tactile chargée d'émotion ne passe pas par elles, et un contact qui les active n'est pas forcément agréable. Le contexte pèse lourd : qui touche, à quel endroit, dans quelle relation, avec quelles attentes. La caresse lente offre au cerveau un signal favorable. C'est ensuite lui qui décide si ce contact fait du bien."
  ],
  "plaisir": "Le signal des fibres C-tactiles rejoint l'insula, où se construit une image de l'état du corps et de sa tonalité émotionnelle. Une caresse lente y est traitée comme une information sur notre bien-être, plus que comme la description d'un objet. Dans l'étude de 2014, plus ces fibres déchargeaient à la bonne température, plus la caresse était jugée agréable : le lien entre signal nerveux et plaisir se mesure dès la peau. Mais ce signal ne suffit pas. Le cerveau le combine avec le contexte, la relation et l'attention pour décider si le contact est bienvenu.",
