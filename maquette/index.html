  "title": "Le Tirukkural de Thiruvalluvar : la sagesse tamoule en 1 330 distiques",
  "excerpt": "Vertu, richesse et amour en 1 330 vers de deux lignes : un classique tamoul révéré en Inde du Sud, traduit en français dès le XIXe siècle et encore trop peu lu en Europe.",
  "tag": "Informer",
  "repere": "Pays tamoul (Inde du Sud) · entre le Ier s. av. et le VIe s. apr. J.-C.",
  "body": [
   "Le Tirukkural, souvent abrégé en Kural, est l'œuvre la plus célèbre de la littérature tamoule. Le tamoul est une langue dravidienne, c'est-à-dire d'une famille distincte du sanskrit, parlée surtout au Tamil Nadu, au Sri Lanka et dans une large diaspora. Le titre signifie à peu près « les distiques sacrés ». Le livre compte 1 330 kurals, des distiques très brefs de deux lignes, regroupés en 133 chapitres de dix. Il appartient à un ensemble de dix-huit œuvres morales de la littérature tamoule ancienne. Son influence sur la culture tamoule est immense, au point que le portrait du poète orne jusqu'aux bus de Chennai.",
   "On l'attribue au poète Thiruvalluvar, dont on ne sait presque rien. La tradition le fait vivre à Mylapore, aujourd'hui un quartier de Chennai, avec son épouse Vasuki, et en fait un tisserand d'humble origine. Sa religion même est discutée : il était peut-être un ascète jaïn, mais bouddhistes et shivaïtes le revendiquent aussi, et le texte, qui invoque un « Dieu primordial » sans le nommer, se prête à ces lectures. Sa date est tout aussi incertaine : l'Encyclopædia Britannica évoque le VIe siècle de notre ère, tandis que d'autres spécialistes proposent une date beaucoup plus haute, jusqu'au Ier siècle avant notre ère.",
   "Le livre se divise en trois parties. La première, aram (la vertu), traite de la vie de famille, de l'hospitalité, de la parole aimable, de la gratitude, du refus de tuer et de mentir. La deuxième, porul (la richesse, au sens de la vie publique), parle du bon gouvernement, de l'étude, de l'amitié, de la prospérité et de la guerre ; elle relie la bonne citoyenneté à une vie privée vertueuse. La troisième, kamam (l'amour), évoque l'amour secret puis l'amour conjugal, en partie sous la forme d'un dialogue entre époux. Le ton reste concret : le Kural donne des conseils pour la vie quotidienne plus qu'il ne développe une doctrine.",
   "Les impératifs majeurs du Kural sont de ne pas tuer et de ne pas mentir. Il invite à la compassion envers tous, sans distinction de caste ni de croyance, et affirme que la grandeur ne vient pas de la naissance. Il célèbre l'étude : comme un puits creusé dans le sable donne d'autant plus d'eau qu'il est profond, le savoir jaillit à proportion de ce que l'on a appris (distique 396). Il insiste sur la douceur de la parole et sur la gratitude. Le bien, enfin, y est sa propre récompense, et non un simple moyen d'obtenir une vie heureuse après la mort.",
   "Le Kural a voyagé tôt hors de l'Inde : des extraits paraissent en anglais dès 1794, des fragments en français en 1848, une traduction allemande de Karl Graul en 1856, puis la version anglaise complète de G. U. Pope en 1886. Le monde tamoul francophone, de Pondichéry à La Réunion et à l'île Maurice, l'a beaucoup traduit et célébré. Pour le lire, on peut parcourir un chapitre par jour. En français, l'indianiste François Gros a traduit Le Livre de l'amour (Gallimard, 1992) ; une édition trilingue tamoul-français-anglais de Sathasivam Sébastien Sachchithanantham est parue chez L'Harmattan en 2024."

  "title": "Les Pensées de Marc Aurèle : un empereur qui écrit pour lui-même",
  "excerpt": "Entre guerres et épidémie, l'homme le plus puissant de Rome tient des carnets en grec pour se corriger. Comment lire ces notes stoïciennes qui n'étaient pas écrites pour nous ?",
  "tag": "Éduquer",
  "repere": "Empire romain, frontière du Danube · vers 170-180",
  "body": [
   "Marc Aurèle, né en 121, devient empereur de Rome en 161 et règne jusqu'à sa mort en 180. Son règne est marqué par des guerres contre les peuples germaniques, des révoltes et une grande épidémie de peste. C'est en partie pendant ses campagnes militaires, dans les dernières années de sa vie, qu'il rédige des notes en grec, la langue de la philosophie dans le monde romain. Deux brèves mentions, glissées entre les premiers livres, situent l'écriture « chez les Quades, au bord du Granua », une rivière de l'actuelle Slovaquie, et « à Carnuntum », un camp romain sur le Danube, dans l'actuelle Autriche.",
   "Le titre « Pensées » ou « Méditations » est moderne : il vient d'un éditeur du XVIIe siècle, Méric Casaubon. Le texte semble inconnu dans l'Antiquité. Les premières mentions sont byzantines : un dictionnaire, la Souda, vers l'an 900, puis l'évêque Aréthas, au Xe siècle, qui parle des écrits « à lui-même » (ta eis heauton). Les spécialistes s'accordent aujourd'hui à penser que Marc Aurèle écrivait pour son propre progrès moral, sans intention de publier. Le stoïcien Épictète, qu'il admirait, conseillait de noter chaque jour les réponses à avoir face aux situations, pour les garder « sous la main ». Ce sont donc des exercices, pas un traité : d'où les répétitions, les formules frappantes et l'absence de plan.",
   "Le livre I, à part, est une longue liste de gratitude : Marc Aurèle y remercie ses proches et ses maîtres pour ce qu'ils lui ont appris. Les onze autres livres reviennent sans cesse sur quelques thèmes : la brièveté de la vie et l'imminence de la mort, la patience envers les autres, l'acceptation de ce qui arrive, le devoir d'agir pour le bien commun. Chaque matin, se dit-il au début du livre II, je rencontrerai des indiscrets, des ingrats, des insolents, des envieux ; mais ils sont mes parents par l'esprit, et nous sommes faits pour coopérer, comme les pieds, les mains ou les paupières.",
   "Ces notes appliquent à la vie quotidienne la philosophie stoïcienne, une école grecque fondée vers 300 avant notre ère. Le bonheur réside dans la vertu, qui dépend entièrement de nous ; les événements extérieurs ne sont ni bons ni mauvais en eux-mêmes, et c'est l'opinion que nous en avons qui nous trouble. D'où les injonctions répétées : « efface l'impression », « ne fais rien au hasard ». Le monde est gouverné par une providence, et il est comme une cité dont tous les humains sont citoyens. Le philosophe Pierre Hadot a montré qu'il s'agit d'« exercices spirituels » destinés à transformer le regard. Marc Aurèle cite pourtant volontiers d'autres écoles, comme Épicure.",
   "Faut-il y voir un manuel de développement personnel ? Les spécialistes invitent à la prudence. Ces notes n'étaient pas destinées à être lues : leurs allusions restent souvent obscures, et le vocabulaire stoïcien n'y est jamais expliqué. On ignore si l'ordre des livres et des chapitres suit la chronologie, un plan, ou rien de tout cela. Le philosophe Pierre Vesperini, auteur de Droiture et mélancolie (Verdier, 2016), interroge ainsi l'idée que ces pensées formeraient un guide de vie prêt à l'emploi. Et l'homme qui s'exhorte à la douceur reste un empereur qui mène des guerres. Lire Marc Aurèle, c'est aussi garder cet écart en tête.",
   "Pour une première lecture, la traduction de Mario Meunier (Garnier-Flammarion), simple et peu coûteuse, convient bien. Le livre de Pierre Hadot, La Citadelle intérieure (Fayard, 1992 ; Le Livre de Poche), est la meilleure introduction pour comprendre la logique de ces exercices. Les curieux trouveront le texte grec sur Wikisource, ainsi que la traduction d'Auguste Couat (1904), en accès libre. Le mieux est de lire peu à la fois, un chapitre par jour, à la manière de l'auteur : par fragments, pour se rappeler l'essentiel au moment où l'on en a besoin."

  "excerpt": "Vers 1615, un noble andin écrit et dessine une chronique qui dénonce les abus coloniaux. Oublié pendant trois siècles à Copenhague, le manuscrit est aujourd'hui en ligne.",

  "repere": "Pérou · vers 1615",
  "body": [
   "Felipe Guaman Poma de Ayala naît vers le milieu du XVIe siècle dans une famille de la noblesse andine de la région de Lucanas, dans l'actuel Pérou, peu après la conquête espagnole. Il parle quechua et espagnol, travaille comme interprète auprès d'ecclésiastiques et d'administrateurs, et voit de près le fonctionnement du système colonial.",
   "Vers 1615, il achève une œuvre immense : la Nueva corónica y buen gobierno, une « nouvelle chronique et bon gouvernement » adressée au roi d'Espagne Philippe III. Le manuscrit compte près de 1 200 pages et environ 400 dessins à la plume. Il raconte l'histoire du monde andin avant les Incas, sous les Incas et après la conquête, puis propose une réforme du gouvernement colonial.",
   "Le cœur du livre est une dénonciation. Dessins à l'appui, Guaman Poma montre les violences et les abus commis par des prêtres, des colons et des fonctionnaires contre les populations andines. Il défend l'idée d'un Pérou gouverné par ses propres élites autochtones, sous l'autorité du roi. Une formule revient comme un refrain de lassitude : « et il n'y a pas de remède ».",
   "On ignore si le roi a jamais lu le manuscrit. Il réapparaît en 1908 à la Bibliothèque royale de Copenhague, où l'érudit allemand Richard Pietschmann le signale. Publié en fac-similé en 1936, il est aujourd'hui entièrement numérisé et consultable en ligne. L'historienne Rolena Adorno y voit l'un des grands textes d'écriture et de résistance de l'époque coloniale.",
   "Pour un lecteur d'aujourd'hui, la Nueva corónica est une leçon : face à l'injustice, un homme seul a choisi d'écrire et de dessiner, longuement, patiemment, pour que la vérité de son peuple atteigne le pouvoir."

  "excerpt": "Des centaines de milliers de vers, transmis par des conteurs inspirés, les manastchy : la trilogie de Manas raconte l'histoire, la mémoire et les valeurs du peuple kirghiz.",

  "body": [
   "Manas est l'épopée nationale des Kirghiz, peuple d'Asie centrale. Elle forme une trilogie : Manas, le héros qui unit les tribus kirghizes et les défend contre leurs ennemis ; Semetey, son fils ; et Seytek, son petit-fils. En 2013, l'UNESCO a inscrit cette trilogie épique sur la Liste représentative du patrimoine culturel immatériel de l'humanité.",

 {
  "salon": "Méditation & pleine conscience",
  "title": "Qu'est-ce que méditer ? Les grandes familles de pratiques",
  "excerpt": "Fixer son souffle, observer ce qui passe, cultiver la bienveillance, interroger le « moi » : les chercheurs rangent les méditations en grandes familles. Le tour du sujet.",
  "tag": "Éduquer",
  "repere": "Monde · classifications de 2008 à 2019",
  "body": [
   "Le mot « méditation » recouvre des gestes très différents : réciter un mantra en Inde, compter ses respirations dans un temple zen, répéter une courte prière chez les moines orthodoxes, visualiser une divinité au Tibet. Pour comparer ces pratiques en laboratoire, des chercheurs ont proposé des classements. En 2008, Antoine Lutz, Heleen Slagter, John Dunne et Richard Davidson, alors à l'université du Wisconsin, décrivent la méditation comme une famille d'entraînements à la régulation de l'attention et des émotions. Ils ne prétendent pas résumer chaque tradition, ni dire laquelle est la meilleure. Leur but est plus modeste : disposer de catégories assez précises pour savoir de quoi l'on parle quand on étudie « la méditation ».",
   "Ils distinguent deux grands styles. Dans l'attention focalisée, on choisit un objet, par exemple les sensations du souffle, un son ou un mot, et on y maintient l'attention. L'esprit s'échappe, c'est normal : l'exercice consiste à remarquer la distraction puis à revenir à l'objet, sans se juger. Dans l'observation ouverte, il n'y a pas d'objet fixe. On observe, moment après moment, tout ce qui se présente, sons, sensations ou pensées, sans réagir ni s'y accrocher. Selon ces auteurs, on commence souvent par la première pour calmer l'esprit, avant de glisser vers la seconde. Les deux styles existent dans le zen, la vipassana et le bouddhisme tibétain.",
   "En 2015, Cortland Dahl, Antoine Lutz et Richard Davidson élargissent le tableau. Ils réunissent ces deux styles dans une famille « attentionnelle », dont le ressort principal est la méta-conscience : la capacité à remarquer ce que fait l'esprit pendant qu'il le fait. Ils ajoutent une famille « constructive », qui cherche à cultiver des façons de penser et de ressentir favorables au bien-être. On y trouve la bienveillance aimante, la compassion, certaines visualisations tibétaines ou des formes de prière contemplative. Son mécanisme principal est le changement de perspective : apprendre à se regarder soi-même et à regarder les autres autrement, par exemple avec plus de chaleur et moins de jugement.",
   "La troisième famille est dite « déconstructive ». Elle repose sur l'auto-investigation, c'est-à-dire l'examen attentif de la façon dont naissent les perceptions, les émotions et les pensées. L'idée est de constater que nos représentations ne sont pas la réalité elle-même, et que le « moi » n'est peut-être pas aussi solide qu'il en a l'air. Les auteurs y rangent la vipassana, la méditation analytique tibétaine, les kôans du zen (des énigmes qui déroutent la logique ordinaire) et des pratiques dites non duelles : le dzogchen tibétain, le shikantaza du zen sôtô, l'auto-investigation de l'Advaita Vedanta indien ou la muraqaba des soufis.",
   "Ces classements ont des limites, et leurs auteurs le disent : beaucoup de pratiques mêlent les trois familles, et l'on classe chacune selon son mécanisme dominant. D'autres chercheurs ont procédé autrement. En 2019, Karin Matko et Peter Sedlmeier ont demandé à 100 méditants expérimentés de comparer 20 techniques. Il en ressort sept groupes, de l'observation attentive à la méditation en mouvement, organisés selon la place donnée au corps et le degré d'activation. Enfin, une méta-analyse de 2016, c'est-à-dire une synthèse statistique de nombreuses études, a recensé 78 travaux d'imagerie cérébrale : attention focalisée, mantra, observation ouverte et bienveillance n'activent pas les mêmes régions. Méditer n'est donc pas une seule chose."
  ],

   "« Méditer » désigne une famille de pratiques qui entraînent l'attention et les émotions, pas une technique unique.",
   "L'attention focalisée ramène sans cesse l'esprit vers un objet ; l'observation ouverte accueille ce qui se présente sans s'y accrocher.",
   "Les méditations constructives, comme la bienveillance aimante, cultivent de nouvelles manières de se voir et de voir autrui.",
   "Les méditations déconstructives interrogent la nature des perceptions, des pensées et du « moi ».",

  "salon": "Méditation & pleine conscience",
  "title": "Ce que la méditation change dans le cerveau : l'état des preuves en 2026",
  "excerpt": "Matière grise qui grossit, cerveau qui rajeunit ? Les essais les plus rigoureux tempèrent ces promesses. Ce que l'on sait, ce que l'on ignore, et pourquoi c'est si difficile.",
  "tag": "Informer",
  "repere": "Neurosciences · 2000-2026",
  "body": [
   "Depuis le début des années 2000, l'IRM (imagerie par résonance magnétique), qui photographie le cerveau sans l'ouvrir, sert à chercher les traces de la méditation. Deux types de mesures dominent. Les mesures structurelles évaluent l'anatomie : volume ou densité de la matière grise, là où se trouvent les corps des neurones, ou épaisseur du cortex. Les mesures fonctionnelles observent quelles régions s'activent. En 2011, une petite étude de Britta Hölzel a eu un grand retentissement : après le programme MBSR de huit semaines, 16 participants montraient une densité de matière grise accrue dans l'hippocampe, une région liée à la mémoire, par rapport à 17 personnes restées sur liste d'attente.",
   "En 2014, Kieran Fox et ses collègues rassemblent 21 études d'imagerie portant sur environ 300 méditants. Ils repèrent huit régions qui diffèrent régulièrement chez eux, dont le cortex frontopolaire, associé à la méta-conscience, l'insula, liée à la perception du corps, l'hippocampe et le cortex cingulaire. L'effet moyen est jugé « moyen ». Mais les auteurs soulignent eux-mêmes un fort risque de biais de publication, c'est-à-dire que les résultats positifs sont plus souvent publiés, ainsi que des faiblesses de méthode. Surtout, la plupart de ces études comparent des méditants de longue date à des non-méditants. Elles montrent une différence, pas une cause : les deux groupes peuvent différer pour bien d'autres raisons.",
   "Les essais randomisés, où l'on tire au sort qui méditera, répondent mieux à la question de la cause. Or les plus solides sont décevants pour l'anatomie. En 2022, Tammi Kral et l'équipe de Richard Davidson, pourtant pionnière de ces recherches, publient deux essais combinés : 218 débutants répartis entre le MBSR, un programme témoin actif conçu pour être aussi engageant, et une liste d'attente. Après huit semaines, aucun changement de volume, de densité ou d'épaisseur de matière grise n'est attribuable au MBSR. La même année, l'essai français Age-Well, mené chez 137 personnes de 65 ans et plus, ne trouve pas d'effet de 18 mois de méditation sur le volume de l'insula et du cortex cingulaire antérieur.",
   "Ces résultats ne disent pas que la méditation est sans effet. Dans Age-Well, ceux qui méditaient progressaient davantage que ceux qui apprenaient l'anglais sur un score combinant régulation de l'attention, capacités socio-émotionnelles et connaissance de soi. Une analyse publiée en 2025 suggère aussi que 25 méditants âgés pratiquant depuis plus de vingt ans ont un cerveau qui paraît plus jeune que leur âge, selon un modèle d'apprentissage automatique entraîné sur des images cérébrales. Mais les 18 mois d'entraînement ne produisaient pas cet effet chez les novices, et ces experts ont pu être différents dès le départ. En l'état, les comportements semblent changer plus vite et plus sûrement que l'anatomie mesurable.",
   "Pourquoi ce domaine est-il si difficile ? En 2018, quinze chercheurs, dont plusieurs spécialistes reconnus de la méditation, publient un article intitulé « Mind the Hype » (« Gare à l'emballement »). Ils rappellent que la « pleine conscience » est mal définie et détaillent les pièges de méthode : mesures fragiles, comparaisons insuffisantes, effets indésirables négligés, interprétation hâtive des images cérébrales. Le cas d'une méta-analyse de 2023, qui concluait à des changements de structure après des essais randomisés, l'illustre : la revue Scientific Reports l'a rétractée en 2025. Le bilan raisonnable en 2026 est donc prudent : des différences chez les pratiquants expérimentés, pas de changement anatomique démontré après quelques semaines, et beaucoup de questions ouvertes."

  "body": [
   "En 1979, Jon Kabat-Zinn ouvre une clinique de réduction du stress à l'école de médecine de l'université du Massachusetts, à Worcester. Docteur en biologie moléculaire du MIT, il pratique depuis des années la méditation auprès de maîtres zen et à l'Insight Meditation Society, un centre de vipassana. Son idée : proposer la pleine conscience sans cadre religieux, comme un entraînement de l'attention, à des patients que la médecine soulage mal. Dans son premier article, en 1982, il décrit 51 personnes souffrant de douleurs chroniques suivies pendant un programme de dix semaines. Leur douleur diminue nettement, mais l'étude n'a pas de groupe de comparaison, une limite qu'il signale lui-même.",
   "Le programme prend le nom de MBSR (Mindfulness-Based Stress Reduction, réduction du stress fondée sur la pleine conscience) et se fixe à huit séances hebdomadaires en groupe. On y pratique la méditation assise, le balayage corporel, qui consiste à promener l'attention dans tout le corps, et des mouvements doux, avec des exercices quotidiens à la maison. Que vaut-il ? En 2023, une méta-analyse, c'est-à-dire une synthèse statistique, a réuni les données individuelles de 13 essais et de 2 371 adultes de la population générale. Ces programmes de groupe réduisent la détresse psychologique, de façon petite à modérée, par rapport à l'absence d'intervention. Une revue de 2014 (Goyal et coll.) notait déjà qu'ils ne font pas mieux que d'autres traitements actifs.",
   "La MBCT (Mindfulness-Based Cognitive Therapy, thérapie cognitive fondée sur la pleine conscience) est mise au point dans les années 1990 par Zindel Segal, Mark Williams et John Teasdale. Elle combine la structure du MBSR avec des outils de la thérapie cognitive. Sa cible est précise : la rechute chez des personnes qui ont déjà connu plusieurs épisodes dépressifs et qui vont mieux. Il s'agit d'apprendre à repérer tôt les ruminations, ces pensées qui tournent en boucle quand l'humeur baisse, et à s'en décentrer. Le premier essai, publié en 2000 avec 145 patients, réduit les rechutes chez ceux qui avaient connu au moins trois épisodes, mais pas chez ceux qui n'en avaient connu que deux.",
   "En 2016, Willem Kuyken et ses collègues rassemblent les données individuelles de 9 essais randomisés, soit 1 258 patients en rémission, c'est-à-dire sortis de l'épisode dépressif. Sur environ 60 semaines, le risque de rechute baisse d'environ 31 % chez ceux qui ont suivi la MBCT par rapport à ceux qui ne l'ont pas suivie. Comparée à d'autres traitements actifs, dont les antidépresseurs d'entretien, la MBCT réduit encore ce risque d'environ 21 %. Le bénéfice semble plus net chez les personnes qui gardent des symptômes résiduels. Ces chiffres sont des moyennes : ils ne disent pas qu'il faut arrêter un traitement, décision qui se prend toujours avec son médecin.",

  "excerpt": "Dix jours de silence, dix heures de méditation par jour : les cours de S. N. Goenka ont popularisé une pratique ancrée dans un texte bouddhique ancien, le Satipaṭṭhāna Sutta.",

  "body": [
   "Vipassanā est un mot pāli, la langue des textes du bouddhisme theravāda, celui du Sri Lanka et de l'Asie du Sud-Est. On le traduit par « vision claire » ou « vision pénétrante » : voir les choses telles qu'elles sont. Le texte de référence est le Satipaṭṭhāna Sutta, le « discours sur l'établissement de l'attention », conservé dans le recueil des discours de longueur moyenne (Majjhima Nikāya, n° 10). Selon le texte, le Bouddha l'enseigne dans le pays des Kuru, au nord de l'Inde. Il s'ouvre sur une promesse : ces quatre façons d'établir l'attention mènent à la purification des êtres, au dépassement du chagrin, à la fin de la douleur et à l'extinction, le nibbāna.",
   "Le sutta décrit quatre domaines d'attention. Le corps d'abord : le souffle, les postures (marcher, se tenir debout, s'asseoir, s'allonger), les gestes du quotidien, les parties du corps. Puis les vedanā, souvent traduites par « sensations » : le texte demande de reconnaître si ce que l'on ressent est agréable, désagréable ou neutre. Viennent ensuite les états d'esprit, avec ou sans avidité, avec ou sans colère, et enfin les dhamma, ici des grilles pour analyser l'expérience, comme les obstacles à la méditation ou les facteurs d'éveil. Un refrain revient sans cesse : observer comment chaque phénomène apparaît et disparaît, sans s'attacher à rien dans le monde.",
   "La forme la plus répandue aujourd'hui vient de Birmanie (Myanmar). À la fin du XIXe siècle, sous la domination britannique, le moine Ledi Sayadaw (1846-1923) simplifie l'enseignement de la méditation et l'ouvre largement aux laïcs ; l'historien Erik Braun y voit en partie une réponse aux bouleversements coloniaux. Une lignée de maîtres laïcs en découle : Saya Thetgyi, un riche cultivateur, puis Sayagyi U Ba Khin, premier comptable général de la Birmanie indépendante, qui ouvre en 1952 un centre international de méditation à Rangoun. Satya Narayan Goenka, né en Birmanie dans une famille d'origine indienne, y apprend la technique pendant quatorze ans, puis commence à l'enseigner en Inde en 1969. Il meurt en 2013.",
   "Les cours de dix jours « dans la tradition de Sayagyi U Ba Khin » ont lieu aujourd'hui sur tous les continents. Le cadre est strict : lever à 4 heures, environ dix heures de méditation par jour, silence complet entre participants pendant neuf jours, hommes et femmes séparés, cinq préceptes à respecter (ne pas tuer, ne pas voler, ni relation sexuelle, ni mensonge, ni intoxicant). Les trois premiers jours et demi sont consacrés à ānāpāna, l'observation du souffle naturel. Vient ensuite vipassana proprement dite : parcourir le corps et observer ses sensations avec équanimité, sans réagir. Le dixième jour, on apprend mettā, la bienveillance. Les cours fonctionnent uniquement grâce aux dons d'anciens participants.",
   "Que sait-on des effets ? Les études restent rares. En 2015, une équipe australienne a suivi 122 participants à un cours de dix jours, comparés à 50 personnes inscrites qui n'avaient pas encore commencé. Après le cours, le stress perçu baissait et le bien-être augmentait ; une partie des gains persistait six mois plus tard. Mais la comparaison n'était pas tirée au sort et tout reposait sur des questionnaires. Le cadre intensif n'est pas anodin : l'organisation elle-même prévient que d'anciens troubles psychiques peuvent resurgir pendant ou après le cours, et déconseille parfois ces retraites aux personnes ayant de lourds antécédents. La méditation n'y est pas présentée comme une thérapie."

  "salon": "Méditation & pleine conscience",
  "title": "Mettā : cultiver la bienveillance, entre tradition bouddhique et laboratoire",
  "excerpt": "« Que tous les êtres soient heureux » : née dans le bouddhisme ancien, la méditation de bienveillance aimante est aujourd'hui étudiée par les psychologues. Ce qu'on en sait.",
  "tag": "Éduquer",
  "repere": "Inde ancienne · canon pāli",
  "body": [
   "Mettā est un mot pāli que l'on traduit par « bienveillance aimante » ou « amitié bienveillante ». Dans le bouddhisme ancien, c'est la première des quatre « demeures divines » (brahmavihāra), avec karuṇā, la compassion devant la souffrance, muditā, la joie pour le bonheur d'autrui, et upekkhā, l'équanimité. Le court Mettā Sutta, conservé dans le Sutta Nipāta, un recueil du canon pāli, en donne l'esprit : souhaiter que tous les êtres, faibles ou forts, grands ou petits, proches ou lointains, nés ou à naître, soient heureux et en sécurité. Il invite aussi à ne tromper ni mépriser personne, et à ne souhaiter de mal à personne, même sous la provocation.",
   "La méthode classique est détaillée au Ve siècle par le commentateur Buddhaghosa, qui travaillait au Sri Lanka, dans le Visuddhimagga (« Chemin de la pureté »). On commence par soi-même, en répétant intérieurement des souhaits comme « Puissé-je être heureux et libre de souffrance ». On étend ensuite ces souhaits à une personne respectée, à un ami cher, à une personne neutre, puis à quelqu'un d'hostile. Le texte déconseille de commencer par une personne détestée, qui réveillerait la colère. Le but est d'effacer les « barrières » entre les personnes, jusqu'à ne plus préférer personne. On peut enfin rayonner la bienveillance vers tous les êtres, dans toutes les directions.",
   "Les psychologues s'y intéressent depuis les années 2000. En 2008, l'équipe de Barbara Fredrickson, à l'université de Caroline du Nord, recrute 139 salariés d'une entreprise informatique de Detroit. La moitié, tirée au sort, suit six séances de groupe d'une heure sur sept semaines et pratique à la maison ; l'autre moitié attend son tour. Les pratiquants rapportent peu à peu plus d'émotions positives au quotidien, puis davantage de ressources personnelles, comme le sens donné à sa vie, le soutien social ou moins de symptômes physiques, elles-mêmes liées à une meilleure satisfaction de vie. Les auteurs notent les limites : effets modestes, mesures déclaratives, groupe témoin en simple attente, participants surtout blancs et diplômés.",
   "En 2011, Stefan Hofmann, Paul Grossman et Devon Hinton passent en revue les travaux sur la bienveillance aimante et la méditation de compassion. Ils concluent à une hausse des émotions positives et à une baisse des émotions négatives, avec des pistes encore préliminaires sur le stress, l'imagerie cérébrale et l'usage clinique, par exemple en complément d'une thérapie cognitive et comportementale. En 2014, une méta-analyse, c'est-à-dire une synthèse statistique, de 22 essais randomisés trouve des effets modérés sur les symptômes dépressifs et la compassion par rapport à l'absence d'intervention, mais des résultats peu concluants face à des groupes témoins actifs. Elle juge la qualité des études faible à moyenne et note que la pratique peut d'abord être difficile pour certains.",
   "Ce dernier point rejoint l'expérience des pratiquants. Se souhaiter du bien n'est pas évident pour tout le monde, et penser à une personne difficile peut raviver colère ou tristesse : c'est pourquoi la tradition prévoit une progression prudente. Dans les textes bouddhiques, mettā n'est pas une technique de bien-être isolée. Le Mettā Sutta l'associe à une conduite droite et à la recherche de la libération. Les programmes laïques en retiennent surtout l'entraînement émotionnel. Les deux lectures peuvent cohabiter, à condition de respecter le sens que la tradition donne à la pratique et de ne pas promettre plus que ce que montrent les études."

  "title": "Le souffle dans le yoga : Patañjali, les Yoga Sūtra et le prāṇāyāma",
  "excerpt": "Dans les Yoga Sūtra, la maîtrise du souffle n'est qu'un des huit membres du yoga. Retour aux textes, aux techniques plus tardives et à ce qu'en dit la science, avec prudence.",

  "repere": "Inde · vers 400 apr. J.-C.",
  "body": [
   "Les Yoga Sūtra sont un recueil d'environ 195 aphorismes très brefs, en sanskrit, répartis en quatre chapitres. La tradition les attribue à Patañjali, dont on ne sait presque rien. Leur date a longtemps fait débat. Selon l'indianiste Philipp Maas, de l'université de Leipzig, le texte, transmis avec son commentaire ancien, remonte à la fin du IVe ou au début du Ve siècle de notre ère, vers 400. Le yoga y est d'abord une discipline de l'esprit : le deuxième aphorisme le définit comme l'arrêt des fluctuations du mental. Le texte ne décrit aucune posture précise. Il demande seulement une assise « stable et confortable », bien loin des enchaînements du yoga postural moderne.",
   "Le prāṇāyāma, la maîtrise du souffle (prāṇa désigne le souffle vital), est le quatrième des huit « membres » du yoga : engagements envers autrui, disciplines personnelles, posture, maîtrise du souffle, retrait des sens, fixation de l'attention, méditation, absorption. Le texte ne lui consacre que quelques aphorismes, du II.49 au II.53. Une fois la posture stable, il s'agit de suspendre le flux de l'inspiration et de l'expiration. Elle peut être externe, après l'expiration, interne, après l'inspiration, ou une simple suspension. Elle se règle selon le lieu, la durée et le nombre, et le souffle devient long et subtil. Le résultat annoncé est méditatif : l'esprit devient apte à la concentration.",
   "Bien plus tard, les textes du haṭha yoga, souvent traduit par « yoga de la force », multiplient les techniques. Le plus célèbre, la Haṭhayogapradīpikā composée par Svātmārāma au XVe siècle, décrit huit sortes de rétention du souffle, dont la respiration « soufflet » (bhastrikā) ou le souffle bourdonnant (bhrāmarī). Le même texte insiste déjà sur la prudence. Il compare la maîtrise du souffle au dressage progressif des lions, des éléphants et des tigres : menée trop vite ou avec force, elle peut, avertit le texte, tuer le pratiquant. Mal pratiquée, ajoute-t-il, elle provoque des maladies comme le hoquet, l'asthme, la toux ou des maux de tête.",
   "Que dit la recherche ? Les études sur le prāṇāyāma sont nombreuses mais disparates. Une revue systématique de 2020 a retenu 18 essais contrôlés, de 16 à 160 participants, avec des bénéfices surtout chez des personnes souffrant d'asthme ou de bronchopneumopathie chronique ; ses auteurs réclament des essais de meilleure qualité. En 2023, une méta-analyse, c'est-à-dire une synthèse statistique, de 12 essais randomisés réunissant 785 adultes, consacrée aux pratiques respiratoires en général, trouve une baisse petite à moyenne du stress, de l'anxiété et des symptômes dépressifs, avec un risque de biais souvent modéré. Ses auteurs mettent en garde contre le décalage entre l'engouement et les preuves.",
   "Prudence, donc. Les respirations rapides et puissantes peuvent provoquer étourdissements et fourmillements, et les longues rétentions ne s'improvisent pas. En cas de grossesse, de maladie cardiaque ou respiratoire, d'épilepsie ou de trouble anxieux, mieux vaut demander l'avis d'un médecin avant d'essayer ces techniques, et les apprendre auprès d'un enseignant formé. Le yoga, inscrit en 2016 sur la liste du patrimoine culturel immatériel de l'UNESCO, reste avant tout une tradition spirituelle indienne. On peut y puiser des exercices simples sans en faire une thérapie. Les effets de la respiration lente sur le rythme cardiaque sont traités dans une autre fiche du site."

  "title": "Dhikr et samâ' : le souvenir de Dieu et l'écoute dans le soufisme",
  "excerpt": "Répéter le nom de Dieu au rythme du souffle, tourner au son de la flûte de roseau : dans le soufisme, la méditation passe par la voix, la musique et le corps.",
  "tag": "Informer",
  "repere": "Anatolie · XIIIe siècle",
  "body": [
   "Le soufisme désigne la dimension mystique de l'islam : la recherche d'une proximité intérieure avec Dieu, transmise de maître à disciple, souvent au sein de confréries appelées tarîqa, « voies ». Sa pratique distinctive, explique l'islamologue Annemarie Schimmel, est le dhikr, mot arabe qui signifie « souvenir » ou « rappel ». Il s'agit de se souvenir de Dieu en répétant une formule, comme « lâ ilâha illâ Llâh » (« il n'y a de dieu que Dieu »), ou des noms divins. Les soufis s'appuient sur le Coran, qui invite les croyants à évoquer Dieu abondamment. Le dhikr peut se dire à voix haute, en groupe, ou en silence, dans le secret du cœur.",
   "Dans ses formes développées, précise Schimmel, le dhikr s'accompagne d'une maîtrise du souffle. Un maître de la confrérie naqshbandie enseignait ainsi à prononcer trois fois la formule en une seule respiration, en la faisant descendre vers le cœur. Un mystique du IXe siècle, Sahl al-Tustarî, disait que chaque souffle qui sort sans souvenir de Dieu est un souffle mort. Schimmel rapproche ces méthodes de la prière de Jésus des moines orthodoxes et de l'invocation du Bouddha Amida au Japon : partout, la concentration semble s'appuyer sur le rythme respiratoire. Le chapelet, utilisé depuis le IXe siècle, aide à compter les répétitions, même si certains mystiques s'en méfiaient.",
   "Le samâ', littéralement « audition », désigne l'écoute de la musique et de la poésie spirituelles, qui peut conduire à l'extase et au mouvement. Il a toujours été discuté. Les juristes les plus stricts le rejetaient, tout comme certaines confréries dites « sobres », telle la naqshbandiyya. D'autres y voyaient une expression légitime du sentiment religieux. Les manuels soufis des Xe et XIe siècles consacrent de longs chapitres à ses dangers et conseillent de tenir les débutants à l'écart des concerts spirituels, de peur qu'ils n'y trouvent qu'un plaisir des sens. La danse giratoire a existé dans bien des régions du monde musulman, mais un seul ordre l'a institutionnalisée : celui des Mevlevi.",
   "L'ordre Mevlevi est fondé à Konya, en Anatolie, en 1273, l'année de la mort du poète persan Djalâl ad-Dîn Rûmî, surnommé Mevlânâ, « notre maître ». Pendant la cérémonie du sema, les derviches tournent sur eux-mêmes en pivotant sur le pied gauche, les yeux ouverts mais sans rien fixer, pour que les images deviennent floues. Ils sont accompagnés d'un répertoire musical appelé ayin, en quatre parties, joué au moins par un chanteur, un joueur de ney (la flûte de roseau), un timbalier et un joueur de cymbales. Autrefois, les danseurs se formaient lors d'une retraite de 1 001 jours dans un couvent mevlevi, où ils apprenaient prière, musique, poésie et danse.",
   "En 1925, la politique de laïcisation de la République turque conduit à la fermeture de tous les couvents mevlevi. Les cérémonies sont de nouveau autorisées en public dans les années 1950, et les restrictions s'assouplissent dans les années 1990. Proclamée par l'UNESCO en 2005, la cérémonie du sema est inscrite en 2008 sur la liste représentative du patrimoine culturel immatériel. L'organisation note qu'après trente ans de pratique clandestine, beaucoup de cérémonies se jouent devant des touristes, raccourcies et simplifiées. Pour les soufis, dhikr et sema ne sont pas des techniques de relaxation : ce sont des actes de dévotion, vécus dans la foi et sous la conduite d'un maître."
  ],

  "title": "L'hésychasme et la prière du cœur : prier au rythme du souffle",
  "excerpt": "« Seigneur Jésus-Christ, aie pitié de moi » : répétée au rythme du souffle, cette courte prière est au cœur de l'hésychasme, la tradition contemplative de l'Orient chrétien.",
  "tag": "Informer",
  "repere": "Empire byzantin · XIVe siècle",
  "body": [
   "Le mot hésychasme vient du grec hêsychia, qui signifie calme, repos, silence. Il désigne une tradition de prière contemplative de l'Orient chrétien, surtout orthodoxe, qui recherche cette paix intérieure par l'invocation continue du nom de Jésus. Ses racines remontent aux premiers moines chrétiens, notamment ceux du désert d'Égypte, qui répétaient de courtes prières pour rester tournés vers Dieu. La formule la plus connue, appelée prière de Jésus ou prière du cœur, tient en une phrase : « Seigneur Jésus-Christ, Fils de Dieu, aie pitié de moi, pécheur. » Elle se dit souvent sous une forme abrégée, par exemple « Seigneur Jésus-Christ, aie pitié de moi », à voix basse ou intérieurement.",
   "Au XIIIe siècle, au mont Athos, presqu'île grecque couverte de monastères, Nicéphore l'Hésychaste décrit une méthode qui engage le corps autant que l'esprit : incliner la tête, accorder la prière à la respiration, en régler le rythme, et ramener l'esprit dans le cœur. Au siècle suivant, ces pratiques sont violemment contestées, notamment par le moine Barlaam de Calabre. Le théologien Grégoire Palamas (1296-1359) les défend : Dieu reste caché dans son essence, mais l'être humain peut faire l'expérience directe de ses énergies, c'est-à-dire de son action. La querelle dure de 1337 environ à 1351, date à laquelle un synode présidé par l'empereur Jean VI Cantacuzène consacre la doctrine hésychaste.",
   "En 1782 paraît à Venise la Philocalie, « amour de la beauté », vaste anthologie de textes spirituels grecs écrits entre le IVe et le XVe siècle. Elle est rassemblée par Nicodème l'Hagiorite, moine du mont Athos, et Macaire de Corinthe. En 1793, Païssi Velitchkovski en publie à Moscou une traduction partielle en slavon, la langue liturgique de l'Église russe. Viennent ensuite des traductions en russe, dont celle de Théophane le Reclus, en cinq volumes, à partir de 1877. La Philocalie devient le grand manuel de la prière intérieure dans le monde orthodoxe. Elle a depuis été traduite dans de nombreuses langues, dont le roumain, le français et l'anglais.",
   "Le livre qui fait connaître la prière du cœur bien au-delà des monastères est un récit russe anonyme, publié dans les années 1880 : les Récits d'un pèlerin russe. Le narrateur, un errant sans ressources, est frappé par une phrase de saint Paul entendue à l'église : « Priez sans cesse ». Comment est-ce possible ? Un starets, un père spirituel, lui enseigne la prière de Jésus et lui fait lire la Philocalie. Il doit la répéter 3 000 fois par jour, puis 6 000, puis 12 000. Plus tard, le pèlerin dit « Seigneur Jésus-Christ » en inspirant et « aie pitié de moi » en expirant. L'identité de l'auteur reste discutée par les historiens.",
   "L'hésychasme n'est pas une technique de relaxation : c'est une prière adressée à quelqu'un, dans une relation de foi. La tradition insiste sur l'accompagnement par un père spirituel, et Païssi Velitchkovski hésitait d'ailleurs à diffuser sa traduction à des laïcs privés de guide. En Occident, d'autres formes de prière contemplative existent, comme la prière de centrage, développée au XXe siècle par des moines trappistes du Massachusetts à partir de textes chrétiens anciens. Des chercheurs en méditation classent ce type de prière parmi les pratiques « constructives », qui cultivent une manière de se rapporter à soi et au monde. Pour le croyant, son sens dépasse largement ses effets mesurables."

  "salon": "Méditation & pleine conscience",
  "title": "Quand la méditation dérange : effets indésirables et pratique prudente",
  "excerpt": "Anxiété, souvenirs traumatiques, impression d'irréalité : chez une minorité de pratiquants, méditer a des effets difficiles. Ce que montrent les études et comment s'en protéger.",
  "tag": "Éduquer",
  "repere": "Recherche · 2017-2022",
  "body": [
   "La méditation est souvent présentée comme une activité sans risque. Les textes bouddhistes décrivent pourtant aussi des expériences troublantes, et les traditions contemplatives connaissent depuis longtemps les difficultés qui peuvent survenir en retraite. La recherche scientifique, elle, s'est d'abord intéressée aux bienfaits. Les effets indésirables étaient rarement mesurés avec précision, souvent seulement quand les participants les signalaient d'eux-mêmes. Depuis la fin des années 2010, plusieurs équipes ont changé de méthode et posé directement la question. Leurs résultats ne condamnent pas la méditation. Ils invitent à en parler plus honnêtement, comme de toute pratique qui agit réellement sur l'esprit, et donc capable de produire des effets inattendus.",
   "En 2017, Jared Lindahl, Willoughby Britton et leurs collègues de l'université Brown publient l'étude « Varieties of Contemplative Experience ». Ils interrogent 60 pratiquants occidentaux des traditions theravāda, zen et tibétaine, choisis précisément parce qu'ils avaient connu des difficultés, ainsi que 32 enseignants et cliniciens. Ils recensent 59 types d'expériences dans sept domaines : pensées, perceptions, émotions, corps, motivation, sens de soi et relations. Dans cet échantillon, les plus fréquentes sont la peur, l'anxiété ou la panique, un brouillage de la frontière entre soi et le monde, et la réapparition de souvenirs traumatiques. Selon les personnes, la détresse allait de légère et passagère à sévère et durable.",
   "Cette étude ne dit pas à quelle fréquence ces difficultés surviennent, puisqu'elle a recruté des personnes qui en avaient eu. D'autres travaux s'en chargent. En 2020, Miguel Farias et ses collègues analysent 83 études regroupant 6 703 pratiquants. Ils estiment à 8,3 % la proportion de personnes signalant un effet indésirable, avec de grands écarts selon la méthode : 3,7 % dans les études expérimentales, 33,2 % dans les études d'observation. L'anxiété, la dépression et des anomalies cognitives sont les plus citées, y compris chez des personnes sans antécédent psychique. En 2022, une enquête auprès de 434 Américains ayant médité trouve que 10,4 % ont connu un effet indésirable ayant duré au moins un mois.",
   "Les programmes laïques ne sont pas épargnés. En 2021, Willoughby Britton et son équipe interrogent de façon systématique 96 participants à des programmes de MBCT, une thérapie de groupe de huit semaines fondée sur la pleine conscience. Chez 37 % d'entre eux, au moins un effet lié à la méditation a eu un impact négatif sur leur vie quotidienne, souvent de façon passagère. Des effets négatifs durables touchent 6 à 14 % des participants. Ils sont associés à des signes d'hyperéveil, quand le corps reste en état d'alerte, ou de dissociation, une impression de détachement ou d'irréalité. Les auteurs concluent que ces taux sont comparables à ceux des autres traitements psychologiques.",
   "Comment réduire les risques ? Une revue de 2019 distingue trois types de facteurs. Le programme d'abord : intensité, durée, retraites longues. La personne ensuite : antécédents de trauma ou de troubles psychiques ; l'enquête de 2022 associe aussi l'adversité vécue dans l'enfance à un risque plus élevé. L'enseignant enfin : sa formation et sa capacité à repérer les difficultés. Les chercheurs plaident pour une information honnête des participants et une pratique attentive aux traumatismes. Certains organisateurs de retraites le font déjà. En cas de malaise persistant, il faut consulter un professionnel de santé. Des structures spécialisées existent, comme Cheetah House, association américaine dont fait partie Willoughby Britton."

  "title": "Méditer en mouvement : marche méditative, tai-chi et qi gong",
  "excerpt": "Marcher en conscience au rythme du souffle, enchaîner les gestes lents du tai-chi : ces pratiques méditatives font bouger le corps. Leurs traditions et ce qu'en disent les études.",
  "tag": "Éduquer",
  "repere": "Chine · milieu du XVIIe siècle",
  "body": [
   "Méditer ne veut pas forcément dire rester immobile. Le Satipaṭṭhāna Sutta, un texte bouddhique ancien, demandait déjà de savoir que l'on marche quand on marche, comme on sait que l'on est assis. Dans le zen japonais, les séances de zazen, la méditation assise, alternent avec le kinhin, une marche très lente. L'école sôtô en fixe les règles : on tourne dans la pièce dans le sens des aiguilles d'une montre, les mains réunies devant la poitrine dans une position codifiée, le haut du corps dans la même posture qu'en zazen. On avance d'un demi-pas par respiration complète, si lentement que l'on semble presque immobile, sans traîner les pieds ni faire de bruit.",
   "Le moine vietnamien Thich Nhat Hanh (1926-2022) a fait de la marche méditative une pratique accessible à tous. Exilé de son pays pendant près de quarante ans, il fonde en 1982 le Village des Pruniers, en Dordogne, une communauté monastique qui accueille des retraitants du monde entier. Sa consigne est simple : marcher en sachant que l'on marche, sans se presser, en sentant le contact des pieds avec le sol. On accorde les pas au souffle, par exemple deux ou trois pas sur l'inspiration et trois ou quatre sur l'expiration, selon le rythme naturel de chacun. Cette marche se pratique en groupe et en silence, ou seul, n'importe où.",
   "Le tai-chi (taijiquan) est né au milieu du XVIIe siècle dans le district de Wenxian, dans la province chinoise du Henan, selon le dossier inscrit par l'UNESCO en 2020 sur la liste du patrimoine culturel immatériel. C'est une pratique physique traditionnelle faite de mouvements circulaires et détendus, coordonnés avec la respiration, qui comprend aussi des exercices à deux, les « mains qui poussent ». Influencé par la pensée taoïste et confucéenne et par la médecine chinoise, il s'est divisé en plusieurs écoles portant le nom d'un clan ou d'un maître. Le qi gong, souvent traduit par « travail de l'énergie », regroupe des exercices plus simples associant postures, gestes lents, souffle et attention.",
   "Que disent les études ? Les preuves les plus solides concernent l'équilibre des personnes âgées. En 2019, une revue Cochrane, référence internationale des synthèses médicales, a analysé 108 essais randomisés : l'exercice physique réduit les chutes après 60 ans. Pour le tai-chi, elle estime une baisse d'environ 19 % du nombre de chutes, avec une certitude faible, et de 20 % du nombre de personnes qui chutent, avec une certitude élevée. Pour le stress, les données sont plus fragiles. Une méta-analyse de 2014 sur le qi gong chez des adultes en bonne santé trouve une baisse de l'anxiété et du stress, mais à partir de sept essais seulement, souvent comparés à une simple liste d'attente.",
   "La marche méditative a été moins étudiée. En 2013, un essai allemand a réparti au hasard 74 adultes stressés : une moitié suivait huit séances de « marche en pleine conscience » en quatre semaines, l'autre attendait. Le stress perçu a nettement baissé dans le groupe marche, mais les auteurs réclament eux-mêmes des essais avec un groupe témoin actif et un suivi plus long. Une difficulté traverse tout le domaine : il est malaisé de séparer l'effet de l'attention de celui de l'exercice physique. Pour le pratiquant, ce n'est pas forcément un problème. Bouger en restant présent à ce que l'on fait combine les deux, et la marche reste à la portée du plus grand nombre."
  ],

  "title": "Le voyage du héros : le monomythe de Joseph Campbell et ses limites",
  "excerpt": "Départ, épreuves, retour : Campbell a cru voir un seul récit derrière tous les mythes. Hollywood l'a adopté, les folkloristes beaucoup moins. Voici pourquoi.",
  "tag": "Informer",
  "repere": "États-Unis · 1949",
  "body": [
   "En 1949, l'Américain Joseph Campbell publie The Hero with a Thousand Faces, traduit en français sous le titre Le Héros aux mille et un visages. Sa thèse est ambitieuse. Selon lui, les récits héroïques de toutes les cultures suivent un même schéma, qu'il appelle le « monomythe », un mot emprunté à l'écrivain irlandais James Joyce. Campbell le résume en une phrase : le héros quitte le monde ordinaire, affronte des forces merveilleuses, remporte une victoire décisive et revient avec un bienfait pour les siens. Le livre paraît dans la collection Bollingen et reçoit un prix de l'Institut national des arts et des lettres.",
   "Le schéma tient en trois temps : le départ, ou séparation, l'initiation, puis le retour. Campbell les détaille en dix-sept étapes, comme l'appel de l'aventure, le refus de l'appel, l'aide d'un mentor, le passage d'un seuil, les épreuves ou le retour difficile. Il ne s'agit pas d'étapes rigides : chaque récit peut en varier l'ordre ou en omettre. Campbell dit avoir trouvé l'intuition de départ chez l'ethnologue allemand Leo Frobenius, qui relevait dès 1904 un motif de descente aux enfers : « entrer dans le ventre de la baleine et en ressortir ». Sa lecture est aussi psychologique : pour lui, ce voyage décrit les étapes intérieures d'une vie.",
   "Le succès dépasse vite les universités. George Lucas a reconnu l'influence de Campbell, qu'il considérait comme un mentor. En 1999, il explique au journaliste Bill Moyers qu'il a « consciemment » voulu recréer des motifs mythologiques dans Star Wars. Moyers avait filmé ses entretiens avec Campbell au ranch de Lucas. Diffusée en 1988 sur la télévision publique américaine, peu après la mort de Campbell en octobre 1987, la série The Power of Myth, en six épisodes, devient un grand succès. Christopher Vogler, qui travaille alors à Hollywood, résume ensuite le schéma dans une note de sept pages qui circule par fax dans tout Hollywood, puis dans un manuel d'écriture, The Writer's Journey.",
   "Les spécialistes du folklore, c'est-à-dire des contes et traditions populaires, sont beaucoup plus réservés. Le folkloriste américain Alan Dundes, dans une conférence publiée en 2005, reproche à Campbell de parler des contes sans en être spécialiste et critique la notion même d'archétype, ces modèles universels supposés. On reproche aussi au monomythe de retenir les récits qui confirment le schéma et d'oublier ceux qui n'y entrent pas. En 2012, le chercheur Christian Roesler, dans une revue de psychologie jungienne, conclut qu'aucun fondement scientifique solide ne montre que des schémas complexes, comme le mythe du héros, se transmettent à tout être humain.",
   "Faut-il pour autant jeter le monomythe ? Tout dépend de l'usage. Comme outil d'écriture, il aide à construire une intrigue lisible et beaucoup de scénaristes s'en servent. Comme théorie des mythes du monde, il est fragile : il gomme les contextes, les langues et les fonctions propres à chaque récit. Un conte transmis dans un village ne poursuit pas forcément le même but qu'un film à grand budget. La bonne attitude consiste à s'en servir comme d'une grille de lecture parmi d'autres, en cherchant aussi ce qu'elle ne voit pas."
  ],

   "Folkloristes et chercheurs lui reprochent de choisir ses exemples et d'effacer les contextes culturels.",

  "salon": "Mythes, symboles & ésotérisme",
  "title": "Comment naît le monde ? Cinq récits de création comparés",
  "excerpt": "Un dieu qui surgit des eaux, une déesse fendue en deux, un géant né d'un œuf, une poule qui disperse la terre, un ciel et une terre enlacés : cinq façons de dire l'origine.",
  "tag": "Informer",
  "repere": "Égypte, Babylone, Chine, Yoruba, Maoris · de l'Antiquité à aujourd'hui",
  "body": [
   "Presque toutes les cultures racontent comment le monde a commencé. Les spécialistes appellent ces récits des cosmogonies, du grec kosmos, l'ordre du monde, et genesis, la naissance. Comparer cinq d'entre eux demande une précaution. Ils n'ont pas le même statut : les récits égyptien et babylonien nous parviennent par des textes antiques, alors que les récits yoruba et maori sont des traditions vivantes, racontées en plusieurs versions. Comparer ne veut pas dire classer. Il s'agit de voir comment des peuples différents ont répondu à une même question, avec leurs propres images et leurs propres enjeux.",
   "En Égypte, Atoum est un dieu créateur, peut-être d'abord honoré localement à Héliopolis. Au commencement, il vit dans le Noun, les eaux primordiales du chaos. Il en émerge, s'engendre lui-même puis engendre les dieux. Seul, sans partenaire féminine, il crée un premier couple : Shou, l'air, et Tefnout, l'humidité. Ceux-ci donnent naissance à Geb, la terre, et à Nout, le ciel. Shou est souvent représenté debout entre eux, soutenant Nout au-dessus de Geb. Viennent ensuite Osiris, Isis, Seth et Nephtys. L'ensemble forme l'Ennéade d'Héliopolis, un groupe de neuf dieux qui relie la création du monde au mythe d'Osiris.",
   "À Babylone, le poème Enūma eliš, « Lorsqu'en haut », tient sur sept tablettes. Au début, rien n'a encore de nom. Apsû, le géniteur, et Tiamat, la mère de tous, mêlent leurs eaux, et les dieux naissent en eux. Un conflit éclate. Le dieu Marduk vainc Tiamat, la fend en deux et fait de l'une des moitiés la voûte du ciel. Avec le dieu Ea, il crée ensuite l'humanité avec le sang du dieu rebelle Qingu, pour qu'elle porte le travail des dieux. Selon l'hypothèse la plus admise, le poème fut composé sous le roi Nabuchodonosor Ier, à la fin du XIIe siècle avant notre ère, et récité lors de la fête du Nouvel An.",
   "En Chine, le géant Pangu apparaît dans des textes rédigés entre le IIIe et le VIe siècle de notre ère, bien plus tard que les récits précédents. Au commencement, tout est chaos, comparé à un œuf. Pangu en sort et sépare le ciel de la terre. Une autre version raconte que l'univers est né de son corps. À sa mort, ses yeux deviennent le soleil et la lune, son sang les rivières, ses cheveux les plantes, son corps le sol. Les humains, eux, viendraient des parasites qui couvraient son corps. Le monde n'est pas fabriqué de l'extérieur : il est la transformation d'un être.",
   "Chez les Yoruba, au Nigeria actuel, la terre n'est d'abord que de l'eau. L'être suprême, Olodumare, charge Obatala de créer la terre ferme. Dans une version, Obatala descend avec une poule à cinq doigts, un pigeon et une calebasse de terre. Les oiseaux dispersent la terre, et un caméléon vient vérifier le travail. Obatala façonne ensuite les humains dans l'argile. Mais il boit du vin de palme et façonne des êtres atteints d'infirmités ; Oduduwa achève alors la tâche. Ifé reste pour les Yoruba le lieu d'origine de l'humanité et le siège de leur royauté sacrée, ce qui montre le lien entre mythe et pouvoir.",
   "Chez les Maoris de Nouvelle-Zélande, tout commence dans Te Kore, le néant, puis Te Pō, la longue nuit. Ranginui, le Ciel père, et Papatūānuku, la Terre mère, sont enlacés, leurs enfants serrés dans l'obscurité entre eux. Plusieurs fils essaient de les séparer. Tāne y parvient en poussant le ciel avec ses jambes, et le monde de la lumière, Te Ao Mārama, apparaît. Tāwhirimātea, dieu des vents, refuse cette séparation et attaque ses frères par les tempêtes. Au fil de ces cinq récits reviennent des eaux premières, des ciels écartés de la terre, des corps devenus monde. Mais chacun sert des enjeux propres : royauté, rituel, généalogie, lien au milieu naturel."
  ],
  "cles": [
   "Une cosmogonie raconte comment le monde est sorti d'un état premier, souvent des eaux ou d'un chaos.",

   "Le monde naît parfois d'un corps, celui de Tiamat à Babylone ou celui de Pangu en Chine.",
   "Ces récits servent aussi des enjeux concrets : légitimer un roi, fonder une généalogie, relier les humains à leur milieu."

  "title": "Isis et Osiris : mort, deuil et renaissance dans l'Égypte ancienne",
  "excerpt": "Un roi assassiné, une épouse qui cherche son corps, un fils qui le venge : le mythe d'Osiris a offert aux Égyptiens un modèle pour affronter la mort. Ce que disent les sources.",
  "tag": "Informer",
  "repere": "Égypte · XXIVe s. av. J.-C. - IIe s. apr. J.-C.",
  "body": [
   "Le mythe d'Osiris est l'un des plus importants de l'Égypte ancienne. Dans ses grandes lignes, Osiris, roi d'Égypte, est assassiné par son frère Seth. Son épouse et sœur Isis cherche et retrouve son corps, qui est reconstitué par la momification. Par ses formules, elle le ranime assez pour concevoir de lui un fils, Horus. Caché pour échapper à Seth, Horus grandit, venge son père et fait condamner son oncle. Il devient roi, tandis qu'Osiris règne désormais sur le monde des morts. Pourtant, les Égyptiens n'ont presque jamais raconté cette histoire d'un seul tenant : ils y font surtout allusion.",
   "Les plus anciens témoins sont les Textes des pyramides, un ensemble de prières, d'hymnes et de formules gravés dans les chambres funéraires de plusieurs pyramides de Saqqarah. Le plus ancien exemple connu se trouve dans la pyramide d'Ounas, dernier roi de la Ve dynastie, au XXIVe siècle avant notre ère. Ce sont les plus anciens écrits religieux et funéraires égyptiens conservés. Leur but est pratique : protéger le roi défunt et lui assurer une vie dans l'au-delà. Le roi mort y est associé à Osiris, et les épisodes du mythe apparaissent par fragments, dispersés dans des formules qui ne forment pas un récit suivi.",
   "Le récit continu le plus complet est grec et bien plus tardif. Au début du IIe siècle de notre ère, Plutarque écrit Sur Isis et Osiris, adressé à une certaine Cléa. Il raconte que Seth, qu'il nomme Typhon, enferme Osiris dans un coffre avec l'aide de soixante-douze complices. Isis, en deuil, retrouve le coffre à Byblos, pris dans le tronc d'une bruyère géante devenu pilier de la maison du roi. Seth découvre ensuite le corps et le découpe en quatorze morceaux. Isis les retrouve tous sauf un. Ce récit est précieux, mais il faut le lire avec prudence : Plutarque écrit en grec, longtemps après les premiers textes, et l'interprète en philosophe.",
   "Le mythe donne une forme au deuil. Chez Plutarque, Isis coupe une mèche de cheveux, change de vêtement, erre et interroge même des enfants. Dans les rites funéraires égyptiens, deux femmes jouaient le rôle d'Isis et de sa sœur Nephtys pleurant leur frère mort. Le défunt était désigné comme Osiris. L'égyptologue Mark Smith explique que le dieu offrait un modèle de double résurrection : la momification reconstituait son corps, et sa justification contre Seth lui rendait sa place parmi les dieux. Les Égyptiens espéraient être, comme lui, reconstitués et justifiés, et rejoindre son entourage dans l'au-delà.",
   "Abydos, en Haute-Égypte, devient le grand centre du culte d'Osiris. À partir de la Ve dynastie, son culte y absorbe celui d'un dieu chacal, ancien protecteur de la nécropole. On y vénérait le tombeau reconnu d'Osiris. Les pèlerins souhaitaient être enterrés le plus près possible ; ceux qui n'en avaient pas les moyens faisaient dresser une stèle à leur nom, avec une prière au dieu. Des milliers de ces stèles ont été retrouvées. On mesure ainsi ce que le mythe représentait : une espérance partagée face à la mort, inscrite dans des gestes, des lieux et des rites."
  ],

  "title": "Yggdrasil, Odin, Ragnarök : ce que les Eddas nous apprennent vraiment",
  "excerpt": "Presque tout ce que l'on sait des dieux nordiques vient de deux livres islandais du XIIIe siècle, écrits par des chrétiens. Une chance immense, et une raison d'être prudent.",
  "tag": "Informer",
  "repere": "Islande · XIIIe siècle",
  "body": [
   "Thor, Odin, Loki ou le Ragnarök sont aujourd'hui partout : opéras, bandes dessinées, films, jeux vidéo. Mais d'où viennent ces récits ? La mythologie nordique désigne les croyances des Scandinaves avant leur conversion au christianisme. Pour la connaître, il faut passer par des textes écrits bien après cette conversion. L'essentiel de nos connaissances vient de deux livres islandais du XIIIe siècle, appelés tous deux « Edda » : l'Edda en prose, de Snorri Sturluson, et l'Edda poétique, un recueil de poèmes anonymes. Ils forment la source la plus riche sur la mythologie germanique. Ils ont aussi une histoire qui oblige à les lire avec attention.",
   "Snorri Sturluson, né en 1179 et assassiné en 1241, est un chef islandais, poète, historien et homme de loi, qui présida l'assemblée judiciaire de l'île. Installé à Reykholt en 1206, il y écrit l'essentiel de son œuvre. Son Edda, rédigée probablement vers 1222-1223, est d'abord un manuel de poésie. Il veut apprendre aux jeunes poètes les mètres anciens et les kenningar, ces périphrases imagées en forme de devinettes qu'aimaient les poètes de cour. Pour cela, il doit expliquer les mythes auxquels ces images renvoient, à des lecteurs chrétiens. Dans la partie appelée Gylfaginning, un roi suédois interroge les dieux, qui lui racontent l'histoire du monde, de sa création jusqu'au Ragnarök.",
   "L'Edda poétique nous est parvenue surtout par un manuscrit unique, le Codex Regius, ou « Livre du roi ». Copié en Islande vers 1270 sur parchemin, il compte quarante-cinq feuillets et vingt-neuf poèmes ; un cahier a été perdu. Un évêque islandais l'acquiert en 1643 et l'offre au roi du Danemark. Il reste à Copenhague jusqu'en 1971, date de sa restitution à l'Islande. Il est aujourd'hui conservé à l'Institut Árni Magnússon de Reykjavík. Ces poèmes sont plus anciens que le manuscrit : la Völuspá, « Prophétie de la voyante », qui raconte la création et la fin du monde, daterait de la fin du Xe siècle.",
   "Ces textes décrivent Yggdrasil, un frêne gigantesque qui relie les neuf mondes, dont Midgard, la terre des humains, et Asgard, le domaine des dieux. Dans le Hávamál, « Paroles du Très-Haut », Odin raconte s'être pendu neuf nuits à un arbre battu des vents pour conquérir les runes, les signes de l'écriture. Le poème ne nomme pas l'arbre, mais la tradition y reconnaît Yggdrasil. Le Ragnarök, « destin des dieux », commence par la mort du dieu Balder. Suivent un hiver de trois ans, la libération du loup Fenrir et du serpent du monde, une bataille finale où meurent les dieux, puis un monde renaissant.",
   "Ces sources demandent de la prudence. L'Islande adopte le christianisme en 999 ou 1000, par une décision de son assemblée, l'Althing. Snorri écrit donc plus de deux siècles plus tard, en chrétien, et il ordonne les récits pour qu'ils forment un ensemble cohérent. Pour le Ragnarök, son texte suit largement la Völuspá. Il faut donc distinguer trois couches : les poèmes anciens, la mise en ordre savante du XIIIe siècle, et les relectures modernes, comme l'opéra Le Crépuscule des dieux de Richard Wagner ou les fictions actuelles. La mythologie nordique que nous connaissons est en partie une reconstruction islandaise, magnifique mais tardive."
  ],

   "Le Codex Regius, copié vers 1270, conserve vingt-neuf poèmes plus anciens, dont la Völuspá et le Hávamál.",

  "salon": "Mythes, symboles & ésotérisme",
  "title": "Le Temps du Rêve : récits aborigènes d'Australie et lignes de chant",
  "excerpt": "Le « Rêve » aborigène n'est ni un songe ni un passé révolu : c'est une Loi qui relie les êtres, la terre et les ancêtres. Ce qu'on peut en dire, et ce qui ne nous appartient pas.",
  "tag": "Informer",
  "repere": "Australie · tradition vivante",
  "body": [
   "Les mots « Rêve » et « Temps du Rêve » sont des traductions anglaises. À la fin du XIXe siècle, Francis Gillen, chef du télégraphe d'Alice Springs, qui parlait arrernte, traduit par « temps du rêve » le mot arrernte Altyerr, qui désigne le système religieux de ce peuple. L'anthropologue Baldwin Spencer popularise l'expression en 1896, puis d'autres chercheurs la reprennent. La spécialiste Christine Nicholls souligne que ces termes rendent mal les notions d'origine, très diverses selon les langues : Jukurrpa chez les Warlpiri, Altyerr chez les Arrernte, Tjukurpa chez les Aṉangu, et bien d'autres. Pour ceux qui les vivent, ces notions désignent la réalité, la religion et la Loi.",
   "Les Aṉangu, propriétaires traditionnels d'Uluṟu, présentent publiquement la Tjukurpa comme le fondement de leur culture. C'est une philosophie religieuse qui les relie à leur environnement et à leurs ancêtres. Ses récits parlent du commencement, quand les Êtres ancestraux ont créé le monde. Ils transmettent des leçons sur la terre, la survie dans le désert et les règles de conduite. Ils servent aussi de cartes : ils disent où se trouvent les lieux importants, comment aller de l'un à l'autre, où et quand trouver de l'eau et de la nourriture. La Tjukurpa n'est pas écrite ; elle est mémorisée et transmise aux bonnes personnes, comme un héritage.",
   "C'est le sens des « lignes de chant », en anglais songlines : des itinéraires parcourus par les êtres ancestraux à travers le pays, que l'on suit grâce aux chants, aux danses et aux peintures. L'exposition Songlines: Tracking the Seven Sisters, du Musée national d'Australie, en a présenté cinq, venues des déserts de l'Ouest et du Centre, chez les Martu, les Ngaanyatjarra et les Aṉangu Pitjantjatjara Yankunytjatjara. Près de trois cents œuvres y racontent une histoire de poursuite et de fuite, de désir, de magie et de liens familiaux. Le projet est né à l'initiative d'anciens aborigènes, en collaboration avec le musée et l'Université nationale australienne.",
   "Ces traditions sont anciennes. Des fouilles publiées en 2017 dans la revue Nature situent la présence humaine dans le nord de l'Australie il y a environ 65 000 ans. Surtout, les géographes Patrick Nunn et Nicholas Reid ont étudié des récits venant de vingt et un lieux côtiers. Ils évoquent une époque où la mer a englouti l'ancien rivage. Ces récits renverraient vraisemblablement à la montée des mers achevée il y a environ 7 000 ans, voire avant. Les auteurs y voient la preuve d'une longévité extraordinaire de la transmission orale, ce qui place ces traditions parmi les plus anciennes traditions orales vivantes documentées.",
   "Une partie de ces savoirs ne nous appartient pas. Certains lieux, cérémonies et récits sont réservés à des personnes précises, selon des règles transmises par les anciens. Le parc d'Uluṟu-Kata Tjuṯa demande de ne pas reproduire ni raconter les récits de la Tjukurpa, qui relèvent de la propriété culturelle et intellectuelle des Aṉangu. Il demande aussi de ne pas entrer ni photographier dans les zones sacrées. Cette fiche se limite donc à ce que les communautés partagent publiquement. En France, l'anthropologue Barbara Glowczewski a consacré des travaux aux Warlpiri, et le musée du quai Branly a montré en 2012-2013 l'exposition « Aux sources de la peinture aborigène »."

  "title": "La femme tombée du ciel, la Tortue et le Coyote : récits amérindiens",
  "excerpt": "Chez les Haudenosaunee, la Terre repose sur le dos d'une tortue. Plus à l'ouest, Coyote et Corbeau façonnent le monde en jouant des tours. Deux visages des récits autochtones.",
  "tag": "Informer",
  "repere": "Amérique du Nord · traditions vivantes",
  "body": [
   "Les Haudenosaunee, le « peuple de la maison longue », sont ceux que les Français appelaient Iroquois. Leur confédération réunit à l'origine cinq nations : Mohawks, Oneidas, Onondagas, Cayugas et Sénécas. Les Tuscaroras l'ont rejointe ensuite comme sixième nation. Pour eux, raconter des histoires n'est pas un simple divertissement : c'est une manière de transmettre des valeurs, des lois et des conduites. Traditionnellement, l'hiver était la saison des récits. Le récit de la création existe en plusieurs versions, selon les nations et les conteurs. Nous suivons ici celle d'Amos Christjohn, publiée par la Nation oneida, en la résumant sans la remplacer.",
   "Au commencement, il n'y a pas de terre, seulement de l'eau, des animaux aquatiques et des oiseaux. Au-dessus existe le Monde-Ciel, habité par des êtres aux pouvoirs surnaturels. En son centre pousse un grand arbre dont les fruits donnent la lumière. Il est interdit de l'abîmer. Une femme tombe pourtant par un trou ouvert près de ses racines. Les oiseaux la voient chuter et vont la soutenir. La grande Tortue accepte de la porter sur son dos. Des animaux plongent chercher de la terre ; plusieurs échouent, dont le plongeon et le castor. Le rat musqué remonte enfin, un peu de boue entre les griffes.",
   "La femme pose cette terre sur la carapace de la Tortue, et elle grandit jusqu'à devenir un pays. D'où l'image, chère aux Haudenosaunee, d'une Amérique du Nord portée par la Tortue. La femme donne naissance à une fille, qui meurt en donnant naissance à des jumeaux. De sa tombe poussent le maïs, le haricot, la courge et le tabac. Le jumeau de droite crée les plantes et les remèdes ; celui de gauche, appelé Silex, en empoisonne ou en déforme certaines. Le récit pense ainsi un monde fait de forces opposées. Dans l'art perlé, un demi-cercle rappelle le Monde-Ciel d'où vient la vie.",
   "Dans de nombreux récits d'Amérique du Nord apparaît une autre figure : le trickster, mot anglais qui signifie à peu près « farceur » ou « joueur de tours ». C'est un personnage plein de contradictions, à la fois créateur et sot, destructeur et enfant espiègle. Il met de l'ordre dans le chaos et enseigne aux humains des savoir-faire, souvent en échouant lui-même. Coyote joue ce rôle en Californie, dans le Sud-Ouest, le Plateau et les Plaines. Sur la côte nord-ouest, c'est Corbeau, parfois Vison ou Geai bleu. Ailleurs, on rencontre Araignée, Nanabozho le Lièvre ou Wisakedjak. Chaque peuple le nomme et le raconte à sa façon.",
   "Corbeau, sur la côte nord-ouest, transforme une terre sombre et aride en pays de rivières, de lacs et de montagnes, peuplé d'animaux et d'humains, souvent par la ruse. Un récit haïda raconte qu'un jour, sur la plage de Rose Spit, à Haida Gwaii, Corbeau découvre un extraordinaire coquillage d'où dépassent de petites créatures. Il les persuade de sortir : ce sont les premiers Haïdas. L'artiste haïda Bill Reid en a tiré une grande sculpture en cèdre jaune, Le Corbeau et les premiers hommes, inaugurée en 1980 au musée d'anthropologie de l'Université de la Colombie-Britannique. Ces récits restent vivants, y compris chez des écrivains autochtones contemporains."
  ],

  "title": "Baba Yaga, Perun, l'oiseau de feu : mythes slaves, l'attesté et le reconstruit",
  "excerpt": "Un dieu du tonnerre cité par une chronique de Kyiv, une sorcière des contes russes, un oiseau de lumière devenu ballet : démêler ce qui est ancien et ce qui est recomposé.",
  "tag": "Informer",
  "repere": "Rus' de Kyiv et Russie · VIe-XIXe siècles",
  "body": [
   "Parler des mythes slaves demande d'abord de regarder les sources. Les Slaves entrent tard dans l'histoire écrite : leur nom n'apparaît pas avant le VIe siècle de notre ère. Les anciens Slaves païens n'ont pas laissé de textes sur leurs dieux. Comme le rappelle l'encyclopédie Britannica, les informations sur leurs croyances sont toutes tardives et viennent de mains chrétiennes. Il faut donc distinguer trois choses : ce que disent les rares sources anciennes, ce que racontent les contes populaires recueillis bien plus tard, et ce que des savants ou des mouvements modernes ont reconstruit à partir de ces fragments.",
   "Perun, dieu du tonnerre, est le mieux attesté. Au VIe siècle, l'historien byzantin Procope signale déjà chez les Slaves le culte d'un dieu de la foudre. La Chronique des temps passés, compilée à Kyiv vers 1113, cite Perun dans les serments des traités de 945 et de 971, en 971 aux côtés de Volos, « dieu du bétail ». En 980, le prince Vladimir dresse sur une colline des idoles de Perun, Khors, Dajbog, Stribog, Simargl et Mokoch. Après son baptême, il les fait abattre : Perun est attaché à la queue d'un cheval, battu par douze hommes et jeté au fleuve. Le manuscrit laurentien, copié en 1377, est la plus ancienne chronique russe datée qui nous soit parvenue.",
   "Après la christianisation, le culte de Perun passe en partie au prophète Élie, que les Russes appellent Ilia. Des fêtes et des repas en l'honneur de Perun ou d'Élie, le 20 juillet, ont survécu jusqu'à l'époque moderne. Mais au-delà de ces mentions, beaucoup reste incertain. L'historien des religions Evel Gasparini estime que les tentatives pour placer Perun au centre d'un panthéon organisé sur le modèle gréco-romain ne donnent pas de résultats sérieux. Certaines divinités souvent citées dans les livres ne reposent que sur une seule mention : le dieu Svarog, par exemple, apparaît dans une glose russe d'une chronique byzantine.",
   "Baba Yaga et l'oiseau de feu, eux, viennent des contes. Au XIXe siècle, Alexandre Afanassiev publie, à partir de 1855 et en huit volumes, les Contes populaires russes, un vaste recueil qui fait date. On y trouve Baba Yaga, Vassilissa la Belle ou le conte d'Ivan Tsarévitch, de l'oiseau de feu et du loup gris. Certains contes furent supprimés par la censure en 1863. Ces récits disent beaucoup de la Russie paysanne, mais ce ne sont pas des textes sacrés païens. En 1928, le folkloriste Vladimir Propp analyse les contes merveilleux russes et y repère trente et une « fonctions » qui reviennent toujours dans le même ordre.",
   "Baba Yaga est une ogresse qui vole, cuit et mange ses victimes, souvent des enfants. Elle vit dans la forêt, dans une cabane qui tourne sur des pattes d'oiseau, entourée d'une palissade de crânes, et voyage dans un mortier qu'elle pousse avec un pilon. Pourtant, elle n'est pas seulement méchante. Dans Vassilissa la Belle, elle aide aussi l'héroïne à échapper à sa famille hostile. Cette ambiguïté fait sa richesse. Elle ne figure pas parmi les dieux nommés par la chronique de Kyiv : la présenter comme une ancienne déesse relève de l'hypothèse, pas du fait établi.",
   "L'oiseau de feu, lui, a connu une seconde vie. Le 25 juin 1910, à l'Opéra de Paris, les Ballets russes de Serge Diaghilev créent L'Oiseau de feu d'Igor Stravinsky, alors âgé de vingt-sept ans. Le ballet mêle l'oiseau, le prince Ivan Tsarévitch et le sorcier Kachtcheï. Stravinsky emprunte quelques mélodies populaires, mais l'essentiel de la musique est de sa main. Aujourd'hui encore, des mouvements néopaïens en Russie, étudiés notamment par la chercheuse Kaarina Aitamurto, revendiquent les anciens dieux slaves. Leurs panthéons sont des créations contemporaines, à distinguer des sources anciennes."
  ],

 {
  "salon": "Mythes, symboles & ésotérisme",
  "title": "Symboles universels ? Cercle, spirale, arbre de vie et archétypes de Jung",
  "excerpt": "On trouve des spirales, des cercles et des arbres sacrés presque partout. Faut-il y voir un inconscient commun, comme le pensait Jung ? Ce que les chercheurs en disent.",
  "tag": "Éduquer",
  "repere": "Monde · de la préhistoire à aujourd'hui",
  "body": [
   "Des spirales gravées en Irlande il y a plus de cinq mille ans, des diagrammes circulaires au Tibet, des arbres qui relient le ciel et la terre dans plusieurs mythologies : certaines formes semblent revenir partout. Il est tentant d'en conclure qu'elles ont le même sens pour toute l'humanité. Pour y voir clair, il faut séparer deux questions. Une forme est-elle très répandue ? C'est une question de faits, que l'on peut vérifier. A-t-elle partout la même signification ? C'est une autre question, beaucoup plus difficile, qui demande d'écouter ceux qui utilisent ces formes.",
   "Prenons la spirale. À Newgrange, en Irlande, des agriculteurs du Néolithique ont bâti vers 3200 avant notre ère une grande tombe à couloir. Des spirales et des zigzags compliqués sont gravés dans ses pierres. Leur signification reste un mystère. Une hypothèse les relie à l'observation du soleil et de la lune. Le monument lui-même est orienté : au solstice d'hiver, pendant quelques minutes, le soleil levant éclaire le couloir jusqu'à la chambre funéraire. Mais rien ne permet de trancher. La spirale de Newgrange nous rappelle qu'une forme peut être ancienne, belle et fréquente sans que nous sachions ce qu'elle voulait dire pour ceux qui l'ont tracée.",
   "L'arbre et le svastika montrent les deux faces du problème. Yggdrasil, l'arbre du monde nordique, appartient à une famille de motifs d'« arbre de vie » présents dans de nombreuses cultures. À l'inverse, une même forme peut porter des sens opposés. Le svastika, croix aux branches coudées, tire son nom du sanskrit svastika, « qui favorise le bien-être ». Il reste en Inde un signe de bon augure pour les hindous, les jaïns et les bouddhistes. Il apparaît aussi dans l'art chrétien ancien ou chez les Navajos. Détourné au XXe siècle par le nazisme, il a pris en Europe une signification de haine. Le sens dépend du contexte.",
   "Le psychiatre suisse Carl Gustav Jung a proposé une explication célèbre de ces ressemblances. Il appelle inconscient collectif une part de l'esprit commune à toute l'humanité, qui viendrait de la structure héritée du cerveau. Cet inconscient contiendrait des archétypes, c'est-à-dire des images et des idées primordiales universelles, qui s'expriment dans les comportements et dans les images. Jung a étudié des dessins de ses patients ressemblant à des mandalas, des figures circulaires. Pour lui, produire spontanément un mandala marquait une étape de l'individuation, le processus par lequel une personne intègre ce qui restait inconscient en elle.",
   "Cette théorie a eu une influence immense, mais elle est très contestée. En 2012, le chercheur Christian Roesler a passé en revue le débat dans une revue de psychologie jungienne. Il conclut qu'aucun fondement scientifique solide ne montre que des schémas symboliques complexes se transmettent biologiquement à chaque individu. Il suggère que la culture joue un rôle bien plus grand. D'autres explications existent : des expériences partagées par tous les humains, comme le soleil, les arbres ou le corps, et la diffusion des récits au fil des migrations, que des chercheurs comme Jean-Loïc Le Quellec, au CNRS, tentent de retracer.",
   "Que retenir pour lire un symbole ? D'abord, se demander qui l'a tracé, quand, et pour quel usage. Ensuite, chercher ce qu'en disent ceux qui l'utilisent, plutôt que lui plaquer un sens universel. Enfin, se méfier des usages commerciaux : le mot « mandala » sert aujourd'hui à nommer des concepts New Age, des marques, des hôtels ou des magazines, très loin des rituels tibétains. Les ressemblances entre cultures sont réelles et passionnantes. Elles invitent à comparer, pas à confondre. Un cercle n'a pas un seul sens caché : il a des histoires, souvent très différentes."
  ],
  "cles": [
   "Une forme répandue n'a pas forcément un sens universel : les spirales de Newgrange restent une énigme.",
