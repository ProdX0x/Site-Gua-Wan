 {
  "salon": "Le Toucher",
  "title": "Comment la peau sent : pression, chaud, froid et le Nobel 2021",
  "excerpt": "Piezo2 pour le toucher, TRPV1 pour la chaleur, TRPM8 pour le frais : le Nobel 2021 a récompensé la découverte des capteurs qui changent un contact en signal nerveux.",
  "tag": "Informer",
  "body": [
   "La peau est truffée de capteurs. Sous sa surface, des terminaisons nerveuses spécialisées, les mécanorécepteurs, réagissent quand la peau se déforme. Chacun a son registre : certains répondent à une pression maintenue et aux contours fins, d'autres aux glissements, d'autres encore aux vibrations les plus légères. Le cerveau combine leurs messages pour reconstruire une texture, une forme, une prise. D'autres terminaisons, les thermorécepteurs, signalent le chaud et le froid. Une question est pourtant restée longtemps sans réponse : comment une pression ou une température devient-elle un signal électrique dans un nerf ?",
   "Le prix Nobel de physiologie ou médecine 2021 a récompensé David Julius et Ardem Patapoutian pour la découverte des récepteurs de la température et du toucher. Ces récepteurs sont des canaux ioniques : de minuscules portes logées dans la membrane des neurones. Quand elles s'ouvrent, des particules chargées entrent dans la cellule et déclenchent un influx nerveux. En 2010, l'équipe de Patapoutian a identifié deux canaux qui s'ouvrent directement sous l'effet d'une pression sur la membrane. Elle les a baptisés Piezo1 et Piezo2, d'après le mot grec qui signifie « pression ».",
   "Les travaux suivants, menés notamment chez la souris, ont montré que Piezo2 est indispensable au toucher léger et à la proprioception, le sens de la position et du mouvement de notre corps. Chez l'humain, une étude de 2016 a décrit deux personnes porteuses de mutations qui rendent PIEZO2 inactif. Elles percevaient mal les vibrations d'un diapason et, les yeux bandés, peinaient à marcher et à sentir la position de leurs membres. Elles sentaient pourtant un pinceau passé sur la peau velue, ce qui suggère l'existence d'autres voies. Mais l'une d'elles le trouvait piquant, et non agréable comme les volontaires témoins.",
   "Pour la température, David Julius est parti du piment. La capsaïcine, la molécule qui « brûle » la bouche, lui a permis d'identifier en 1997 un récepteur aujourd'hui nommé TRPV1. Ce canal s'ouvre aussi quand la chaleur devient douloureuse, vers 43 °C. Voilà pourquoi le piment donne une sensation de brûlure sans élever la température. De façon symétrique, Julius et Patapoutian ont chacun identifié, grâce au menthol, le récepteur TRPM8, activé par le froid. D'où la fraîcheur de la menthe. Les capteurs de la tiédeur agréable, eux, font encore l'objet de recherches et de débats.",
   "Ces découvertes dépassent la peau. Les canaux Piezo participent aussi à la régulation de la pression artérielle, de la respiration ou de la vessie, et ces connaissances servent à chercher de nouveaux traitements, notamment contre la douleur chronique. Pour le toucher du quotidien, elles rappellent une idée simple : chaque sensation commence par une porte moléculaire qui s'ouvre. Ce que nous ressentons, agréable ou non, dépend ensuite de tout le chemin parcouru jusqu'au cerveau, et de l'état dans lequel il se trouve."
  ],
  "plaisir": "Le même contact peut plaire ou déplaire selon l'état du corps. En 1971, le physiologiste Michel Cabanac a donné un nom à ce phénomène : l'alliesthésie. Un contact tiède paraît délicieux quand on a froid, pénible quand on a trop chaud. Le capteur, lui, transmet la même information. C'est le cerveau qui lui attribue une valeur, selon ce dont l'organisme a besoin. Pour Cabanac, le plaisir sert ainsi de guide : il pousse vers les comportements qui rétablissent l'équilibre interne, comme se réchauffer ou se rafraîchir. Le plaisir thermique est donc un signal utile, autant qu'une sensation.",

 {
  "salon": "Le Toucher",
  "title": "Le toucher qui apaise : ce que disent vraiment les études",
  "excerpt": "Main tenue, massage, ocytocine : le toucher a des effets mesurables sur le stress et l'anxiété, mais pas toutes les vertus qu'on lui prête. Le point sur les preuves.",
  "tag": "Informer",
  "body": [
   "En 2006, le psychologue James Coan et ses collègues installent seize femmes mariées dans un appareil d'IRM, un scanner qui suit l'activité du cerveau. Un signal annonce parfois une petite décharge électrique. Pendant cette attente menaçante, chaque participante tient la main de son mari, celle d'un inconnu, ou aucune main. Avec la main du conjoint, les régions cérébrales liées à la réaction face à la menace s'activent nettement moins. L'effet est plus limité avec la main d'un inconnu. Et il est d'autant plus marqué que la participante juge son couple de bonne qualité.",
   "Seize personnes, c'est peu. En 2017, la même équipe reprend l'expérience avec 110 participants, hommes et femmes, d'origines variées, mariés, en couple ou simplement amis. Tenir la main d'un proche réduit à nouveau la détresse ressentie et l'activité d'un réseau lié à la vigilance. En revanche, la main d'un inconnu n'a cette fois aucun effet mesurable, et le type de relation ne change pas le résultat. Ce qui semble compter, c'est la familiarité, ainsi que le sentiment de pouvoir compter sur le soutien de son entourage.",
   "Qu'en est-il du massage et des autres formes de toucher ? Une grande méta-analyse publiée en 2024 a regroupé 137 études comparant des personnes touchées à des personnes non touchées. Une méta-analyse combine les résultats de nombreuses études pour obtenir une estimation plus fiable. Chez l'adulte, le toucher réduit en moyenne la douleur, l'anxiété et les symptômes dépressifs. Le type de toucher compte peu : massage, caresses ou simple contact donnent des bénéfices proches, que le geste vienne d'un proche ou d'un professionnel. Plusieurs séances font mieux qu'une seule, mais allonger chaque séance n'apporte rien de plus.",
   "Les auteurs signalent aussi les limites. Il est impossible de toucher quelqu'un « en aveugle » : chacun sait s'il a été massé, ce qui laisse place aux attentes. Les petites études, plus souvent positives, pèsent un peu sur le résultat. Les bénéfices psychologiques sont plus nets chez les personnes malades que chez les personnes en bonne santé. Le toucher est donc un vrai soutien, pas un traitement à lui seul. Il ne remplace pas un suivi médical, et le massage n'est pas adapté à toutes les situations de santé : en cas de doute, mieux vaut demander l'avis d'un professionnel.",
   "Reste l'ocytocine, souvent surnommée « hormone du câlin ». C'est une hormone, et un messager du cerveau, impliquée dans l'accouchement, l'allaitement et l'attachement. Des travaux, surtout chez l'animal, indiquent que des stimulations douces de la peau peuvent déclencher sa libération, et certains chercheurs soupçonnent les fibres de la caresse d'y contribuer. Chez l'humain, le tableau est beaucoup moins net. Les dosages dans le sang ou la salive reflètent mal ce qui se passe dans le cerveau, et plusieurs méthodes de mesure ont été critiquées. Les promesses du type « un câlin de vingt secondes libère de l'ocytocine » dépassent donc largement les preuves."

 {
  "salon": "Le Toucher",
  "title": "Atelier : redécouvrir le toucher par les matières et les textures",
  "excerpt": "Velours, laine, bois, papier : un atelier pour explorer les textures lentement et avec attention, et comprendre comment le geste change le plaisir de toucher.",
  "tag": "Éduquer",
  "body": [
   "Nous touchons des dizaines d'objets chaque heure sans vraiment les sentir. Le geste est rapide, utile, presque automatique. Cet atelier propose l'inverse : choisir quelques matières, ralentir, et leur accorder toute son attention. Ce n'est pas une technique de relaxation, mais une manière de redécouvrir un sens que l'on utilise sans y penser. Pour en profiter pleinement, il aide de savoir comment la main explore le monde, et ce que la recherche a appris des textures que nous trouvons agréables.",
   "Dans les années 1980, les psychologues Susan Lederman et Roberta Klatzky ont observé des personnes aux yeux bandés à qui l'on demandait de juger un objet. Chacune adoptait spontanément un geste adapté à la question. Pour la texture, on frotte. Pour la dureté, on appuie. Pour la température, on laisse la main posée sans bouger. Pour le poids, on soulève. Pour la forme, on enveloppe l'objet ou l'on suit ses contours. Ces gestes, appelés « procédures exploratoires », sont en général les plus efficaces pour obtenir l'information recherchée.",
   "Le mouvement est essentiel pour percevoir une texture. Une étude de 2013 a enregistré les fibres nerveuses du bout des doigts chez des singes macaques pendant qu'on faisait défiler des textures naturelles sous leur peau. Les reliefs grossiers sont codés par la forme du motif qui s'imprime sur la peau. Mais la plupart des textures, plus fines, sont perçues grâce aux vibrations que le frottement produit dans la peau. Sans glissement, ces vibrations n'apparaissent pas. C'est en partie pourquoi un doigt immobile renseigne mal sur le grain d'un tissu, qui se révèle dès qu'on le parcourt.",
   "Qu'est-ce qui rend une matière agréable ? Les premières études désignaient les matériaux doux et lisses comme plaisants, et les matières raides, rugueuses ou grossières comme déplaisantes. Des travaux plus récents, où l'on fait glisser différents tissus sur plusieurs zones du corps à vitesse et pression contrôlées, confirment qu'en général la rugosité diminue l'agrément. Mais ils montrent surtout que tout interagit : la matière, la zone du corps, la vitesse, la force du contact, et même le sexe des participants. Il n'existe pas de texture agréable pour tout le monde, partout et à toute vitesse.",
   "Deux réglages sont à votre portée. La vitesse d'abord : sur la peau velue, comme l'avant-bras, les caresses lentes, de quelques centimètres par seconde, sont en moyenne jugées les plus agréables. Les attentes ensuite : dans une étude d'imagerie, la même crème appliquée sur l'avant-bras semblait plus agréable quand on la présentait comme « crème riche et hydratante » plutôt que comme « crème basique ». Ce que l'on pense d'une matière colore donc ce que l'on ressent en la touchant."
  ],
  "plaisir": "Pour une texture, le cortex somatosensoriel décrit le relief, la pression et la vibration. L'agrément, lui, mobilise d'autres régions. Dans l'étude sur la crème, l'étiquette modifiait à la fois le plaisir déclaré et l'activité de l'insula et du striatum ventral, un carrefour du circuit de la récompense. La même étude montrait qu'un toucher sur l'avant-bras, riche en fibres de la caresse, activait davantage une partie du cortex orbitofrontal, qui attribue une valeur aux expériences, qu'un toucher sur la paume. Le plaisir tactile se construit ainsi à la fois depuis la peau et depuis nos attentes.",
  "pratique": [

   "Faites glisser une matière douce sur l'avant-bras à trois vitesses, puis sur la paume, et comparez.",

 {
  "salon": "L'Ouïe",
  "title": "Les frissons musicaux : la dopamine, de l'attente au sommet du plaisir",
  "excerpt": "Pourquoi certains passages donnent-ils la chair de poule ? Le circuit de la récompense s'active avant même le moment fort. Et chez certaines personnes, la musique ne fait rien.",
  "tag": "Informer",
  "body": [
   "Un crescendo, une voix qui s'élève, un accord inattendu, et un frisson parcourt la nuque ou les bras. Les chercheurs parlent de frisson musical, ou chills en anglais. Il s'accompagne de changements mesurables du système nerveux autonome, celui qui règle nos fonctions corporelles sans effort conscient : rythme cardiaque, respiration, légère transpiration de la peau. Ces signes permettent de repérer avec précision le moment où le plaisir atteint son sommet. Ils offrent aux chercheurs une prise sur une émotion intime, autrement très difficile à mesurer.",
   "En 2011, Valorie Salimpoor, Robert Zatorre et leurs collègues, à Montréal, cherchent des personnes qui ressentent régulièrement ces frissons. Sur 217 candidats, huit sont retenus après plusieurs étapes de sélection. Chacun apporte sa musique préférée. Grâce à la tomographie par émission de positons (TEP), une imagerie qui suit une molécule marquée dans le cerveau, l'équipe observe une libération de dopamine dans le striatum, une structure profonde du circuit de la récompense, au moment des frissons. La dopamine est un messager chimique impliqué dans la motivation, l'apprentissage et la recherche de récompenses.",
   "L'IRM fonctionnelle, plus précise dans le temps, ajoute un détail. Juste avant le frisson, c'est le noyau caudé, une partie du striatum, qui s'active le plus. Au moment du frisson, c'est le noyau accumbens, une autre partie de ce même circuit. Le cerveau semble donc répondre à deux temps distincts : l'attente du passage aimé, puis sa réalisation. Ce résultat provient d'une petite étude, menée auprès de personnes choisies pour leur forte sensibilité à la musique. Il reste pourtant une référence de la recherche sur le plaisir musical.",
   "Une image du cerveau montre une corrélation, pas une cause. En 2019, une équipe de Barcelone teste directement le rôle de la dopamine. Vingt-sept volontaires écoutent de la musique lors de trois séances, après avoir pris de la lévodopa, qui augmente la dopamine disponible, de la rispéridone, qui bloque une partie de son action, ou un placebo. Ni les participants ni les chercheurs ne savent quel comprimé a été donné. Sous lévodopa, le plaisir déclaré et la somme que les participants acceptent de dépenser pour la musique augmentent. Sous rispéridone, les deux diminuent.",
   "Tout le monde ne vibre pas. Certaines personnes en bonne santé perçoivent normalement la musique mais n'en tirent presque aucun plaisir, alors que d'autres récompenses, comme l'argent, les motivent normalement. On parle d'anhédonie musicale spécifique. En imagerie, leur noyau accumbens réagit peu à la musique mais normalement à un jeu d'argent, et le dialogue entre leur cortex auditif et le circuit de la récompense est affaibli. Une étude publiée en 2025 sur plus de 9 000 jumeaux suédois estime que les facteurs génétiques expliquent jusqu'à 54 % des différences de sensibilité au plaisir musical."
  ],
  "plaisir": "La musique n'apporte ni nourriture ni argent, et pourtant elle sollicite le même circuit de la récompense. Une explication possible : le cerveau anticipe sans cesse la suite de ce qu'il entend. La musique joue avec ces attentes, retarde une résolution, glisse une surprise. L'anticipation s'accompagne d'une libération de dopamine, la résolution apporte le pic de plaisir. Ce plaisir naît d'un dialogue entre le cortex auditif, qui analyse les sons, et le striatum, qui leur donne une valeur. Quand ce dialogue est faible, la musique reste perçue, mais elle ne touche plus.",
  "pratique": [
   "Choisissez un morceau qui vous a déjà donné des frissons, écoutez-le au calme et à volume modéré.",
   "Repérez le moment exact du frisson et ce qui le précède : montée, silence, entrée d'une voix.",
   "À la réécoute, observez l'attente elle-même : sentez-vous le plaisir monter avant le passage ?",

 {
  "salon": "L'Ouïe",
  "title": "Protéger son oreille : volume, durée d'écoute et santé du cerveau",
  "excerpt": "Les cellules qui captent les sons ne repoussent pas chez l'humain. Les repères de l'OMS sur le volume et la durée, et ce que l'on sait du lien entre audition et déclin cognitif.",
  "tag": "Éduquer",
  "body": [
   "Tout ce que nous entendons passe par la cochlée, un petit organe en forme d'escargot logé dans l'oreille interne. Elle abrite les cellules ciliées, nommées ainsi pour les fins prolongements qui coiffent leur sommet. Quand le son fait onduler le liquide de la cochlée, ces prolongements se courbent, des canaux s'ouvrent et un signal électrique part vers le nerf auditif. Ces cellules sont fragiles. Un bruit trop fort ou trop long les fatigue, puis peut les détruire. Contrairement à celles des oiseaux ou des amphibiens, les cellules ciliées humaines ne repoussent pas : leur perte est définitive.",
   "Les signaux d'alerte sont connus : oreilles cotonneuses ou sifflement après un concert. Ce sifflement s'appelle un acouphène. Selon l'Organisation mondiale de la Santé (OMS), ces troubles passagers traduisent souvent une fatigue des cellules sensorielles, qui peuvent récupérer. Mais des expositions répétées à des sons forts ou prolongés finissent par causer des dégâts permanents, et une seule exposition à un son extrêmement fort peut suffire. Comme la perte s'installe en général progressivement, on la remarque tard : les sons aigus deviennent moins nets, puis les conversations dans le bruit plus difficiles à suivre.",
   "Le décibel (dB) mesure l'intensité d'un son. Une conversation normale tourne autour de 60 dB, un sèche-cheveux autour de 100 dB. L'échelle est trompeuse : chaque palier de 10 dB correspond à une énergie sonore dix fois plus grande. L'OMS raisonne donc en dose hebdomadaire. À 80 dB, on peut écouter sans risque jusqu'à 40 heures par semaine. À 90 dB, ce temps tombe à 4 heures. À 100 dB, à 20 minutes. Pour les concerts et festivals, l'OMS recommande aussi de ne pas dépasser 100 dB en moyenne sur 15 minutes, avec des zones calmes et des protections auditives disponibles.",
   "L'audition compte aussi pour le cerveau. En 2024, la Commission du Lancet sur la démence, un groupe international d'experts, a estimé qu'environ 45 % des cas de démence pourraient en théorie être évités ou retardés en agissant sur 14 facteurs de risque. La perte auditive non prise en charge et un taux élevé de cholestérol LDL arrivent en tête, avec environ 7 % des cas chacun. Ces chiffres sont des estimations à l'échelle d'une population, construites surtout à partir d'études d'observation. Ils traduisent une association répétée, pas la preuve qu'une perte auditive cause une démence chez une personne donnée.",
   "Pour tester un lien de cause à effet, l'essai ACHIEVE a suivi 977 personnes de 70 à 84 ans ayant une perte auditive, tirées au sort pour recevoir soit un accompagnement avec appareils auditifs, soit un programme d'éducation à la santé. Après trois ans, le déclin cognitif était le même dans les deux groupes. Une analyse prévue à l'avance suggère toutefois un bénéfice chez les participants les plus à risque. Le message est donc nuancé : bien entendre aide à communiquer et à garder des liens, et pourrait ralentir le déclin chez certaines personnes, mais ce n'est pas démontré pour tous."
  ],
  "plaisir": "Le plaisir d'écouter repose sur un dialogue entre l'oreille, le cortex auditif et le circuit de la récompense. Ce dialogue se nourrit de détails : le grain d'une voix, les aigus d'une cymbale, le petit écart qui crée la surprise. Or ce sont souvent les aigus qui s'effacent en premier quand l'audition s'abîme. Monter le son peut sembler intensifier l'émotion, mais les études sur les frissons musicaux montrent que le plaisir naît aussi du jeu des attentes et des résolutions. Protéger ses oreilles, c'est garder longtemps l'accès à ces plaisirs fins.",
  "pratique": [
   "Réglez le volume de vos écouteurs à 60 % du maximum au plus, et activez si possible le suivi de l'exposition sonore de votre téléphone.",

 {
  "salon": "L'Ouïe",
  "title": "ASMR, voix douces et sons apaisants : ce que disent les études",
  "excerpt": "Chuchotements, tapotements, gestes lents : l'ASMR offre à certains des picotements agréables et un vrai apaisement. Ce que la science confirme, et ce qu'elle ignore encore.",
  "tag": "Informer",
  "body": [
   "ASMR signifie « Autonomous Sensory Meridian Response », une expression née dans des communautés d'internautes avant d'intéresser les chercheurs. Elle désigne une sensation de picotements, comme un léger fourmillement, qui part du crâne et descend parfois dans la nuque et le dos. Elle est déclenchée par certains sons et images : chuchotements, tapotements, froissements, gestes lents, attention personnelle bienveillante. Les vidéos conçues pour la provoquer rassemblent un large public en ligne. Mais tout le monde ne la ressent pas, et ce point est essentiel pour lire les études.",
   "L'une des premières études scientifiques sur le sujet, publiée en 2015, repose sur un questionnaire en ligne rempli par 475 personnes qui disaient ressentir l'ASMR. Les déclencheurs les plus cités étaient le chuchotement, l'attention personnelle, les sons nets et les mouvements lents. Presque tous les participants (98 %) cherchaient à se détendre, 82 % s'en servaient pour s'endormir et 70 % pour gérer le stress. Les auteurs rapprochaient l'ASMR du « flow », cet état d'absorption complète dans une activité. Mais les volontaires venaient de groupes d'amateurs en ligne : l'échantillon n'est pas représentatif, et tout repose sur leurs déclarations.",
   "En 2018, une équipe britannique franchit une étape avec deux expériences. Dans la première, un peu plus de 1 000 personnes regardent en ligne des vidéos ASMR et une vidéo témoin. Les vidéos ASMR améliorent l'humeur, mais seulement chez celles qui ressentent l'ASMR. Dans la seconde, menée en laboratoire, le cœur des personnes sensibles ralentit en moyenne d'un peu plus de trois battements par minute pendant les vidéos. Dans le même temps, la conductance de la peau, un indicateur d'éveil du système nerveux, augmente. L'ASMR associe donc un apaisement et une forme d'éveil.",
   "Que se passe-t-il dans le cerveau ? Une étude d'IRM fonctionnelle menée en 2018 auprès de dix personnes sensibles à l'ASMR a observé, aux moments de détente et de picotements, une activation du noyau accumbens, lié à la récompense, et de régions associées à l'éveil émotionnel, comme l'insula et le cortex cingulaire antérieur. Selon les auteurs, ce profil rappelle celui des frissons musicaux et des comportements d'affiliation, ces gestes qui nous rapprochent des autres. Avec dix participants, ce résultat reste une piste à confirmer, pas une conclusion.",
   "Une revue publiée en 2023 dresse un bilan prudent. La recherche a progressé en dix ans, avec davantage d'essais structurés, mais des questions essentielles restent ouvertes, notamment le rôle des attentes et de l'effet placebo. Les participants sont souvent des amateurs recrutés en ligne, et les effets à long terme sur le sommeil ou l'anxiété n'ont pas été établis. L'ASMR peut être un outil de détente agréable pour les personnes qui y sont sensibles. Elle ne remplace pas un accompagnement en cas d'insomnie ou d'anxiété qui dure."
  ],
  "plaisir": "Pourquoi des chuchotements peuvent-ils faire du bien ? Beaucoup de déclencheurs de l'ASMR évoquent une attention proche et bienveillante : une voix basse, des gestes lents, des soins minutieux. Les rares données d'imagerie montrent l'activation du noyau accumbens, un nœud du circuit de la récompense, avec des régions de l'émotion. Le plaisir ressenti mêlerait ainsi récompense et sentiment de sécurité, une hypothèse encore à tester. Il dépend aussi beaucoup de chacun : les mêmes sons qui apaisent une personne peuvent en agacer une autre.",
  "pratique": [
   "Choisissez un moment calme et un volume bas : l'ASMR repose sur des sons faibles.",
   "Testez plusieurs types de sons : chuchotements, pages tournées, pluie, tapotements sur du bois.",
   "Notez ce que vous ressentez : picotements, détente, indifférence ou agacement. Toutes ces réponses sont normales.",

 {
  "salon": "L'Ouïe",
  "title": "Écoute profonde : le paysage sonore et la juste place du silence",
  "excerpt": "Un exercice d'écoute attentive pour percevoir les sons qui nous entourent, goûter les sons naturels et donner au silence sa place, sans lui prêter de pouvoirs non prouvés.",
  "tag": "Éduquer",
  "body": [
   "Nous entendons en permanence, mais nous écoutons rarement. La plupart des sons de fond restent à la lisière de notre attention, tant qu'ils ne signalent rien d'utile ou d'inattendu. L'écoute profonde, expression inventée par la compositrice américaine Pauline Oliveros, propose de faire l'inverse pendant quelques minutes : accueillir tous les sons, proches et lointains, sans les trier. On découvre alors un paysage sonore, c'est-à-dire l'environnement acoustique tel qu'une personne le perçoit, dans un lieu et un moment donnés. Le même parc ne sonne pas pareil à l'aube et à midi.",
   "Les sons de la nature tiennent une place à part. Une synthèse publiée en 2021 a rassemblé 36 publications consacrées à leurs effets sur la santé. En combinant les résultats de 18 d'entre elles, les auteurs observent une baisse du stress et de la gêne, et une amélioration de l'humeur et de la santé ressentie. Parmi les sons étudiés figurent surtout les sons d'animaux, l'eau et le vent. Ces résultats sont encourageants mais imprécis : les études sont peu nombreuses et très différentes les unes des autres.",
   "Et le silence ? En 2006, des chercheurs italiens et britanniques ont mesuré le cœur, la tension et la respiration de 24 personnes, musiciens ou non, pendant l'écoute de six styles musicaux. Une pause de deux minutes, placée au hasard dans la séance, faisait baisser la fréquence cardiaque, la pression artérielle et la ventilation, jusqu'en dessous du niveau de départ. La détente était particulièrement nette pendant cette pause. L'étude est petite et porte sur un effet immédiat, mais elle suggère que le silence se savoure surtout par contraste, après le son.",
   "On lit parfois que le silence ferait pousser de nouveaux neurones. L'idée vient d'une étude menée chez la souris, publiée en 2015. Les chercheurs ont comparé le bruit de fond habituel de l'animalerie à plusieurs conditions : bruit blanc, cris de souriceaux, musique de Mozart et silence. Une semaine plus tard, seul le silence restait associé à davantage de nouveaux neurones dans l'hippocampe, une région clé de la mémoire. Les auteurs parlent eux-mêmes d'une absence de son « non naturelle » pour l'animal. Ce résultat isolé, obtenu chez la souris, ne permet pas d'en tirer une règle pour l'humain."
  ],
  "plaisir": "Écouter, pour le cerveau, c'est aussi prédire : il anticipe sans cesse la suite de ce qu'il entend et la compare avec ce qui arrive. En musique, une étude de 2019 a montré que le plaisir dépend d'un équilibre entre incertitude et surprise. Un accord inattendu plaît quand le contexte était prévisible, un accord attendu plaît quand le contexte était incertain. L'amygdale, l'hippocampe et le cortex auditif suivent ce jeu. Une écoute attentive du paysage sonore, avec ses retours d'oiseaux et ses silences, mobilise peut-être des mécanismes voisins, mais cela reste à démontrer.",

  "title": "Le cerveau devant la beauté : ce que montrent les scanners, et leurs limites",
  "excerpt": "Une zone à l'avant du cerveau réagit quand une œuvre nous semble belle. La neuroesthétique a pourtant ses limites : voici ce qui est solide et ce qui reste ouvert.",

  "body": [
   "Que se passe-t-il dans la tête quand un tableau nous paraît beau ? En 2011, Tomohiro Ishizu et Semir Zeki ont posé la question à 21 volontaires placés dans un appareil d'IRM fonctionnelle, une technique qui suit les variations du débit sanguin dans le cerveau. Les participants regardaient des peintures et écoutaient des extraits musicaux qu'ils avaient classés comme beaux, indifférents ou laids. Une seule région s'activait pour la beauté visuelle comme pour la beauté musicale : une partie du cortex orbitofrontal médian, situé à l'avant du cerveau, juste au-dessus des yeux. Plus la beauté déclarée était intense, plus cette activité était forte.",
   "Une autre équipe a cherché ce qui distingue les œuvres qui nous bouleversent. En 2012, Edward Vessel et ses collègues ont montré 109 images d'œuvres, surtout des peintures, à 16 personnes. Chacune indiquait sur une échelle de 1 à 4 à quel point l'œuvre l'émouvait. Dans les régions visuelles et dans le striatum, une structure profonde liée à la récompense, l'activité suivait la note de façon graduelle. En revanche, plusieurs régions du réseau du mode par défaut, un ensemble actif quand on pense à soi, ne s'allumaient que pour les œuvres notées 4. Les œuvres les plus fortes semblent donc toucher quelque chose de personnel.",
   "Ce point compte, car les goûts différaient beaucoup. Dans l'étude de 2012, les participants s'accordaient très peu sur les œuvres qui les émouvaient. En 2018, la même équipe a comparé plusieurs types d'images. L'accord entre les personnes était élevé pour les visages et les paysages naturels. Il était nettement plus faible pour l'architecture et les œuvres d'art. Notre goût pour la nature paraît donc assez partagé, alors que notre goût artistique reste en grande partie individuel, façonné par l'histoire et l'expérience de chacun.",
   "La neuroesthétique, l'étude du cerveau face à l'expérience esthétique, a aussi ses limites. Les échantillons sont souvent petits, une vingtaine de personnes. L'imagerie montre des corrélations, pas des causes. Voir une zone s'allumer ne dit pas non plus ce que la personne ressent. L'idée d'un « centre de la beauté » demande donc de la prudence. En 2020, Martin Skov et Marcos Nadal ont proposé de recentrer le domaine. Selon eux, aucun circuit n'est réservé à l'art. La vraie question est de comprendre comment une sensation, quelle qu'elle soit, acquiert une valeur de plaisir."

  "title": "Lumière, horloge et humeur : ce que l'œil capte sans que nous le sachions",
  "excerpt": "Des cellules de la rétine mesurent la lumière pour régler notre horloge interne. Lumière du jour, lumière du soir, mélatonine et humeur : l'état des connaissances.",
  "tag": "Informer",
  "body": [
   "Notre œil ne sert pas seulement à voir. La rétine contient des cellules ganglionnaires dites intrinsèquement photosensibles, appelées ipRGC. Elles possèdent un pigment, la mélanopsine, surtout sensible à la lumière bleu-vert, autour de 480 nanomètres. Ces cellules ne forment pas d'images. Elles évaluent la quantité de lumière ambiante et transmettent l'information au noyau suprachiasmatique, l'horloge centrale située dans l'hypothalamus, à la base du cerveau. Cette horloge synchronise nos rythmes sur environ 24 heures : sommeil, vigilance, température du corps et sécrétion de certaines hormones.",
   "Parmi ces hormones, la mélatonine augmente le soir et prépare l'organisme au sommeil. Une lumière vive en soirée freine sa production et décale l'horloge. En 2022, un groupe d'experts internationaux a publié des repères chiffrés. Ils utilisent une unité adaptée, le lux mélanopique, qui exprime l'effet de la lumière sur la mélanopsine, mesuré à hauteur des yeux. Le jour, ils recommandent au moins 250 lux mélanopiques. Le soir, à partir de trois heures avant le coucher, au plus 10. Pendant le sommeil, au plus 1. Ces repères visent des adultes en bonne santé.",
   "Qu'en est-il de l'humeur ? En 2023, Angus Burns et ses collègues ont analysé les données de plus de 86 000 participants de la UK Biobank, une vaste cohorte britannique. Chacun avait porté au poignet un capteur de lumière pendant une semaine. Les personnes les plus exposées à la lumière la nuit présentaient un risque plus élevé de dépression, d'anxiété généralisée, de stress post-traumatique ou d'automutilation. À l'inverse, davantage de lumière le jour était associé à un risque plus faible pour plusieurs de ces troubles. Les chercheurs ont tenu compte de nombreux facteurs, comme l'âge, le travail de nuit ou l'activité physique.",
   "Ce résultat se lit avec prudence. L'étude est observationnelle : elle montre une association, pas une cause. Une personne déprimée peut mal dormir, rester éveillée la nuit lumière allumée et sortir moins. Le lien pourrait donc aller dans l'autre sens. Les essais contrôlés apportent des preuves plus solides, dans un cadre précis. Une méta-analyse de 2025, qui combine 11 essais et 858 patients, conclut que la luminothérapie, une exposition encadrée à une lampe très lumineuse, améliore la rémission de la dépression non saisonnière lorsqu'elle s'ajoute au traitement habituel. Ce soin se discute avec un médecin."

  "plaisir": "Le bien-être d'un matin lumineux a-t-il une base cérébrale ? Chez la souris, une étude de 2018 a identifié une voie qui relie les ipRGC à une petite région du thalamus, le noyau périhabénulaire, connectée à des centres qui régulent l'humeur. Cette voie est nécessaire pour que la lumière modifie le comportement émotionnel de l'animal, indépendamment de l'horloge. Chez l'humain, on ignore encore si un circuit équivalent explique le plaisir ressenti à la lumière du jour. L'hypothèse est sérieuse, mais elle repose pour l'instant sur des travaux chez l'animal.",

  "excerpt": "Une vue sur des arbres aide-t-elle à récupérer ? De l'étude d'Ulrich aux fractales : ce qui est solide, ce qui est discuté, et ce que cela dit du plaisir de regarder.",
  "tag": "Informer",
  "body": [
   "En 1984, le chercheur Roger Ulrich publie dans la revue Science une étude devenue célèbre. Il a consulté les dossiers de patients opérés de la vésicule biliaire dans un hôpital de Pennsylvanie, entre 1972 et 1981. Vingt-trois patients avaient une chambre avec vue sur des arbres. Vingt-trois autres, de profil comparable, voyaient un mur de briques. Les premiers sont restés un peu moins longtemps à l'hôpital. Ils ont reçu moins de remarques négatives dans les notes des infirmières et ont pris moins d'antidouleurs puissants.",
   "Ce résultat est souvent présenté comme une preuve. Il s'agit pourtant d'une petite étude rétrospective, c'est-à-dire fondée sur des dossiers anciens, menée dans un seul hôpital et sans tirage au sort des chambres. Elle a ouvert une piste sans la refermer. Pour expliquer l'effet, Rachel et Stephen Kaplan ont proposé la théorie de la restauration de l'attention. Selon elle, l'attention dirigée, celle qui sert à se concentrer, s'épuise. La nature offrirait une « fascination douce » : elle retient le regard sans effort, ce qui laisserait cette attention se reposer.",
   "Que disent les données ? Une revue systématique publiée en 2018 a rassemblé 42 articles comparant des environnements naturels à des environnements témoins. Elle comprend une méta-analyse, une méthode qui combine les résultats de plusieurs études. Les effets les plus nets portent sur la mémoire de travail, qui garde une information en tête quelques secondes, et sur la flexibilité cognitive, la capacité à passer d'une tâche à l'autre. L'effet sur le contrôle de l'attention est moins fiable. Les effets sont faibles à modérés, plus marqués en extérieur réel qu'avec des images. Les auteurs relèvent aussi des définitions floues de l'attention.",
   "Reste le regard lui-même. Les fractales sont des motifs qui se répètent à différentes échelles, comme les branches d'un arbre ou le contour d'un nuage. En 2003, Branka Spehar, Richard Taylor et leurs collègues ont montré qu'en moyenne, on préfère les fractales de complexité intermédiaire, qu'elles viennent de photos de nature, de simulations par ordinateur ou de toiles de Jackson Pollock. En 2016, la même équipe a nuancé : environ la moitié des participants suivaient ce profil, d'autres préféraient des motifs plus lisses ou plus détaillés. La préférence existe en moyenne, mais elle n'est pas universelle."

 {
  "salon": "La Vue",
  "title": "Apprendre à regarder : lenteur, couleurs et émerveillement",
  "excerpt": "Une vingtaine de secondes devant un tableau, c'est la norme. Ralentir, observer ses associations de couleurs, cultiver l'émerveillement : regarder s'apprend.",
  "tag": "Éduquer",
  "body": [
   "Combien de temps passons-nous devant une œuvre ? En 2017, Lisa Smith, Jeffrey Smith et Pablo Tinio ont chronométré des visiteurs de l'Art Institute of Chicago. Le temps moyen passé devant une œuvre était d'environ 29 secondes, et la durée médiane de 21 secondes : une fois sur deux, le regard s'attardait moins longtemps. Ces chiffres étaient très proches de ceux d'une étude menée en 2001 au Metropolitan Museum de New York. Face à ce constat, des éducateurs défendent l'observation lente, ou « slow looking ». La chercheuse Shari Tishman, du groupe Project Zero à Harvard, lui a consacré un livre en 2018.",
   "Regarder, c'est aussi associer. Les couleurs évoquent-elles les mêmes émotions partout ? Domicele Jonauskaite et une large équipe internationale ont interrogé 4 598 personnes de 30 pays, parlant 22 langues. Chaque participant reliait 12 noms de couleurs à 20 émotions. Les profils se ressemblaient fortement d'un pays à l'autre. Le rouge était lié à l'amour et à la colère, le noir à la tristesse et à la peur, le jaune à la joie, le rose à l'amour et au plaisir, le blanc au soulagement.",
   "Ces associations ne sont pourtant pas totalement universelles. Le pays de chaque participant permettait de prédire ses réponses au-delà du socle commun. Les pays proches par la langue ou la géographie se ressemblaient davantage. L'étude relève aussi des particularités : en Chine, le blanc est également associé à la tristesse ; en Grèce, le violet l'est aussi ; en Égypte, le jaune n'est pas lié à la joie. Nos réactions aux couleurs mêlent donc un fond partagé et une part apprise, qui dépend de la langue, des traditions et du lieu où l'on vit.",
   "Dernier ingrédient : l'émerveillement, cette émotion ressentie devant quelque chose de vaste qu'on ne comprend pas tout de suite. Virginia Sturm et ses collègues ont proposé à 60 personnes âgées en bonne santé une marche de 15 minutes par semaine pendant 8 semaines. Une partie d'entre elles, tirée au sort, était invitée à chercher l'émerveillement en chemin. Ce groupe a ressenti plus de joie et plus d'émotions tournées vers les autres. Sur leurs selfies, les marcheurs occupaient de moins en moins de place et souriaient davantage. Les scores d'anxiété et de dépression, eux, n'ont pas changé."

  "plaisir": "Que fait le cerveau pendant l'émerveillement ? En 2019, Michiel van Elk et ses collègues ont montré à 32 personnes, en IRM fonctionnelle, une technique qui suit l'activité cérébrale, des vidéos de paysages grandioses : montagnes, océans, vols d'oiseaux. Pendant ces vidéos, plusieurs régions du réseau du mode par défaut, impliqué dans les pensées tournées vers soi, étaient moins actives qu'avec des vidéos simplement agréables. Cela concorde avec le « petit soi » décrit par les participants. Le plaisir de l'émerveillement passerait par un regard absorbé, où l'on s'oublie un peu. Une seule étude ne suffit pas : ce résultat reste à confirmer.",

 {

  "title": "La proprioception, le sens qui sait où se trouve votre corps",
  "excerpt": "Fermez les yeux et touchez votre nez : c'est la proprioception. Capteurs, gène PIEZO2 et plaisir du geste maîtrisé, ce sens discret mérite qu'on s'y arrête.",
  "tag": "Informer",
  "body": [
   "Fermez les yeux et touchez le bout de votre nez. Vous y parvenez sans voir votre main grâce à la proprioception, le sens de la position et du mouvement de son propre corps. Ce sens ne repose pas sur un organe unique. Des capteurs répartis dans les muscles, les tendons, les articulations et la peau informent le cerveau en continu. Les fuseaux neuromusculaires, de petites structures logées dans les muscles, signalent leur étirement. Les organes tendineux de Golgi, placés à la jonction entre muscle et tendon, renseignent sur la tension.",
   "Aucun capteur ne donne à lui seul la position d'un bras. C'est l'ensemble des signaux, combinés par le cerveau et rapportés à une carte interne du corps, qui produit cette sensation. La proprioception renseigne aussi sur l'effort fourni, la force et le poids des objets. Elle n'est pas figée. Un exercice intense peut la perturber pour un temps. Elle s'émousse avec l'âge, ce qui est associé à un risque de chute plus élevé chez les personnes âgées.",
   "Comment un étirement devient-il un signal nerveux ? En 2015, une équipe a montré chez la souris que le canal Piezo2 est présent dans les terminaisons nerveuses des fuseaux et des organes tendineux. Un canal ionique est une protéine qui laisse passer des charges électriques ; Piezo2 s'ouvre quand la membrane de la cellule se déforme. Les souris privées de Piezo2 dans ces neurones bougeaient de façon très mal coordonnée. Ardem Patapoutian, dont l'équipe a découvert les canaux Piezo, a reçu en 2021 le prix Nobel de médecine avec David Julius pour leurs travaux sur les récepteurs du toucher et de la température.",
   "Chez l'humain, la confirmation est venue de deux patientes. En 2016, Alexander Chesler et ses collègues ont décrit une jeune femme et une enfant porteuses de mutations qui inactivent le gène PIEZO2. Leur proprioception était profondément diminuée. Les yeux fermés, elles ne pouvaient pas marcher et leurs gestes de pointage devenaient imprécis. Elles percevaient mal les vibrations et le toucher fin. Pourtant, elles marchaient, parlaient et écrivaient, en s'appuyant beaucoup sur la vue. Ces cas rares montrent à la fois le rôle central de PIEZO2 et la capacité du cerveau à compenser."
  ],
  "plaisir": "Pourquoi un geste maîtrisé fait-il plaisir ? Le cerveau ne se contente pas de recevoir des signaux, il anticipe aussi les effets de nos mouvements. Proske et Gandevia rapportent même que des zones motrices peuvent créer seules la sensation qu'un membre bouge quand les nerfs sont bloqués. Lorsque le résultat colle à l'intention, nous ressentons du contrôle. Une étude de 2015 suggère que ce sentiment agit lui-même comme une récompense : les participants choisissaient plus souvent et plus vite les actions qui leur donnaient prise sur leur environnement. Les auteurs soulignent que ce lien demande encore à être confirmé.",

 {
  "salon": "Au-delà des cinq sens",
  "title": "L'intéroception : sentir son cœur, sa faim et son souffle",
  "excerpt": "Percevoir ses battements de cœur, sa faim, sa respiration : l'intéroception relie le corps aux émotions. Ce que l'on sait de l'insula et ce que valent vraiment les mesures.",
  "tag": "Informer",
  "body": [
   "L'intéroception désigne la perception de l'état interne du corps : battements du cœur, respiration, faim, soif, température, tensions de l'estomac. La plupart du temps, ces signaux restent en arrière-plan. Ils deviennent conscients quand ils changent ou quand on y prête attention. Le neuroanatomiste Bud Craig a proposé un modèle influent de leur trajet dans le cerveau. Selon lui, ils forment d'abord une carte de base dans la partie arrière de l'insula, une région du cortex cachée dans un repli profond du cerveau. Ils sont ensuite réélaborés, étape par étape, vers l'avant de cette région.",
   "Dans ce modèle, l'insula antérieure intègre l'état du corps avec l'environnement, la motivation et la valeur de plaisir des situations. Craig recense de nombreuses expériences qui l'activent : la soif, le manque d'air, le toucher doux, la fraîcheur, la chaleur ou l'attention portée à son propre cœur. Elle s'active aussi pendant presque toutes les émotions étudiées en imagerie cérébrale. Pour Craig, elle pourrait être le lieu où se construit, à chaque instant, le sentiment d'exister. Cette dernière idée reste une hypothèse discutée.",
   "Comment mesure-t-on l'intéroception ? Souvent, on demande de percevoir ou de compter ses battements de cœur sans prendre son pouls. En 2004, Hugo Critchley et ses collègues ont observé, en imagerie, que l'activité de l'insula antérieure droite prédisait la précision des participants à ce type de tâche. Le volume de matière grise de cette zone était lié à la fois à cette précision et au ressenti corporel déclaré. Les personnes les plus précises rapportaient aussi des émotions négatives plus intenses. Ces résultats soutiennent l'idée que nos émotions s'appuient en partie sur la perception du corps.",
   "En 2015, Sarah Garfinkel et ses collègues ont distingué trois dimensions chez 80 personnes. La précision intéroceptive est la performance objective, par exemple détecter ses battements. La sensibilité intéroceptive est ce que l'on pense percevoir, mesuré par questionnaire. La conscience intéroceptive consiste à savoir si l'on est précis ou non. Ces trois dimensions étaient largement indépendantes : se croire à l'écoute de son corps ne garantit pas de le percevoir juste. En 2025, une équipe belge a aussi montré que les outils actuels mesurent mal ces dimensions, ce qui invite à la prudence face aux résultats publiés."
  ],
  "plaisir": "Plusieurs plaisirs simples sont intéroceptifs : boire quand on a soif, respirer à fond après un effort, sentir la chaleur revenir dans des mains froides. Dans le modèle de Craig, l'insula reçoit un signal venu du striatum ventral, une structure clé de la récompense. Ce signal colorerait l'état du corps de plaisir ou de déplaisir. Un même signal corporel peut ainsi devenir agréable quand il répond à un besoin. L'imagerie montre aussi que l'insula antérieure réagit à des expériences plaisantes, comme une musique appréciée. Le détail de ces circuits reste à préciser.",

  "excerpt": "Pourquoi un hamac ou une balançoire nous apaisent-ils ? Système vestibulaire, bercement et sommeil : ce que disent les études, et leurs limites.",
  "tag": "Informer",
  "body": [
   "Dans l'oreille interne, à côté de l'organe de l'audition, se trouve le système vestibulaire. Il comprend trois canaux semi-circulaires, qui détectent les rotations de la tête, et deux petits organes otolithiques, sensibles aux accélérations en ligne droite et à la gravité. Ces informations servent à garder l'équilibre et à stabiliser le regard. Leur rôle va plus loin. Le chercheur Christophe Lopez rappelle que le réseau vestibulaire du cortex, centré sur une région voisine de l'insula, contribue aussi à la perception de l'espace, du corps et de soi.",
   "On berce les bébés depuis toujours. Chez l'adulte, l'équipe genevoise de Laurence Bayer et Sophie Schwartz a étudié la question. En 2019, 18 jeunes adultes en bonne santé ont dormi une nuit dans un lit qui oscillait doucement, et une autre nuit dans le même lit immobile. Avec le bercement, ils se sont endormis plus vite, ont passé plus de temps en sommeil profond et se sont moins réveillés. Leur mémoire, testée le soir puis le matin, s'était aussi mieux consolidée. Un travail antérieur de la même équipe avait déjà montré un endormissement plus rapide pendant une sieste.",
   "Comment l'expliquer ? Le rythme du bercement semble synchroniser certaines ondes du sommeil profond : les oscillations lentes et les fuseaux, de brèves bouffées d'activité liées à la mémoire. Ces ondes apparaissaient en lien avec le cycle de balancement. Chez la souris, une étude publiée en même temps a montré que le bercement augmente le sommeil, mais seulement si les organes otolithiques fonctionnent. Des souris mutantes incapables de percevoir les accélérations en ligne droite n'y réagissaient pas. Le système vestibulaire serait donc la porte d'entrée de cet effet, du moins chez l'animal.",
   "Ces résultats restent fragiles. Les études humaines portent sur de petits groupes, souvent jeunes. En 2020, une équipe suisse a testé un lit oscillant chez 19 adultes de plus de 60 ans. Le bercement n'a pas accéléré l'endormissement, n'a pas augmenté les fuseaux et n'a pas approfondi le sommeil. La vitesse, l'amplitude et le type de mouvement les plus favorables restent à préciser. Il est donc trop tôt pour présenter le bercement comme une solution aux troubles du sommeil. En cas d'insomnie durable, mieux vaut consulter un professionnel de santé."

  "salon": "Au-delà des cinq sens",
  "title": "Chaud, froid et alliesthésie : quand l'état du corps décide du plaisir",
  "excerpt": "La même eau fraîche peut sembler délicieuse ou désagréable. Le physiologiste Michel Cabanac a nommé ce phénomène alliesthésie. Explications et exercice pratique.",
  "tag": "Éduquer",
  "body": [
   "Plongez la main dans une eau fraîche après un après-midi de canicule : c'est délicieux. Faites-le après une longue marche dans le froid : c'est désagréable. La température de l'eau est la même. C'est votre état interne qui a changé. En 1971, le physiologiste français Michel Cabanac a donné un nom à ce phénomène : l'alliesthésie, du grec « autre » et « sensation ». Une même stimulation peut être agréable ou désagréable selon l'état du corps. Dans ses expériences, des volontaires plongeaient une main dans une eau à température réglée et notaient leur plaisir, selon que leur corps était refroidi ou réchauffé.",
   "Pour Cabanac, ce plaisir a une fonction. Il signale ce qui est utile au corps à un moment donné. Quand la température interne s'éloigne de sa valeur de référence, une stimulation qui aide à y revenir devient agréable. Le plaisir guide alors le comportement : chercher l'ombre, se couvrir, boire. Cabanac observait la même logique pour le goût et l'odorat. Il estimait en revanche que le plaisir lié à la vue ou à l'ouïe varie peu selon l'état interne, car aucune constante du corps ne dépend directement d'une couleur ou d'un son.",
   "Comment la peau perçoit-elle le chaud et le froid ? Grâce à des canaux ioniques de la famille TRP, des protéines des neurones sensoriels qui laissent passer des charges électriques quand la température change. Le canal TRPV1, identifié en 1997 par l'équipe de David Julius, réagit à la chaleur forte et à la capsaïcine du piment. Le canal TRPM8, identifié en 2002, réagit à la fraîcheur et au menthol : voilà pourquoi la menthe paraît fraîche. Ces découvertes ont valu à David Julius le prix Nobel de médecine 2021, partagé avec Ardem Patapoutian.",
   "Les récepteurs mesurent la température, mais ils ne décident pas seuls du plaisir. Les chercheurs en confort thermique Thomas Parkinson et Richard de Dear distinguent le confort, cet état neutre où l'on ne pense pas à la température, du plaisir thermique. Ce dernier naît plutôt des changements et des contrastes : un souffle frais sur le visage quand le corps a chaud, une boisson chaude quand on a froid. Lorsqu'un contraste local touche une seule partie du corps, ils parlent d'alliesthésie spatiale."

  "salon": "Corps en mouvement",
  "title": "L'euphorie du coureur : et si ce n'étaient pas les endorphines ?",
  "excerpt": "On attribue le « runner's high » aux endorphines. Les études récentes désignent plutôt les endocannabinoïdes, des messagers fabriqués par le corps.",
  "tag": "Informer",
  "body": [
   "Après une longue sortie à allure régulière, certains coureurs décrivent un état particulier : légèreté, calme, douleur qui s'efface, parfois une vraie euphorie. Les anglophones l'appellent « runner's high ». Pendant des décennies, l'explication semblait évidente : les endorphines, des opioïdes produits par le corps, envahiraient le cerveau. L'idée repose sur des observations. En 2008, une équipe allemande a examiné dix athlètes par TEP, une imagerie qui suit des molécules marquées dans le cerveau. Après deux heures de course, elle a vu des signes de libération d'opioïdes dans des régions liées aux émotions. Plus les coureurs se disaient euphoriques, plus ce signal était net.",
   "Une corrélation ne prouve pas une cause. Autre problème : les endorphines présentes dans le sang franchissent mal la barrière hémato-encéphalique, le filtre qui protège le cerveau. En 2015, l'équipe de Johannes Fuss a donc testé une autre piste chez la souris : les endocannabinoïdes. Ce sont des messagers fabriqués par le corps, qui agissent sur les mêmes récepteurs que le cannabis. Après avoir couru dans leur roue, les souris étaient moins anxieuses et moins sensibles à la douleur. Quand les chercheurs bloquaient les récepteurs cannabinoïdes, ces effets disparaissaient. Bloquer les récepteurs opioïdes ne changeait rien. Une limite évidente : on ne peut pas demander à une souris si elle se sent euphorique.",
   "Il fallait donc vérifier chez l'humain. En 2021, la même équipe a recruté 63 sportifs d'endurance réguliers. Ils ont couru 45 minutes à intensité modérée sur un tapis, et marché dans une condition de comparaison. Les volontaires recevaient soit de la naltrexone, un médicament qui bloque les récepteurs opioïdes, soit un placebo, sans que ni eux ni les chercheurs sachent lequel. La course augmentait l'euphorie et réduisait l'anxiété par rapport à la marche. Elle faisait aussi monter dans le sang deux endocannabinoïdes, l'anandamide et le 2-AG. Bloquer les opioïdes n'empêchait aucun de ces effets. La part de personnes décrivant un vrai « high » était la même avec ou sans naltrexone.",
   "Faut-il oublier les endorphines ? Pas tout à fait. L'imagerie de 2008 suggère qu'elles participent à l'expérience. Mais les données actuelles indiquent qu'elles ne sont pas nécessaires à l'euphorie, et désignent les endocannabinoïdes comme de bons candidats. L'intensité compte aussi. En 2012, une étude a mesuré ces molécules chez l'humain, le chien et le furet. Elles augmentaient après une course soutenue chez l'humain et le chien, deux coureurs d'endurance, mais pas après une marche lente, ni chez le furet. Les auteurs y voient une récompense qui aurait encouragé nos ancêtres à courir longtemps. Cette lecture évolutionniste reste une hypothèse."

 {
  "salon": "Corps en mouvement",
  "title": "Danser ensemble : synchronie, douleur apaisée et envie de bouger",
  "excerpt": "Bouger au même rythme que d'autres relève le seuil de douleur et rapproche. Et la musique qui « groove » sollicite les circuits du mouvement et de la récompense.",
  "tag": "Informer",
  "body": [
   "La danse en groupe existe dans presque toutes les cultures. Pourquoi tant d'énergie pour bouger ensemble ? À l'université d'Oxford, Bronwyn Tarr et Robin Dunbar défendent une hypothèse : la danse servirait à créer du lien. Elle s'appuierait sur les endorphines, ces opioïdes fabriqués par le corps, impliqués dans l'attachement chez les primates. L'équipe ne mesure pas directement ces molécules. Elle utilise un indicateur indirect : le seuil de douleur, c'est-à-dire la pression à partir de laquelle une sensation devient désagréable. Si ce seuil monte, c'est le signe probable qu'un système antidouleur interne s'est mis en route.",
   "Dans une première étude, publiée en 2015, 264 adolescents scolarisés sur l'île de Marajó, au Brésil, ont dansé par groupes de trois. Les chercheurs ont fait varier deux choses. L'effort : grands mouvements debout, ou petits gestes des mains en restant assis. La synchronie : tous les mêmes gestes au même moment, ou des gestes différents sur la même musique. Le seuil de douleur était mesuré avec un brassard de tension gonflé peu à peu. Résultat : l'effort et la synchronie relevaient chacun le seuil de douleur, indépendamment l'un de l'autre. Chacun augmentait aussi le sentiment de proximité avec les partenaires de danse.",
   "En 2016, l'équipe a affiné l'expérience avec un dispositif de « silent disco » : chacun danse avec un casque sur les oreilles. Les chercheurs pouvaient ainsi faire danser des inconnus en synchronie complète, partielle ou pas du tout. Seuls ceux qui bougeaient vraiment ensemble voyaient leur seuil de douleur monter, et se sentaient plus proches des autres. En revanche, ils ne coopéraient pas davantage dans un jeu économique. La danse renforcerait donc le sentiment de proximité, sans forcément rendre plus généreux. Gardons une réserve : le seuil de douleur reste un indicateur indirect, qui ne prouve pas à lui seul le rôle des endorphines.",
   "Reste une question : pourquoi certaines musiques donnent-elles irrésistiblement envie de bouger ? Les chercheurs appellent « groove » ce désir agréable de bouger en rythme. En 2014, Maria Witek et ses collègues ont fait écouter en ligne des rythmes de batterie funk plus ou moins syncopés. La syncope, c'est un accent placé là où l'oreille ne l'attend pas. Ce sont les rythmes moyennement syncopés qui donnaient le plus envie de bouger et le plus de plaisir, surtout chez les amateurs de danse. Trop simple, le rythme lasse. Trop complexe, on perd le fil. La courbe dessine un U inversé."
  ],
  "plaisir": "En 2020, une étude en IRM fonctionnelle, une imagerie qui suit l'activité des régions du cerveau, a fait écouter ce type de rythmes à des musiciens et à des non-musiciens. Les rythmes de complexité moyenne activaient à la fois les zones qui perçoivent la pulsation et celles de la récompense. Dans les noyaux gris centraux, des structures profondes qui relient mouvement et motivation, l'activité suivait le plaisir et l'envie de bouger déclarés. Les auteurs proposent un modèle : le cerveau construit la pulsation, anticipe le prochain temps fort, et le jeu entre ces attentes et les surprises de la syncope nourrit le plaisir.",

 {
  "salon": "Corps en mouvement",
  "title": "Bouger contre la déprime : ce que disent vraiment les études",
  "excerpt": "Marche, yoga, musculation : une vaste analyse parue dans le BMJ en 2024 montre un effet réel de l'exercice sur la dépression. Avec des limites à connaître.",
  "tag": "Informer",
  "body": [
   "La dépression n'est pas une simple tristesse passagère. C'est une maladie qui touche l'humeur, le sommeil, l'énergie et la capacité à éprouver du plaisir. On sait depuis longtemps que l'activité physique aide. La vraie question est : à quel point, et quel exercice ? En 2024, Michael Noetel et ses collègues ont publié dans le BMJ une méta-analyse en réseau. Une méta-analyse regroupe les résultats de nombreuses études. La version « en réseau » permet en plus de comparer des traitements qui n'ont jamais été testés côte à côte, comme la marche et la musculation.",
   "Les auteurs ont rassemblé 218 essais randomisés, soit plus de 14 000 personnes souffrant de dépression. Par rapport à des groupes témoins actifs, comme les soins habituels ou un comprimé placebo, l'effet était modéré pour la marche ou le jogging, le yoga, la musculation, les exercices aérobies variés, le tai-chi et le qi gong. La marche et le jogging arrivaient en tête. Plus l'intensité prescrite était élevée, plus l'effet était marqué. Le yoga et la musculation étaient les mieux acceptés par les participants. Pour les auteurs, l'exercice pourrait compter parmi les traitements de base, à côté de la psychothérapie et des antidépresseurs.",
   "Ces résultats demandent de la prudence. Un seul des 218 essais présentait un faible risque de biais selon les critères Cochrane, une référence internationale pour juger la qualité des études. La confiance dans les résultats est donc jugée faible pour la marche et le jogging, et très faible pour les autres activités. Une raison simple : on ne peut pas faire du sport « à l'aveugle ». Les participants savent qu'ils bougent et s'attendent à aller mieux, ce qui peut gonfler l'effet. Les auteurs suggèrent d'ailleurs, pour les futures études, de mieux contrôler ces attentes.",
   "Une revue Cochrane mise à jour en janvier 2026 arrive à des conclusions proches, avec plus de retenue. Sur 73 essais, l'exercice réduirait modérément les symptômes par rapport à l'absence de traitement, avec un niveau de preuve jugé faible. L'effet diminue quand on ne garde que les essais les plus rigoureux. Face à une psychothérapie, il ferait à peu près jeu égal. Face aux antidépresseurs aussi, mais sur la base de quelques petits essais. Les suivis à long terme sont rares. Message pratique : bouger est une aide sérieuse, pas un substitut automatique. Toute modification d'un traitement se décide avec un médecin. En cas d'idées noires, il faut consulter sans attendre."
  ],
  "plaisir": "La dépression abîme souvent le plaisir : on parle d'anhédonie. Les neurosciences distinguent deux faces de la récompense. D'un côté, l'envie : l'élan qui pousse à aller chercher quelque chose, où la dopamine joue un grand rôle. De l'autre, le plaisir ressenti sur le moment. Une revue de 2011 propose de mieux séparer ces deux faces, car dans la dépression c'est souvent l'élan qui manque, autant que le plaisir lui-même. D'où une piste concrète : ne pas attendre d'avoir envie pour bouger. Le plaisir vient parfois pendant ou après l'effort. Les mécanismes exacts de l'effet antidépresseur restent à l'étude.",
  "pratique": [

   "Fixez un objectif minuscule : 10 minutes, trois fois cette semaine.",
   "Notez votre humeur de 0 à 10 avant et après chaque séance.",

  "title": "Combien bouger, et comment y prendre plaisir",
  "excerpt": "150 à 300 minutes par semaine, 7 000 pas par jour, du renforcement musculaire : les repères scientifiques, et pourquoi le plaisir aide à s'y tenir.",
  "tag": "Éduquer",
  "body": [
   "En 2020, l'Organisation mondiale de la santé (OMS) a mis à jour ses recommandations. Pour les adultes de 18 à 64 ans, elle conseille 150 à 300 minutes par semaine d'activité d'intensité modérée, ou 75 à 150 minutes d'activité intense, ou un mélange des deux. En pratique, une activité modérée accélère le souffle tout en permettant de parler. Une activité intense ne laisse dire que quelques mots. S'y ajoutent au moins deux jours par semaine de renforcement musculaire, qui fait travailler les grands groupes de muscles. Pour les plus de 65 ans, l'OMS recommande en plus, au moins trois jours par semaine, des activités variées qui travaillent l'équilibre et la force, pour prévenir les chutes.",
   "L'OMS insiste aussi sur deux messages simples. D'abord, un peu d'activité vaut mieux que rien : des bénéfices apparaissent déjà en dessous des seuils recommandés. Inutile donc de renoncer parce que 150 minutes paraissent hors de portée. Ensuite, il faut limiter le temps passé assis. Remplacer ce temps par une activité de n'importe quelle intensité, même légère, apporte des bénéfices. Monter un escalier, marcher pendant un appel, jardiner : tout compte. Ces recommandations s'adressent à la population générale. En cas de maladie chronique ou de reprise après une longue pause, un avis médical permet d'adapter le rythme.",
   "Et les fameux 10 000 pas ? Ce chiffre circule depuis longtemps sans base scientifique solide. En 2022, Amanda Paluch et ses collègues ont regroupé les données de 15 cohortes, soit environ 47 500 adultes suivis pendant sept ans environ. Ce sont des études observationnelles : elles montrent une association, pas une relation de cause à effet. Plus les personnes marchaient, plus leur risque de décès était bas, jusqu'à un plateau. Ce plateau se situait vers 6 000 à 8 000 pas par jour après 60 ans, et vers 8 000 à 10 000 pas avant 60 ans.",
   "Une méta-analyse plus large, publiée en 2025 dans la même revue, étend ce constat à plusieurs problèmes de santé. Par rapport à 2 000 pas par jour, 7 000 pas étaient associés à un risque de décès inférieur de 47 %, et à moins de démence, de symptômes dépressifs et de chutes. Pour les auteurs, 10 000 pas restent un bon objectif pour les plus actifs, mais 7 000 pas représentent déjà un gain important et plus réaliste. Là encore, il s'agit d'associations : les grands marcheurs diffèrent aussi des autres par leur santé et leur mode de vie.",
   "Ces chiffres ne servent à rien si l'on abandonne au bout de trois semaines. Une revue de 2015 portant sur 24 études apporte un éclairage utile. Quand une séance d'intensité modérée procure des sensations plus agréables pendant l'effort, les personnes ont tendance à être plus actives par la suite. Curieusement, l'humeur mesurée après la séance ne prédisait pas la pratique future. Conclusion pratique : choisir une activité et une intensité qui font du bien sur le moment, quitte à commencer doucement."

  "plaisir": "Pourquoi le ressenti pendant l'effort pèse-t-il autant ? Notre cerveau apprend en permanence à partir des récompenses : une expérience agréable laisse une trace qui rend plus probable de la répéter. Les auteurs de la revue de 2015 inscrivent leurs résultats dans ce cadre, celui des théories hédoniques : nous tendons à revenir vers ce qui fait du bien et à éviter ce qui fait souffrir. Une séance vécue comme pénible laisse un souvenir qui freine la suivante. Le plaisir n'est donc pas un bonus. C'est un moteur de la régularité. À chacun de chercher ce qui rend l'effort agréable : musique, compagnie, nature, jeu.",

 {

  "title": "Le sommeil, premier soin : nettoyage du cerveau, durée et bain chaud",
  "excerpt": "Le cerveau se nettoie-t-il la nuit ? Où en est le débat, combien d'heures dormir, et pourquoi un bain chaud une à deux heures avant le coucher peut aider.",
  "tag": "Éduquer",
  "body": [
   "En 2013, l'équipe de Maiken Nedergaard publie dans la revue Science un résultat qui fera le tour du monde. Chez la souris, pendant le sommeil naturel ou sous anesthésie, l'espace entre les cellules du cerveau augmente d'environ 60 %. Le liquide cérébrospinal, qui baigne le cerveau, circule alors mieux entre les cellules. Résultat : la bêta-amyloïde, une protéine qui s'accumule dans la maladie d'Alzheimer, était éliminée plus vite pendant le sommeil. Ce réseau de drainage porte le nom de « système glymphatique », par analogie avec le système lymphatique du reste du corps. L'image d'un grand ménage nocturne est née.",
   "Cette image séduisante est pourtant discutée. En 2024, une équipe de l'Imperial College de Londres a suivi la diffusion de molécules fluorescentes dans le cerveau de souris. Elle a obtenu l'inverse : l'élimination était nettement réduite pendant le sommeil et l'anesthésie, et non augmentée. Les défenseurs du système glymphatique contestent la méthode employée, et le débat continue. Ces deux études portent sur la souris. Chez l'humain, la question n'est pas tranchée. Retenons donc ceci : le sommeil joue sans doute un rôle dans l'entretien du cerveau, mais le « nettoyage nocturne » reste une hypothèse en cours d'examen, pas un fait établi.",
   "Combien dormir ? En 2015, l'Académie américaine de médecine du sommeil et la Sleep Research Society ont réuni quinze experts. Leur conclusion : un adulte de 18 à 60 ans devrait dormir au moins 7 heures par nuit, de façon régulière. Dormir habituellement moins est associé à plusieurs problèmes de santé, comme la prise de poids, l'hypertension ou la dépression. Dormir plus de 9 heures peut convenir aux jeunes adultes, après une dette de sommeil ou en cas de maladie. Pour les autres, on ne sait pas si c'est un risque. La régularité et la qualité du sommeil comptent aussi.",
   "Reste un geste simple et agréable : le bain ou la douche chaude avant le coucher. En 2019, Shahab Haghayegh et ses collègues ont analysé 17 études sur le sujet. Une eau entre 40 et 42,5 °C était associée à une meilleure qualité de sommeil ressentie. Prise une à deux heures avant le coucher, même pendant 10 minutes seulement, elle raccourcissait le temps d'endormissement. Le mécanisme proposé semble paradoxal : la chaleur fait affluer le sang vers les mains et les pieds, qui évacuent ensuite la chaleur du corps. La température interne baisse, ce qui favorise l'endormissement. Les auteurs rappellent que les études restent peu nombreuses."

  "plaisir": "Le bain chaud montre comment plaisir et régulation travaillent ensemble. Des capteurs de la peau, les thermorécepteurs, signalent la chaleur au cerveau, qui la juge agréable tant que le corps n'est pas déjà en surchauffe. Vient ensuite une phase plus discrète : mains et pieds tièdes, muscles relâchés, paupières lourdes. Cette détente accompagne la baisse de température interne qui prépare le sommeil. D'où l'intérêt du délai d'une à deux heures, qui laisse au corps le temps de se refroidir. Le plaisir sert ici de boussole : un bain doit rester agréable, jamais brûlant.",
  "pratique": [

  "salon": "Soin & bien-être",
  "title": "Chaud et froid : sauna, eau froide et plaisir du contraste",
  "excerpt": "Le sauna est associé à un cœur en meilleure santé chez des Finlandais, l'eau froide réveille. Ce que l'on sait vraiment, et les précautions à prendre.",
  "tag": "Informer",
  "body": [
   "En Finlande, le sauna fait partie de la vie quotidienne. En 2015, Tanjaniina Laukkanen et ses collègues ont publié dans JAMA Internal Medicine une étude très commentée. Elle porte sur 2 315 hommes de 42 à 60 ans, de l'est du pays, suivis pendant une vingtaine d'années. Comparés à ceux qui allaient au sauna une fois par semaine, ceux qui y allaient 4 à 7 fois avaient un risque de mort subite cardiaque nettement plus faible, et un risque de décès toutes causes réduit lui aussi. Des séances de plus de 19 minutes étaient associées à moins de décès d'origine cardiaque.",
   "Prudence toutefois : il s'agit d'une étude observationnelle. Elle montre une association, pas un effet de cause à effet. Les hommes qui fréquentent souvent le sauna diffèrent peut-être des autres par leur santé de départ ou leur mode de vie, même si les chercheurs ont tenu compte de plusieurs facteurs de risque. L'étude ne concerne que des hommes finlandais d'âge moyen, ce qui limite la portée des résultats pour les femmes ou d'autres populations. Les auteurs eux-mêmes appellent à d'autres travaux pour comprendre les mécanismes en jeu.",
   "L'eau froide a aussi ses adeptes, de la douche fraîche au bain glacé. En 2000, une étude tchèque menée sur un petit groupe de jeunes hommes a mesuré les effets d'une heure d'immersion dans une eau à 14 °C. Dans le sang, la noradrénaline, un messager de l'éveil et de l'attention, augmentait de 530 %. La dopamine, liée à la motivation, augmentait de 250 %. Le cortisol, souvent appelé hormone du stress, avait plutôt tendance à baisser. Ces chiffres sont très cités, mais ils viennent d'une seule petite étude, avec une immersion bien plus longue que les quelques minutes habituelles. Et des mesures dans le sang ne disent pas directement ce qui se passe dans le cerveau.",
   "En 2025, une revue a rassemblé 11 essais randomisés menés chez des adultes en bonne santé, avec une eau à 15 °C ou moins. Elle trouve une baisse du stress 12 heures après l'immersion, mais pas juste après ni les jours suivants. Des améliorations du sommeil et de la qualité de vie sont rapportées, par très peu d'études, et aucun effet mesurable sur l'humeur. Les auteurs soulignent les limites : peu d'essais, de petits effectifs, des populations peu variées. Ils rappellent aussi que le froid déclenche une réaction de choc : le système nerveux sympathique, celui de l'alerte, s'active d'un coup, et le cœur comme la tension montent.",
   "Ces réactions imposent quelques précautions. Au sauna : bien s'hydrater, éviter l'alcool, sortir au moindre malaise. Dans l'eau froide : entrer progressivement, ne jamais se baigner seul en eau libre, sortir avant de trembler fortement. Les personnes qui ont une maladie cardiaque, une tension mal contrôlée ou des troubles du rythme, ainsi que les femmes enceintes, doivent demander un avis médical avant de s'y mettre. C'est d'autant plus vrai pour l'enchaînement chaud puis froid, puisque le passage brusque au froid fait grimper le rythme cardiaque et la tension."
  ],
  "plaisir": "Pourquoi l'eau froide paraît-elle délicieuse en sortant du sauna, et pénible un matin d'hiver ? En 1971, le physiologiste Michel Cabanac a décrit ce phénomène sous le nom d'alliesthésie : une même sensation devient agréable ou désagréable selon l'état intérieur du corps. Quand le corps a trop chaud, le frais est vécu comme un plaisir, parce qu'il va dans le sens de son équilibre. Le plaisir sert ainsi de guide à la régulation de la température. Le contraste chaud-froid joue avec cette boussole interne. L'élan d'éveil ressenti après le froid s'accompagne, lui, d'une forte hausse de noradrénaline.",
  "pratique": [
   "Terminez votre douche par 15 à 30 secondes d'eau fraîche, pas glacée.",

   "Notez ce que vous ressentez juste après, puis une heure plus tard.",
   "Au sauna, commencez par des séances courtes et sortez au moindre malaise.",
   "En cas de problème cardiaque, de tension ou de grossesse, demandez un avis médical avant tout essai."

  "sources": [

   "Sa deuxième arme est la parrhêsia, la liberté de tout dire, même aux puissants. Interrogé sur ce qu'il y a de plus beau chez les humains, il répond : « La franchise. » L'anecdote la plus célèbre se passe à Corinthe. Alexandre le Grand s'approche de lui et l'invite à demander ce qu'il veut. « Cesse de me faire de l'ombre », répond Diogène, qui prenait le soleil. Une autre fois, Alexandre se présente comme « le grand roi » ; Diogène réplique : « Et moi, Diogène le chien. » Capturé par des pirates et vendu comme esclave, il aurait expliqué à son acheteur, Xéniade, qu'on obéit bien à un médecin, même esclave.",
   "Diogène enseigne par le geste. En plein jour, il allume une lampe et déambule en disant : « Je cherche un homme. » Quand Platon définit l'être humain comme un « bipède sans plumes », il apporte un poulet plumé à son école : « Voici l'homme de Platon. » Platon l'aurait surnommé « un Socrate devenu fou ». Ces provocations ne visent pas le scandale pour lui-même. Elles « falsifient la monnaie », selon la formule de Diogène Laërce : elles retirent leur valeur aux usages admis pour en montrer l'arbitraire. Le cynisme antique n'a donc presque rien à voir avec notre « cynisme » d'aujourd'hui, synonyme de mépris calculé.",
   "Diogène a eu des disciples marquants. Cratès abandonne sa fortune pour vivre en cynique, et Hipparchia de Maronée, première philosophe cynique connue, partage ce mode de vie. Le stoïcisme est en partie né du cynisme : Zénon de Citium s'est formé auprès de Cratès, et Épictète admirait la figure du cynique tout en la jugeant difficile à imiter. Prudence toutefois : aucun écrit cynique ne nous est parvenu directement, et les anecdotes, transmises des siècles plus tard, ont sans doute été embellies. Des historiens comme Jean-Manuel Roubineau ou Étienne Helmer cherchent la pensée derrière la légende. Helmer soutient par exemple que Diogène ne rejetait pas la vie politique, mais voulait la réformer."

  "body": [
   "L'Enseignement de Ptahhotep appartient à un genre très apprécié dans l'Égypte ancienne : la sebayt, ou « enseignement », dans lequel un sage transmet son expérience à son fils. Le texte se présente comme l'œuvre de Ptahhotep, vizir, c'est-à-dire premier ministre, du roi Isesi (Djedkarê), de la Ve dynastie, vers le XXIVe siècle av. J.-C. Devenu vieux, Ptahhotep demande au roi la permission de former son fils pour qu'il lui succède. Le roi accepte, en remarquant que personne ne naît sage. Suit une longue série de maximes sur la conduite à tenir en réunion, face à un adversaire, devant un supérieur, en famille ou à table.",
   "Ce cadre est-il historique ? Les égyptologues en débattent. Pour Nicolas Grimal, professeur au Collège de France, le texte original remonte peut-être à la fin de l'Ancien Empire, mais l'écriture du principal manuscrit date de la XIIe dynastie, au Moyen Empire. La notice de l'University College de Londres penche pour une composition au Moyen Empire : la langue l'indique, tout comme l'expression « bâton de vieillesse », attestée dans un document juridique de cette époque. Attribuer un texte à un sage du passé lui donnait de l'autorité. Le manuscrit le plus complet, le papyrus Prisse, provient de la nécropole de Dra Abou el-Naga, à Thèbes. Prisse d'Avennes l'a offert en 1845 au Cabinet des médailles ; il est aujourd'hui à la Bibliothèque nationale de France.",
   "Au cœur du texte se trouve la Maât. Le mot désigne à la fois une déesse, fille du dieu soleil, et une idée : la justice, la vérité, l'équilibre, l'ordre du monde. Son contraire est l'isfet, le désordre et la faute, auxquels s'ajoute le mensonge. Ptahhotep l'affirme : la Maât est grande, son efficacité durable, elle n'a pas été renversée depuis le temps d'Osiris. Celui qui enfreint les lois est puni, et le crime ne profite jamais longtemps. Bien plus tard, au Nouvel Empire, le Livre des morts fera réciter au défunt une liste de fautes qu'il affirme ne pas avoir commises, comme voler le pauvre ou maltraiter le bétail.",
   "La Maât se vit au quotidien par la mesure. « Ne sois pas orgueilleux de ton savoir », recommande la première maxime : la belle parole est plus rare que la pierre verte, et pourtant on la trouve chez les servantes qui broient le grain. Face à un égal qui s'emporte, le silence montre mieux sa valeur que la riposte. Le chef doit écouter le plaignant jusqu'au bout, car une bonne écoute apaise le cœur, même quand on ne peut tout accorder. L'avidité, enfin, est décrite comme une maladie qui brouille les familles : « il n'y a pas de tombe pour le cœur avide », dit le texte.",

  "excerpt": "Six « visions » orthodoxes, des matérialistes sceptiques et un moine qui dissout les certitudes : un voyage dans la philosophie indienne classique, loin des clichés.",

  "body": [
   "Tout commence, ou presque, avec les Upanishads. Ces textes en sanskrit, composés oralement entre 700 et 300 environ avant notre ère, prolongent les Védas, les plus anciens textes sacrés de l'Inde. Le mot désigne souvent un « enseignement secret ». On y voit des maîtres et des élèves débattre du soi (ātman) et de la réalité ultime (brahman). Le sage Uddālaka répète à son fils Shvetaketu « tu es cela » (tat tvam asi), formule que des commentateurs ultérieurs liront comme l'identité du soi et de l'absolu. Des femmes, comme Gārgī et Maitreyī, prennent part aux discussions. Les historiens se demandent encore si ces textes relèvent déjà de la philosophie.",
   "Au fil des siècles s'est imposée la convention de six écoles qui reconnaissent l'autorité des Védas, les darshanas, mot qui signifie « vision ». Le Nyāya, fondé selon la tradition par Gautama (IIe siècle), étudie l'argumentation et retient quatre sources de connaissance : perception, inférence, analogie et témoignage. Le Vaisheshika décrit un monde fait d'atomes. Le Sāmkhya, systématisé vers 350 par Īshvarakrishna, distingue la conscience (purusha) de la nature (prakriti), sans faire appel à un dieu. Le Yoga de Patañjali, vers le IIIe siècle, reprend ce cadre en y ajoutant un « Seigneur ». La Mīmāmsā étudie les injonctions des Védas sur l'action juste (dharma), et le Vedānta commente les Upanishads.",
   "À côté de ces écoles, d'autres courants rejettent l'autorité des Védas : bouddhistes, jaïns et matérialistes Charvaka, aussi appelés Lokāyata. Ces derniers sont trop souvent oubliés. Pour eux, seule la perception est une source sûre de connaissance ; la conscience naît de la combinaison des éléments matériels, et il n'y a ni âme immortelle ni au-delà. Leurs textes fondateurs, comme les aphorismes attribués à Brihaspati, sont perdus : on les connaît surtout par leurs adversaires, qui les présentent volontiers en simples jouisseurs, un portrait que des chercheurs jugent réducteur. Exception précieuse : le traité de Jayarāshi (vers 800-840), retrouvé en 1926, seul ouvrage conservé de cette tradition, démonte les critères de connaissance de ses rivaux.",
   "Le bouddhisme développe lui aussi une philosophie exigeante. Le moine Nagarjuna, qui vécut probablement dans le sud de l'Inde vers 150-250, en est une figure majeure. Son œuvre principale, les Stances fondamentales de la voie du milieu, compte environ 450 strophes. Il y défend la « vacuité » (shūnyatā) : aucune chose ne possède de nature propre, d'existence indépendante (svabhāva). Tout naît en dépendance d'autre chose. Cela ne signifie pas que rien n'existe, mais que tout existe en relation. Nagarjuna distingue deux vérités : la vérité conventionnelle, celle de la vie courante, et la vérité ultime. Il critique aussi la théorie de la connaissance du Nyāya.",
   "Ces écoles ne vivaient pas séparées : elles se répondaient sans cesse, dans des débats souvent très techniques. Le Vedānta lui-même se divise. Pour Shankara (VIIIe siècle), le soi et l'absolu ne font qu'un ; pour Rāmānuja, le soi en est un aspect ; pour Madhva, ils restent distincts. Les matérialistes obligeaient leurs adversaires à justifier leurs preuves, et Nagarjuna mettait à l'épreuve les catégories de tous. L'image d'une pensée indienne uniquement mystique ne tient donc pas : on y trouve logique, théorie de la connaissance, débats sur la conscience et la causalité. L'expression même de « philosophie hindoue » est moderne et ambiguë, rappellent les spécialistes."
