document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!$("#notif-pop").hidden && !e.target.closest("#notif-pop") && !(t && t.dataset.act === "notif")) toggleNotif(false);
  if (!t) return;
  const a = t.dataset.act, v = t.dataset.v;
  switch (a){
    case "go": {
      e.preventDefault(); go(v, t.dataset.salon);
      const target = t.dataset.scroll;
      if (target) setTimeout(() => { const el = document.getElementById(target); if (el) el.scrollIntoView({block:"start"}); }, 60);
      break; }
    case "map-view": state.map.view = v; renderView(); break;
    case "map-voie": state.map.voie = v; state.map.city = null; renderView(); break;
    case "map-club": state.map.club = !state.map.club; state.map.city = null; renderView(); break;
    case "map-city": {
      state.map.city = v || null;
      if (v){ const [lon, lat] = CITIES[v]; state.map.view = inEurope({lon, lat}) ? "europe" : "monde"; }
      renderView(); break; }
    case "clike": {
      const on = !state.cliked.has(v); on ? state.cliked.add(v) : state.cliked.delete(v);
      const n = t.querySelector("span"); n.textContent = Number(n.textContent) + (on ? 1 : -1);
      t.classList.toggle("liked", on); t.setAttribute("aria-pressed", String(on)); break; }
    case "react": {
      const on = !state.reacts.has(v); on ? state.reacts.add(v) : state.reacts.delete(v);
      const n = t.querySelector(".n"); n.textContent = Number(n.textContent) + (on ? 1 : -1);
      t.setAttribute("aria-pressed", String(on)); break; }
    case "reply": { const i = $("#comment-input"); i.value = `@${v} `; i.focus(); i.scrollIntoView({block:"center"}); break; }
    case "csort": state.csort = v; $("#comments").innerHTML = commentsHTML(currentPost()); break;
    case "su-back": state.su.step -= 1; state.su.errors = {}; renderView(); break;
    case "su-voie": {
      const d = state.su.d, has = d.voies.includes(v);
      d.voies = has ? d.voies.filter(x => x !== v) : ORDER.filter(x => x === v || d.voies.includes(x));
      if (has){ const gone = BLOCS[v].groups.flatMap(g => g.salons.map(([n]) => n)); d.salons = d.salons.filter(s => !gone.includes(s)); }
      state.su.errors = {}; renderView(); break; }
    case "su-salon": {
      const d = state.su.d; d.salons = d.salons.includes(v) ? d.salons.filter(s => s !== v) : d.salons.concat(v);
      t.setAttribute("aria-pressed", String(d.salons.includes(v))); break; }
    case "su-reset": state.su = suFresh(); renderView(); window.scrollTo(0, 0); break;
    case "salon": state.salon = v && state.salon !== v ? v : null; state.feedLimit = 8; renderSidebar(); renderView(); closeDrawer(); break;
    case "filter": state.filter = v; state.feedLimit = 8; renderView(); break;
    case "more": state.feedLimit += 8; renderView(); break;
    case "like": {
      const id = Number(v), on = !state.liked.has(id);
      on ? state.liked.add(id) : state.liked.delete(id);
      const base = id === 0 ? 212 : POSTS.find(p => p.id === id).likes;
      document.querySelectorAll(`[data-act="like"][data-v="${id}"]`).forEach(btn => {
        btn.classList.toggle("liked", on); btn.setAttribute("aria-pressed", String(on));
        btn.querySelector("span").textContent = base + (on ? 1 : 0);
      });
      break; }
    case "toast": toast(v); break;
    case "soon": closeDrawer(); toast(`« ${v} » : page prévue dans une prochaine version de la maquette.`); break;
    case "locked": toast("Réservé aux membres d'Ici et Maintenant."); break;
    case "remind":
      state.remind = !state.remind; renderRail();
      if (state.view === "accueil" || state.view === "lives") renderView();
      toast(state.remind ? "Rappel activé pour mardi à 20:00." : "Rappel retiré.");
      break;
    case "liveon": state.liveOn = !state.liveOn; renderView(); break;
    case "replays": state.replayVoie = v; renderView(); break;
    case "cal-type": state.cal.type = v; renderView(); break;
    case "cal-day": state.cal.sel = v; renderView(); break;
    case "cal-prev": case "cal-next": {
      const nd = new Date(state.cal.y, state.cal.m + (a === "cal-next" ? 1 : -1), 1);
      state.cal.y = nd.getFullYear(); state.cal.m = nd.getMonth(); renderView(); break; }
    case "cal-today": { const n = new Date(); state.cal.y = n.getFullYear(); state.cal.m = n.getMonth(); state.cal.sel = dkey(n); renderView(); break; }
    case "dir-voie": state.dir.voie = v; renderView(); break;
    case "dir-flag": state.dir[v] = !state.dir[v]; renderView(); break;
    case "follow": {
      const on = !state.following.has(v);
      on ? state.following.add(v) : state.following.delete(v);
      renderView(); toast(on ? `Vous suivez ${MEMBERS[v].name}.` : "Vous ne suivez plus ce profil."); break; }
    case "ptab": state.ptab = v; renderView(); break;
    case "billing": state.billing = v; $("#pricing").innerHTML = pricingHTML(); break;
    case "scroll": { const el = document.getElementById(v); if (el) el.scrollIntoView({behavior:"smooth", block:"start"}); break; }
    case "compare": state.compare = !state.compare; renderTools(); renderChat(); break;
    case "guide": state.guide = v; renderTools(); break;
    case "suggest": { const i = $("#oracle-input"); i.value = v; i.focus(); break; }
    case "newchat": state.messages = []; state.typing = false; state.chat = "new"; renderHist(); renderChat(); $("#oracle-input").focus(); break;
    case "hist":
      state.chat = v; state.typing = false;
      state.messages = v === "zen" ? sampleChat() : [
        {role:"user", text:HIST.find(h => h.id === v).t},
        {role:"ai", model:"gpt", text:["Conversation d'exemple. Sur le vrai site, l'historique complet de vos échanges avec l'Oracle s'affichera ici."]}];
      renderHist(); renderChat(); break;
    case "pal": pickPal(Number(v)); break;
    case "menu": openDrawer(); break;
    case "close-drawer": closeDrawer(); break;
    case "palette": openPalette(); break;
    case "theme": toggleTheme(); break;
    case "notif": toggleNotif(); break;
  }
});

document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); $("#palette").hidden ? openPalette() : closePalette(); return; }
  if (e.target.id === "oracle-input" && e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("#oracle-form").requestSubmit(); return; }
  if (!$("#palette").hidden){
    if (e.key === "Escape") closePalette();
    else if (e.key === "ArrowDown"){ e.preventDefault(); palSel = Math.min(palSel + 1, palItems.length - 1); renderPal(); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); palSel = Math.max(palSel - 1, 0); renderPal(); }
    else if (e.key === "Enter"){ e.preventDefault(); pickPal(palSel); }
    return;
  }
  if (e.key === "Escape"){ closeDrawer(); toggleNotif(false); }
});

$("#notif-btn").innerHTML = ICON.bell + '<span class="notif-dot"></span>';
state.su = suFresh();
paintTheme();
route();
})();
